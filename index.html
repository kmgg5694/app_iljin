xt": "शी हे का अर्थ है दृढ़ संकल्प से बाधाओं को सीधे सामना करके सुलझाना। दिव्य मार्गदर्शन) अग्नि सा उज्ज्वल और वज्र सा शक्तिशाली — आप हर कार्य में सक्रिय और ऊर्जावान रहेंगे। जैसे भोजन जबड़ों के बीच चबाया जाता है, आप हर क्षेत्र में उत्साह और जीवंतता से भरे हैं। उद्देश्य हो तो साहसपूर्वक और निष्पक्षता से उचित क्रम में आगे बढ़ें। मार्ग में कठिनाइयां आएं तो निराश न हों — दृढ़ता से प्रयास जारी रखने पर सफलता मिल सकती है। समय के साथ मार्ग खुलता है। क्षुद्र लोगों से झगड़ा न करें। दूसरों के मामलों में अत्यधिक हस्तक्षेप और निंदा से बचें। अन्यायपूर्ण स्थिति में भी श्रद्धा के साथ गलतियां सुधारने पर दाग नहीं रहेगा। उद्यम) नया उद्यम शुरू करने का उत्तम समय है — प्रगति होगी। साहसपूर्वक आगे बढ़ें। धन) दैनिक जीवन में असुविधा नहीं। परिश्रम से महत्वपूर्ण लाभ की उम्मीद रखी जा सकती है। प्रेम) समान स्वभाव वाले से मिलन होगा। आसपास के विपरीत लिंग के संबंध जटिल हैं। जिस संबंध में सच्चाई नहीं उसे शीघ्र समाप्त करें। स्वास्थ्य) अत्यधिक मदिरापान के प्रभाव से सावधान रहें।"}, "☲☴": {"no": 21, "name": "डिंग — अग्नि के ऊपर वायु (火風鼎)", "text": "डिंग का अर्थ है तीन पैरों वाला पवित्र लोहे का कड़ाह — पवित्र पात्र के माध्यम से रूपांतरण। दिव्य मार्गदर्शन) दुर्लभ और बहुमूल्य औषधि प्राप्त होती है; पुराना त्यागा जाता है और नया अपनाया जाता है। जैसे लकड़ी अग्नि पकड़कर प्रज्वलित होती है, जो भी योजना बनाएं वह सुगम रूप से आगे बढ़ेगी। दूसरों के साथ मिलकर कार्य करने पर अप्रत्याशित लाभ की उम्मीद रखी जा सकती है। लोगों में एकता और सामंजस्य सर्वोपरि है। वरिष्ठों के प्रति आदर और अधीनस्थों के प्रति उदारता रखें। उद्यम) उद्यम की सामग्री और प्रस्तुति को नवीन करना महत्वपूर्ण है। उत्तम सहयोगी पाकर कार्य आगे बढ़ाएं। समान विचार वाले तीन साथी मिलकर लाभ समान रूप से बांटें। लेनदेन में पहले दूसरे पक्ष की स्थिति और हित सोचें। धन) प्रचुरता है। धन को विभिन्न दिशाओं में संचालित करना होगा। प्रेम) बौद्धिक और स्वभाव में उपयुक्त स्त्री से संबंध होगा। स्त्रियों के लिए साथी सुंदर और योग्य दिखता है। सच्चाई हो तो विवाह प्रस्ताव सुगम होगा। स्वास्थ्य) संक्रामक रोग, श्वसन रोग और आंत के रोगों से सावधान रहें।"}, "☲☵": {"no": 22, "name": "वेई जी — अग्नि के ऊपर जल (火水未濟)", "text": "वेई जी का अर्थ है वह जो अभी पूर्ण नहीं हुआ — पूर्णता समीप है, आ रही है। दिव्य मार्गदर्शन) यद्यपि यिन और यांग ने अभी अपना उचित स्थान नहीं पाया, वे एक-दूसरे के साथ सामंजस्य में हैं। पूर्णता की ओर स्थिर गति से आगे बढ़ना अब शुरू हो चुका है। थोड़ी कठिनाई हो तो प्रतीक्षा करें — शुभ काल शीघ्र आएगा। अतः सही समय की प्रतीक्षा करना, शांत रहना और दृढ़ता से वास्तविक क्षमता बनाना सबसे महत्वपूर्ण है। यह उत्तम काल है जब भविष्य की आशा दिखती है। उद्यम) प्रारंभ सुगम न हो तो भी समय के साथ प्रगति संचित होती है। कठिनाइयों में बीच में कभी हार न मानें। प्रगति की गति धीमी हो तो चिंता की आवश्यकता नहीं। पहले मजबूत नींव रखें; दृढ़ता से प्रयास करने पर सफलता की उम्मीद रख सकते हैं। वार्ता में जिद्दी दृढ़ता से लक्ष्य प्राप्त होगा। धन) प्रचुर नहीं किंतु दैनिक जीवन में असुविधा नहीं। प्रेम) हृदय के अनुकूल व्यक्ति से मिलन होगा। विवाह की योजना रखने वालों को हस्तक्षेप और कठिनाई आएगी। किंतु प्रयास से सफलता मिलेगी। स्वास्थ्य) स्वस्थ हैं और शक्ति प्रबल है। संक्रामक रोगों से सावधान रहें।"}, "☲☶": {"no": 23, "name": "लू (火山旅) — अग्नि के ऊपर पर्वत", "text": "लू का अर्थ है यात्री — मार्ग पर भटकने वाले की यात्रा। दिव्य मार्गदर्शन) यात्री की यात्रा में चिंता और एकाकीपन होता है। फिर भी शीघ्रता न करें — दृढ़ता और धैर्य से लक्ष्य की ओर बढ़ते रहें। आक्रामक रूप से कार्य करने से पहले अपनी क्षमता बढ़ाएं और समय-स्थान के अनुसार कार्य करें। लक्ष्य स्पष्ट करें और नींव मजबूत रखें — चिंता स्वतः दूर होगी। मन सीधा और सच्चा रखें — आशीर्वाद स्वाभाविक रूप से मिलेगा। कठिनाई हो तो विश्वसनीय वरिष्ठ या साथी की सहायता लें। उद्यम) नए उद्यम शुरू करना या विस्तार करना इस समय अनुकूल नहीं। किंतु बाहरी बिक्री और सांस्कृतिक उद्यम लाभकारी हैं। दूसरे की स्थिति और हित पहले सोचें। धन) छोटी रकम आती है, बड़ी जाती है। विलासिता और अपव्यय कम करें। प्रेम) बड़े आयु अंतर वाला संबंध है। साझी शिक्षा या संयुक्त उद्यम से मिलने पर सामंजस्यपूर्ण संबंध बनेगा। स्वास्थ्य) पुराना रोग हो तो शीघ्र उपचार करें। महामारी और शारीरिक क्षीणता से सावधान रहें।"}, "☲☷": {"no": 24, "name": "जिन — अग्नि के ऊपर पृथ्वी (火地晉)", "text": "जिन का अर्थ है उन्नति — आगे बढ़ना और ऊपर उठना। दिव्य मार्गदर्शन) बुद्धिमान राजा गुणी मंत्री से मिलता है — श्रेष्ठ संरेखण का चित्र। जैसे सूर्य महान पृथ्वी के ऊपर उठता है और संसार को तेजस्वी प्रकाश से आलोकित करता है, नई और ऊर्जावान गतिविधि प्रकट होगी। मजबूत नींव ही सफलता को संभव बनाती है। साहसी सेनापति की भांति आत्मा शक्तिशाली और दृढ़ है — आसपास की ईर्ष्या या कार्य में कठिनाई हो तो शांति से सामना करने पर कोई समस्या नहीं। उद्यम) नई योजनाएं बनती हैं और उद्यम का विस्तार होता है। महान संकल्प रखें। प्रतिस्पर्धा तीव्र है किंतु परिश्रम से उत्तम फल मिलता है। लेनदेन में योजना बनाकर सक्रिय रूप से आगे बढ़ें — अनिर्णय से सर्वथा बचें। कार्य में पदोन्नति होगी। ऊपर से मार्गदर्शन और नीचे से सहयोग — उद्यम की प्रगति की उम्मीद रख सकते हैं। धन) प्रारंभ में प्रचुर नहीं किंतु धीरे-धीरे बड़ी आय आएगी। निवेश या शेयर से लाभ संभव है। प्रेम) उज्ज्वल और आनंदमय प्रेम होता है। सुंदर नियति का बंधन समीप है। स्वास्थ्य) संक्रामक रोगों से सावधानी से बचें।"}, "☳☰": {"no": 25, "name": "दा ज़ुआंग — वज्र के ऊपर स्वर्ग (雷天大壯)", "text": "दा ज़ुआंग का अर्थ है महान और ऊर्जावान समृद्धि — असाधारण शक्ति और पराक्रम। दिव्य मार्गदर्शन) स्वर्ग के ऊपर वज्र हजारों योजन को कंपित करता है किंतु नीचे नहीं उतरता। इसी प्रकार भाग्य अत्यंत प्रबल होने पर भी संयम और धैर्य बनाए रखना होगा। प्रबल और ऊर्जावान आकांक्षा से विस्तार तो होगा किंतु उतावलेपन से बचना होगा। कभी-कभी मानसिक विश्राम और सुकून आवश्यक है। वज्र हजारों योजन गूंजता है किंतु केवल ध्वनि है, रूप नहीं — सार के बिना उद्यम शुरू करने पर विफलता आएगी। धर्म-विरुद्ध कार्य से बचें और उत्तम सहयोगी खोजें। जो आसपास के लोगों के साथ उदारता से बांटते हैं उन्हें भविष्य में आशीर्वाद के रूप में लौटता है। उद्यम) नए उद्यम शुरू करने या विस्तार करने का समय है। भाग्य प्रबल है — सावधानीपूर्वक योजना और सतर्कता से सुगम प्रगति होती है। लेनदेन में कोमलता से व्यवहार करने पर उत्तम फल मिलता है। वाहन चलाते समय तीव्रगति और मदिरापान के बाद गाड़ी चलाने से बचें। धन) आरामदायक और प्रचुर। अभी से बचत करने पर भविष्य में सुविधा होगी। प्रेम) रोमांटिक और उत्साहपूर्ण प्रेम होता है। शांति और गंभीरता आवश्यक है। स्वास्थ्य) सामान्यतः स्वस्थ किंतु पाचन रोग हो तो बिगड़ने न दें।"}, "☳☱": {"no": 26, "name": "गुई मेई — वज्र के ऊपर झील (雷澤歸妹)", "text": "गुई मेई का अर्थ है सावधान प्रतीक्षा के साथ सही ऋतु की राह देखना। दिव्य मार्गदर्शन) यिन और यांग एक-दूसरे के साथ सामंजस्य बनाने का प्रयास कर रहे हैं। धर्म के मार्ग पर दृढ़ रहने से शांतिपूर्ण और स्थिर दिन आएंगे। किंतु भावनाओं में बह जाने और तर्कशक्ति खोने से हानि होगी। नए उद्यम में शीघ्रता न करें; धैर्य के साथ तैयारी करते हुए उचित अवसर की प्रतीक्षा करें। नए प्रयास की सफलता के लिए शुभ आरंभ आवश्यक है। उद्यम) नए उद्यम को जबरदस्ती शुरू करने से अशुभ फल मिलता है — वर्तमान को बनाए रखने पर ध्यान दें। नया करना हो तो पूरी तरह परखकर फिर आगे बढ़ें। दूसरे के साथ वार्ता सुगम न हो तो भी उतावला व्यवहार न करें। सामान्य प्रक्रिया नज़रअंदाज़ करने पर कठिनाइयां आती हैं। धन) छोटी रकम आती है, बड़ी जाती है। व्यय प्रबंधन पर ध्यान दें। प्रेम) जटिल और मनोरंजक संबंध से बचना उचित है। विपरीत लिंग के विषय में सावधान रहें। स्त्रियों के लिए विशेष सावधानी आवश्यक है। स्वास्थ्य) तंत्रिका संवेदनशीलता और चिड़चिड़ापन से सावधान रहें।"}, "☳☲": {"no": 27, "name": "फेंग — वज्र के ऊपर अग्नि (雷火豊)", "text": "फेंग का अर्थ है प्रचुरता और भरपूर परिपूर्णता। दिव्य मार्गदर्शन) अंधकार से दूर रहकर प्रकाश की ओर बढ़ने का मार्ग है। जब सूर्य मध्याकाश में हो तो संसार उज्ज्वल और दीप्तिमान होता है। इसी प्रकार आपका भाग्य प्रबल और ऊर्जावान है — फलों की प्रचुर फसल की उम्मीद रख सकते हैं। किंतु जैसे पूर्ण चंद्रमा क्षीण होने लगता है, बाहरी ऊर्जा के बावजूद भीतरी शक्ति धीरे-धीरे कमज़ोर पड़ने लगती है। लंबे समय से खिंचा कोई मामला हो तो शीघ्र समाप्त करें। त्वरित और स्पष्ट निर्णय और कुशलता आवश्यक है। उद्यम) प्रगति सुगम है। किंतु नया उद्यम शुरू करने की बजाय जो समृद्ध है उसे सुदृढ़ रूप से चलाना अधिक महत्वपूर्ण है। आंतरिक प्रबंधन में ईमानदारी आवश्यक है। दूसरे के साथ लेनदेन में शीघ्र निर्णय लाभकारी है। धन) धन का भाग्य प्रबल है। किंतु बाहरी दिखावे और विलासिता पर व्यय रोकें। अभी से बचत करना उचित है। प्रेम) भौतिक, बाहरी और मनोरंजक प्रेम की प्रवृत्ति है। दूसरे की बाहरी चमक-दमक से न भ्रमित हों — भीतरी स्वभाव और सच्चाई पहचानें। विवाह की योजना रखने वालों के लिए व्यावहारिक और घरेलू मामले पहले सुलझाएं। स्वास्थ्य) परिवर्तन का काल है — नियमित पोषण और स्वास्थ्य प्रबंधन आवश्यक है। महामारी और तीव्र रोगों से सावधान रहें।"}, "☳☳": {"no": 28, "name": "झेन — वज्र के ऊपर वज्र (震為雷)", "text": "झेन का अर्थ है वज्र — वह महान गड़गड़ाहट जो चारों दिशाओं को कंपित करती है। दिव्य मार्गदर्शन) जैसे वज्र चारों दिशाओं में गूंजता और कंपित करता है, यदि आप दृढ़ता से लक्ष्य निर्धारित करके प्रयास करें तो सुगम रूप से उद्देश्य प्राप्त होगा। किंतु जैसे वज्र बड़ा शोर करता है पर वास्तविक सार नहीं होता, पहले लक्ष्य और योजना निश्चित और स्पष्ट बनाएं। स्वयं को निखारें और आत्मचिंतन करें। कठिनाई हो तो उतावला व्यवहार न करें — वरिष्ठ या विश्वसनीय सहयोगी की सहायता लें। उद्यम) दो उद्यम एक साथ शुरू करने की प्रवृत्ति है। किंतु योजनाएं बहुत बड़ी हों और शक्ति बिखरे तो वास्तविक लाभ मिलना कठिन होगा। दूसरे के साथ लेनदेन में तत्काल लाभ की बजाय दीर्घकालिक दृष्टि रखें। प्रतिस्पर्धी सरलता से आ सकते हैं — कार्य को गुप्त रूप से आगे बढ़ाएं। धन) धन का भाग्य है किंतु एक बार में नहीं आता। धीरे-धीरे खुलता जाएगा। प्रेम) जीवंत और उत्साहपूर्ण संबंध विकसित होता है। दोनों में गंभीरता की कमी हो तो विवाह तक की उम्मीद नहीं रख सकते। स्वास्थ्य) यकृत से संबंधित रोगों का ध्यान रखें।"}, "☳☴": {"no": 29, "name": "हेंग — वज्र के ऊपर वायु (雷風恒)", "text": "हेंग का अर्थ है स्थिरता — सभी ऋतुओं में अटल दृढ़ता। दिव्य मार्गदर्शन) जैसे सूर्य और चंद्रमा निरंतर संसार को अपने प्रकाश से आलोकित करते हैं, दैनिक जीवन की लय बनाए रखने से स्थिरता और आनंद मिलता है। शांतिपूर्ण और सुखद दिन आएंगे। विवेकी व्यक्ति आसानी से अपना उचित स्थान नहीं छोड़ता — शाश्वत स्थिरता के सद्गुण का अनुसरण करता है। धैर्य बनाए रखें और दृढ़ता से प्रयास करते रहें। जीवन की एकरसता बोरियत ला सकती है, परिवर्तन की इच्छा और कुंठा जन्म ले सकती है — किंतु दृढ़ और स्थिर मान्यताएं रखें और भावनाओं में न बहें। उद्यम) अत्यधिक विस्तार या नई योजनाएं अनुकूल नहीं हैं। अब तक बनाए उद्यम को ईमानदारी और दृढ़ता से बनाए रखें। भीतरी सार चुपचाप संचित हो रहा है — दृढ़ता से प्रयास करने पर प्रगति की उम्मीद रख सकते हैं। दीर्घकालिक दृष्टि से वार्ता करना अनुकूल है। धन) धन का भाग्य अच्छा है — धन प्रचुर है और कोई दबाव नहीं। प्रेम) स्थिर और सामंजस्यपूर्ण संबंध विकसित होता है। दीर्घकालिक बंधन बन सकता है। विवाह तक थोड़ी कठिनाई है किंतु एक बार हो जाए तो उत्तम है। स्वास्थ्य) नियमित और संयमित जीवन से रोग रोकें। पीठ के रोगों से सावधान रहें।"}, "☳☵": {"no": 30, "name": "जिए (雷水解) — वज्र के ऊपर जल", "text": "जिए का अर्थ है मुक्ति और समाधान — जो जमा-जमाया था वह पिघलकर खुलता है। दिव्य मार्गदर्शन) जैसे सर्दियों में जमी बर्फ गर्म वसंत के आगमन पर पिघलती है, आप उत्तम सहयोगी पाएंगे और ताजी ऊर्जावान गतिविधि में संलग्न होंगे। अब तक जो अवरुद्ध या कठिन था वह सुलझने लगेगा। इस ऋतु में गतिविधि ही कष्ट से मुक्ति का मार्ग है — लक्ष्य निर्धारित करें। सुस्ती से उत्तम भाग्य बर्बाद होगा। दक्षिण-पश्चिम दिशा लाभकारी है — वहां जाने पर सहयोगी मिलेंगे। आपके साथ आने वाले बढ़ेंगे। जब कहीं जाने या कोई काम करने की विशेष आवश्यकता न हो — स्थिर रहें और क्षमता बढ़ाएं, यही बुद्धिमानी है। उद्यम) गतिविधि गहन और व्यस्त है। कुशल और सक्षम सहयोगियों के निकट रहने से उत्तम फल मिलेगा। संगठनों में कार्यरत लोग स्थानांतरण या पद परिवर्तन देख सकते हैं। धन) छोटी-छोटी बचत से बड़ी संपत्ति बनती है। प्रयास से बड़ा भौतिक पुरस्कार मिलेगा। प्रेम) भावुक और मनोरंजक प्रेम होता है। भावनाओं पर नियंत्रण आवश्यक है। सबसे बढ़कर सच्चाई आवश्यक है। स्वास्थ्य) यह स्वस्थ काल है — मामूली रोग जल्दी ठीक होते हैं। पाचन रोगों का ध्यान रखें।"}, "☳☶": {"no": 31, "name": "शियाओ गुओ — वज्र के ऊपर पर्वत (雷山小過)", "text": "शियाओ गुओ का अर्थ है अल्प अति — उचित मात्रा से थोड़ा बहुत अधिक जाना। दिव्य मार्गदर्शन) जो उचित सीमा से अधिक जाता है वह अंततः हानि पहुँचाता है। विनम्रता और संयम के साथ कार्य करने और जो अनुचित रूप से अपना नहीं है उसकी लालसा न रखने से शांति और सुकून मिलता है। अपनी उचित सीमा में न रहने वालों को स्वयं पर नियंत्रण रखना होगा। क्षुद्र लोगों के निकट जाने से हानि होती है। उद्यम) छोटे कार्य इच्छा के अनुसार सुगम हैं किंतु लोगों में एकता आवश्यक है। घमंड से सर्वथा बचें। नए उद्यम का आकार घटाएं और आंतरिक प्रबंधन पर ध्यान दें। धन) आय अपेक्षा से कम और व्यय अधिक है। विलासिता और अपव्यय कम करें। आसपास के लोगों की चापलूसी से सावधान रहें। प्रेम) परस्पर सच्चाई हो और संदेह न हो तो मार्ग सुगम होगा। स्वास्थ्य) पोषण और शारीरिक देखभाल पर ध्यान दें।"}, "☳☷": {"no": 32, "name": "यू — वज्र के ऊपर पृथ्वी (雷地豫)", "text": "यू का अर्थ है प्रत्याशा और तैयारी — आने वाले के लिए आनंदमय तत्परता। दिव्य मार्गदर्शन) वज्र पृथ्वी के भीतर से उभरता है और संसार को कंपित करता है — समस्त वनस्पतियां हिलती-डुलती हैं। इसी प्रकार उत्तम ऋतु से मिलने पर आपकी वास्तविक प्रतिभा को उचित पहचान मिलेगी। आपकी स्थिति ऊंची होगी और नई आशा सामने आएगी। जैसे दृढ़ योजना बनाने वाले नेता का अनुसरण लोग बिना शिकायत के करते हैं — जो प्राप्त करना चाहते हैं उसकी पूर्ण तैयारी करें और स्पष्ट योजना बनाएं। अहंकार त्यागकर और परिस्थितियों को सावधानी से परखकर चलने से परिणाम और भी ठोस होंगे। उद्यम) बिना शीघ्रता के क्रमबद्ध रूप से आगे बढ़ने पर प्रगति होगी। आंतरिक प्रबंधन में ईमानदारी आवश्यक है। नए कार्य शुरू करने का भी उत्तम समय है। वार्ता सुगम रूप से होगी। धन) बड़ी राशि आती है किंतु व्यय भी बढ़ता है। वास्तविक सार पाने के लिए अपव्यय कम करें। प्रेम) सामाजिक आत्मविश्वास है और अनेक स्त्रियां आकर्षित होती हैं। सावधान रहकर सच्चा हृदय रखने पर आदर्श नियति का साथी मिलेगा। प्रेम भावनात्मक और उज्ज्वल होता है। स्वास्थ्य) शरीर स्वस्थ है — मामूली रोग भी जल्दी ठीक होते हैं। खाद्य विषाक्तता से सावधान रहें।"}, "☴☰": {"no": 33, "name": "शियाओ श्यू — वायु के ऊपर स्वर्ग (風天小畜)", "text": "शियाओ श्यू का अर्थ है अल्प संचय — धीरे-धीरे एकत्र करना और निर्माण करना। दिव्य मार्गदर्शन) वायु स्वर्ग के ऊपर बहती है जैसे वर्षा होने वाली हो, किंतु आसानी से नहीं होती। सभी वस्तुओं की अपनी पूर्ण समृद्धि की ऋतु होती है — जैसे पृथ्वी के गहरे सिंचित होने की प्रतीक्षा हो। अपनी आंतरिक परिस्थितियों पर भलीभांति विचार करें; शीघ्रता लाभकारी नहीं। उचित समय की प्रतीक्षा करें और दृढ़ता से प्रयास करते रहें। उतावलेपन की बजाय सावधानी लाभकारी है। उद्यम) धन का भाग्य है और कम नहीं बल्कि अच्छा-खासा लाभ होगा। किंतु नए उद्यम में विस्तार करना कठिन है — वर्तमान कार्य में ईमानदारी से लगे रहें। वार्ता में देरी होती है और अक्सर दूसरे पक्ष की प्रतिक्रिया की प्रतीक्षा करनी पड़ती है। धन) छ नशील प्रकृति के रोगों से सावधान रहें।"}, "☴☶": {"no": 39, "name": "जियान (風山漸) — वायु के ऊपर पर्वत", "text": "जियान का अर्थ है क्रमिक उन्नति — एक-एक कदम दृढ़ता से आगे बढ़ना। दिव्य मार्गदर्शन) महान वस्तु छोटी-छोटी चीज़ों के संचय से बनती है। जैसे युवा हंस जल से पत्थर और फिर डाल पर जाता है, जैसे वृक्ष थोड़ा-थोड़ा बढ़ता है — क्रमिक और स्थिर प्रगति ही आपका मार्ग है। जल्दबाजी और लापरवाही से काम करना उचित नहीं। सावधानीपूर्वक एक-एक कदम प्रयास करते रहने से आप अंततः अनेकों की प्रशंसा और ईर्ष्या का विषय बनेंगे। मन सीधा और सच्चा रखें — तभी लाभ होगा। उद्यम) दृढ़ धैर्य से भविष्य में प्रगति और विकास की उम्मीद रख सकते हैं। लेनदेन में उचित क्रम और प्रक्रिया का पालन करना लाभकारी है। धन) प्रचुरता धीरे-धीरे संचित होगी। अप्रत्याशित लाभ भी हो सकता है। प्रेम) आदर्श साथी के साथ आशीर्वादपूर्ण प्रेम होगा। विवाह की योजना रखने वालों को आसपास के समर्थन से सुखद और सुगम तरीके से सफलता मिलेगी। स्वास्थ्य) पाचन तंत्र के रोगों से सावधान रहें।"}, "☴☷": {"no": 40, "name": "गुआन — वायु के ऊपर पृथ्वी (風地觀)", "text": "गुआन का अर्थ है अवलोकन — सावधानी और स्पष्टता के साथ देखना और अनुभव करना। दिव्य मार्गदर्शन) जैसे सूर्य और चंद्रमा विशाल आकाश के नीचे समस्त सृष्टि को आलोकित करते हैं, जैसे पृथ्वी पर बहती वायु हमें अपने परिवेश का अवलोकन करने और आत्मचिंतन के लिए बुलाती है — विशेषकर शिक्षा के विषयों में — संसार को केवल आदर्शवादी दृष्टि से देखना उचित आसन नहीं है। खुलेपन और दूसरों के साथ सहयोग का स्वभाव आवश्यक है। सामान्य जीवन में विनम्रता से रहने और सद्गुण संचय करने से आशीर्वाद स्वतः आएगा। उद्यम) नए विस्तार में सावधानीपूर्वक विचार आवश्यक है। पहले स्पष्ट और शीतल विवेक और अवलोकन शक्ति आवश्यक है। धन के प्रति अत्यधिक लालच उचित नहीं। धन) उचित मात्रा में भौतिक लाभ समय के साथ आएगा। लालच त्यागकर ईमानदारी से प्रयास करने पर धन स्वाभाविक रूप से आएगा। प्रेम) आदर्श संबंध होगा। किंतु विवाह के विचार वाले के लिए आसपास की परिस्थितियों के कारण समय लग सकता है। यदि संबंधित स्त्री का स्थिर व्यवसाय हो तो सुगम होगा। पुरुषोचित दृढ़ता और पहल आवश्यक है। स्वास्थ्य) सामान्यतः स्वस्थ काल। भूख न लगने पर सावधान रहें।"}, "☵☰": {"no": 41, "name": "श्यू — जल के ऊपर स्वर्ग (水天需)", "text": "श्यू का अर्थ है प्रतीक्षा — सही और नियत समय की धैर्यपूर्वक प्रतीक्षा। दिव्य मार्गदर्शन) जैसे बादल स्वर्ग पर उठते हैं, वर्षा बनते हैं और फिर नीचे आते हैं — इस चक्र में समय लगता है। जैसे वर्षा को पृथ्वी पर पड़ने में अपना समय चाहिए, आपको अपनी ऋतु की प्रतीक्षा करनी होगी। चिंता को नियंत्रित करें; उदार और दयालु आत्मा ही महान सफलता दिलाती है। उचित अवसर की प्रतीक्षा करते हुए बीच में सद्गुण संचय करते रहें। मन सीधा और स्पष्ट रखने से शीघ्र ही उत्तम फल मिलेगा। जहां भी जाएं, अंततः सफलता ज़रूर होगी। उद्यम) भविष्य आशाजनक है — किंतु पहले परिवेश और नींव की जांच करना आवश्यक है। वार्ता और लेनदेन में चिंतित न हों — उचित समय की प्रतीक्षा से वास्तव में सुगम हो जाएगा। जल्दबाजी से विवाद हो सकता है। धन) दैनिक जीवन में असुविधा नहीं। प्रेम) पहले दैनिक जीवन में स्थिरता लाने से सुगम और सामंजस्यपूर्ण संबंध होगा। आपका साथी अभी कुछ कठिनाइयों से गुज़र रहा हो सकता है। किंतु वे भविष्य में प्रगति और विकास की उम्मीद रखने वाले हैं। साथी का ध्यान या इरादा कहीं और हो सकता है — कई संभावनाएं तलाशना उचित है। समय के साथ उत्तम जीवनसाथी मिलेगा। स्वास्थ्य) सामान्यतः स्वस्थ, किंतु कुछ स्थितियों पर ध्यान देना आवश्यक है।"}, "☵☱": {"no": 42, "name": "जिएह (水澤節) — जल के ऊपर झील", "text": "जिए का अर्थ है संयम और अनुशासन — सभी वस्तुओं को नियंत्रित करने वाला उचित माप। दिव्य मार्गदर्शन) जैसे चारों ऋतुएं बिना अपने नियत समय को धोखा दिए आती हैं, जो प्राप्त करना चाहते हैं उसके लिए प्राकृतिक क्रम और अनुशासन की आत्मा आवश्यक है। न अति न न्यूनता — स्थिर और संतुलित मुद्रा आदर्श है। संयम अत्यधिक होने से प्रगति रुक जाती है; अपने सिद्धांतों को मार्गदर्शक बनाएं और सभी कार्य प्राकृतिक क्रम में करें। आशीर्वाद आपके पीछे-पीछे आएगा। उद्यम) छोटे उद्यम ईमानदारी और दृढ़ता से प्रयास करने पर अच्छा-खासा लाभ देंगे। किंतु बड़े उद्यम सावधानीपूर्वक आगे बढ़ाने से ही विफलता नहीं होती। लेनदेन और वार्ता में अत्यधिक लालच के साथ न आएं। पहले दूसरे पक्ष के हित और इरादे स्वीकार करें — तभी सुगम होगा। धन) भौतिक संपत्ति प्रचुर हो तो भी बचत करनी होगी। इस समय अनावश्यक व्यय अधिक है। प्रेम) संबंध काफी गहरा हो चुका है — अल ext": "मेंग का अर्थ है यौवन और अनुभवहीनता — वह अपरिपक्व अवस्था जिसने अभी तक मार्ग नहीं खोजा। दिव्य मार्गदर्शन) पर्वत के नीचे एक झरना कठिनाई और बाधा के साथ उठता है। स्पष्ट दृष्टिकोण बनाना आसान नहीं है — लापरवाह कार्य से सर्वथा बचना होगा। जैसे शिष्य को गुरु से शिक्षा और ज्ञान लेना होता है, ध्यान से और ग्रहणशील भाव से सुनना ही आवश्यक है। उत्तम सहयोगियों के साथ शक्ति जोड़ने पर आकांक्षाएं सुगम रूप से पूर्ण होती हैं। विकास की संभावना असीमित है — भविष्य की ओर देखें और पर्वत की दृढ़ता और भार से सद्गुण संचय करें। उद्यम) वरिष्ठों और वरिष्ठ साथियों की सलाह सुनकर उद्यम योजना बनाएं। वार्ता और लेनदेन में योग्य व्यक्ति को सौंपना भी उत्तम है। पहले निश्चित फल नहीं मिले तो भी धीरे-धीरे सुधार होगा। धन) अनिश्चित उद्देश्यों के लिए व्यय अधिक होगा — आंतरिक प्रबंधन में ईमानदारी से लगें और व्यय पर ध्यान दें। प्रेम) दूसरा पक्ष उत्साही हो तो भी स्वयं स्पष्ट निर्णय नहीं ले पाते और अस्पष्ट व्यवहार करते हैं। थोड़ी प्रतीक्षा करें — आदर्श विवाह के लिए सही समय आएगा। स्वास्थ्य) लक्षणों का कारण अक्सर अस्पष्ट होता है। श्वसन रोगों से सावधान रहें।"}, "☶☶": {"no": 55, "name": "गेन — पर्वत के ऊपर पर्वत (艮為山)", "text": "गेन का अर्थ है स्थिरता और निवास — अपने उचित स्थान पर दृढ़ और अटल रहना। दिव्य मार्गदर्शन) यह समय उस कार्य की रक्षा करने और अपनी उचित स्थिति में ईमानदारी से बने रहने का है। जैसे पर्वत एक स्थान पर दृढ़ रहता है, अटल हृदय और अडिग सत्यनिष्ठा के साथ उत्तम ऋतु के आने की प्रतीक्षा करें। उतावलेपन से चलने की बजाय भविष्य के लिए वास्तविक क्षमता बनाना बुद्धिमान मार्ग है। समय और स्थान के अनुसार आगे बढ़ने और पीछे हटने में स्पष्टता रखें। जब रुकने का समय हो तब रुकें; जब कार्य का समय हो तब करें। जहां प्रगति हो रही है उन क्षेत्रों में महान उपलब्धि संभव है। उद्यम) दो उद्यम एक साथ करने की बजाय एक पर ध्यान केंद्रित करना अधिक लाभकारी है। शक्ति का बिखराव रोकना होगा। सक्रिय रूप से लेनदेन से पहले दूसरे पक्ष को दूर से परखें। कार्य करने की इच्छाशक्ति है किंतु कार्यभार पहले से अधिक हो तो पहले शक्ति बढ़ाकर फिर नई शुरुआत करना बुद्धिमानी है। उचित परिस्थितियों में संसाधनशीलता और अनुकूलनशीलता का उपयोग करें। धन) तत्काल धन प्र ंगे; क्षुद्र चरित्र वाले पतन को प्राप्त होंगे। उद्यम) यह वह ऋतु है जब परिणाम प्रयास से बहुत अधिक मिलते हैं। छोटे निवेश से बड़ा लाभ होगा। सक्रिय और साहसी दृष्टिकोण से वार्ता और लेनदेन आसानी से होगा। आंतरिक प्रबंधन पर और अधिक ध्यान देना आवश्यक है। धन) बड़ी आय की उम्मीद रख सकते हैं। अप्रत्याशित लाभ संभव है और धन प्रवाह सुगम है। प्रेम) उत्तम साथी से परिचय हो सकता है। वह स्त्री जो पुरुष पर निर्भर करती है और साथ ही संबंध के माहौल को सुंदरता से आगे ले जाती है। स्त्रियों के लिए संबंधित पुरुष उदार हृदय वाला और आदर्श है। विवाह के लिए उचित समय है। स्वास्थ्य) शरीर स्वस्थ है किंतु कभी-कभी अनुशासनहीन जीवन से रोग हो सकते हैं। सिरदर्द से सावधान रहें।"}, "☷☱": {"no": 58, "name": "लिन — पृथ्वी के ऊपर झील (地澤臨)", "text": "लिन का अर्थ है शासन करना और मार्गदर्शन देना — प्रत्येक परिस्थिति का संसाधनशीलता और चपलता के साथ सामना करना। दिव्य मार्गदर्शन) जैसे मछली और अजगर खुले समुद्र और नदी से मिलते हैं — जैसे वसंत और ग्रीष्म में यांग ऊर्जा बढ़ती और फलती-फूलती है, यह महान अपेक्षित गतिविधि और उपलब्धि का काल है। किंतु ठीक इसलिए क्योंकि भाग्य प्रबल है, बहुत आगे भागने की प्रवृत्ति भी होती है। नया कार्य शुरू करना ठीक है, किंतु सभी कार्यों में सोच-समझकर आगे बढ़ना होगा। भविष्य के लिए तैयारी और सावधानी भी रखें। परिवर्तन के समय आसपास के सहयोगियों के साथ मिलकर काम करें। किंतु ऐसे भाग्य के साथ भी स्वयं को अहंकार में डूबने से बचाना होगा। उद्यम) नया उद्यम शुरू करने पर सुगम रूप से आगे बढ़ता है। किंतु सोच-समझकर सावधानी आवश्यक है। दूसरे के साथ लेनदेन और वार्ता में कट्टर रवैये की बजाय संतुलित और मापा दृष्टिकोण अधिक लाभकारी है। धन) अतिरिक्त है। किंतु विलासिता की प्रलोभन होती है — व्यय सावधानी से करना होगा। प्रेम) उज्ज्वल और मधुर प्रेम होता है। किंतु विवाह के विषय में दूसरा पक्ष पारिवारिक परिस्थितियों का हवाला देकर संकोच कर सकता है। उत्तम साथी से मिलने का समय है — इसे सफल बनाने के लिए प्रयास करें। स्वास्थ्य) स्वास्थ्य अच्छा होने से मामूली रोग भी आसानी से ठीक होते हैं। हल्के लक्षणों को गंभीर रोग न समझें। श्वसन तंत्र का ध्यान रखें।"}, "☷☲": {"no": 59, "name": "मिंग यी — पृथ्वी के ऊपर अग्नि (地火明夷)", "text": "मिंग य
