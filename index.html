<style>
/* ── 힌디 폰트: 기기 내장 폰트 사용 (외부 의존성 없음) ── */

/* ── CSS 변수 ── */
:root{
  --font-hi:"Noto Sans Devanagari","Mangal","Arial Unicode MS",sans-serif;
  --bg:#ffffff;  --bg2:#e8dfc8; --bg3:#d8c8a8;
  --gold:#c8a84b; --gold2:#a07828; --gold3:#7a5810;
  --text:#2a2010; --dim:#5a3010; --border:#c0a060; --r:12px;
}

/* ── 폰트 오버라이드 ── */
body.lang-hi,
body.lang-hi *{font-family:var(--font-hi),sans-serif !important;}
body.lang-en .fortune,body.lang-en .c-name{line-height:1.75;}

/* ── 기본 ── */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--text);
  font-family:'Noto Serif KR','Noto Serif',Georgia,serif;
  max-width:480px;margin:0 auto;padding-bottom:100px;min-height:100vh;
  font-size:16px;}

/* ── 언어 전환 ── */
.lang-sw{display:flex;justify-content:center;gap:6px;padding:10px 0;background:var(--bg2);}
.lsw-btn{padding:7px 15px;font-size:15px;font-weight:700;border:1px solid #aaa;
  border-radius:6px;background:rgba(255,255,255,0.7);color:#555;
  cursor:pointer;font-family:inherit;min-width:44px;text-align:center;}
.lsw-btn.active{background:rgba(255,255,255,0.95);color:#111;border-color:#555;}
#langBtn{padding:7px 15px;font-size:15px;font-weight:700;
  border:1px solid #aaa;border-radius:6px;
  background:rgba(255,255,255,0.8);color:#555;cursor:pointer;font-family:inherit;}

/* ── 헤더 ── */
.hdr{background:linear-gradient(180deg,#fff8ee 0%,var(--bg2) 100%);
  padding:26px 16px 18px;border-bottom:1px solid var(--border);}
.hdr-row{display:flex;align-items:center;justify-content:center;margin-bottom:10px;}
.main-title{font-size:28px;font-weight:700;letter-spacing:7px;color:var(--gold2);
  text-shadow:0 0 28px rgba(200,168,75,.6);}
.sub-title{text-align:center;font-size:16px;color:var(--dim);letter-spacing:2px;margin-top:6px;}
.date-bar{text-align:center;font-size:16px;color:var(--dim);margin-top:10px;font-weight:600;}

/* ── 안내 ── */
.guide{background:linear-gradient(135deg,var(--bg2) 0%,var(--bg3) 100%);
  margin:14px;padding:24px 20px;
  border-radius:var(--r);border:2px solid var(--border);text-align:center;
  box-shadow:0 4px 18px rgba(200,168,75,.18);}
.guide-t{font-size:21px;font-weight:700;color:var(--gold2);letter-spacing:2px;margin-bottom:14px;
  text-shadow:0 0 12px rgba(200,168,75,.35);}
.guide-txt{font-size:18px;color:var(--dim);line-height:2.2;font-weight:500;}
.tips{display:flex;justify-content:center;gap:8px;margin-top:16px;flex-wrap:wrap;}
.tip{font-size:15px;color:var(--dim);background:var(--bg3);
  padding:8px 16px;border-radius:20px;border:1px solid var(--border);
  line-height:1.7;text-align:center;}
.tip b{color:var(--gold);}

/* ── 버튼 3개 ── */
.btn-row{display:flex;gap:12px;margin:14px;justify-content:center;}
.hbtn{flex:1;max-width:140px;height:92px;border:none;border-radius:var(--r);
  cursor:pointer;font-family:inherit;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:8px;
  transition:transform .12s,box-shadow .12s;position:relative;overflow:hidden;}
.hbtn::after{content:'';position:absolute;inset:0;opacity:0;
  background:rgba(255,255,255,.12);transition:opacity .12s;}
.hbtn:active::after{opacity:1;}
.hbtn:active{transform:scale(.95);}
.hbtn .ico{font-size:28px;line-height:1;}
.hbtn .lbl{font-size:15px;letter-spacing:2px;font-weight:600;}
.btn-chun{background:linear-gradient(145deg,#152540,#1e4a90);
  color:#8ec8ff;box-shadow:0 4px 16px rgba(30,74,144,.45);}
.btn-ji{background:linear-gradient(145deg,#152010,#2a5c22);
  color:#72e08a;box-shadow:0 4px 16px rgba(42,92,34,.45);}
.btn-in{background:linear-gradient(145deg,#3c1400,#8c3c00);
  color:#ffb060;box-shadow:0 4px 16px rgba(140,60,0,.45);}
.btn-done{box-shadow:0 0 0 2px var(--gold2),0 4px 20px rgba(200,168,75,.5)!important;}

/* ── 광고 ── */
.ad-box{margin:0 14px 14px;background:var(--bg3);
  border:1px solid #3a3020;border-radius:var(--r);overflow:hidden;}
.ad-txt{text-align:center;padding:16px 18px 8px;font-size:15px;color:var(--dim);}
.ad-num{text-align:center;font-size:30px;font-weight:700;color:var(--gold);padding-bottom:8px;}
.ad-bar-wrap{height:7px;background:#2a2010;margin:0 16px 16px;border-radius:3px;overflow:hidden;}
.ad-bar{height:100%;width:0%;border-radius:3px;
  background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width linear;}

/* ── QR 오버레이 ── */
.qr-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);
  z-index:110;align-items:center;justify-content:center;
  overflow-y:auto;}
.qr-ov.on{display:flex;}
.qr-box{background:#fffbf2;border:1px solid var(--gold);border-radius:16px;
  padding:20px 16px;width:min(260px,88vw);text-align:center;
  margin:auto;}
.qr-ttl{font-size:16px;color:var(--gold2);letter-spacing:2px;margin-bottom:10px;font-weight:700;}
#qrcode{display:inline-block;border-radius:8px;overflow:hidden;}
.qr-url{font-size:13px;color:var(--dim);word-break:break-all;
  margin:12px 0;line-height:1.6;max-height:48px;overflow:hidden;}
.qr-close{margin-top:16px;background:var(--gold);border:none;color:#1a1408;
  padding:13px 32px;border-radius:8px;font-size:16px;font-weight:700;
  cursor:pointer;font-family:inherit;letter-spacing:1px;}

/* ── 결과 섹션 ── */
.result{margin:0 14px;}
.sec-hdr{display:flex;align-items:center;gap:10px;
  padding:13px 0 11px;border-bottom:2px solid var(--border);margin-bottom:14px;}
.sec-ico{font-size:20px;}
.sec-ttl{font-size:17px;font-weight:700;color:#cc2020;letter-spacing:3px;}

/* ── 결과 카드 ── */
.card{background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--r);padding:22px;margin-bottom:16px;}
.c-sym{font-size:56px;text-align:center;line-height:1;margin-bottom:14px;}
.c-name{text-align:center;font-size:21px;color:var(--gold2);
  font-weight:700;letter-spacing:3px;margin-bottom:20px;line-height:1.5;}
.fortune{font-size:16px;line-height:2.2;word-break:keep-all;}
.fortune .cat{color:#cc2020;font-weight:700;font-size:15px;}
.divider{text-align:center;color:var(--dim);font-size:15px;
  letter-spacing:2px;padding:16px 0;}

/* ── 공유 ── */
.share-box{background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--r);padding:18px;margin-bottom:14px;}
.share-ttl{text-align:center;font-size:16px;font-weight:700;color:var(--gold2);
  letter-spacing:1px;margin-bottom:14px;}
.share-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
.sbtn{border:none;border-radius:8px;padding:12px 18px;font-size:15px;
  cursor:pointer;font-family:inherit;display:flex;align-items:center;
  gap:6px;transition:transform .12s;}
.sbtn:active{transform:scale(.94);}
.s-kk{background:#FEE500;color:#3C1E1E;}
.s-fb{background:#1877f2;color:#fff;}
.s-cp{background:var(--bg3);color:var(--text);border:1px solid var(--border);}
.s-qr{background:#27ae60;color:#fff;}

/* ── 다시하기 ── */
.reset-row{text-align:center;padding:8px 0 22px;}
.rbtn{background:#c04040;border:2px solid #902020;color:#fff;
  padding:14px 34px;border-radius:22px;font-size:16px;cursor:pointer;
  font-family:inherit;letter-spacing:3px;transition:all .2s;}
.rbtn:hover{background:#a03030;border-color:#701818;}

/* ── 모달 ── */
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);
  z-index:100;align-items:center;justify-content:center;}
.ov.on{display:flex;}
.mbox{background:#fffbf2;border:1px solid var(--gold);border-radius:16px;
  padding:32px 26px;max-width:340px;width:92%;text-align:center;}
.m-ttl{font-size:18px;color:var(--gold2);letter-spacing:2px;margin-bottom:18px;font-weight:700;}
.m-body{font-size:16px;line-height:2.1;margin-bottom:28px;}
.m-row{display:flex;gap:12px;justify-content:center;}
.m-no{background:var(--bg3);border:1px solid var(--border);color:var(--dim);
  padding:14px 28px;border-radius:8px;font-size:16px;cursor:pointer;font-family:inherit;}
.m-yes{background:var(--gold);border:none;color:#1a1408;
  padding:14px 28px;border-radius:8px;font-size:16px;
  font-weight:700;cursor:pointer;font-family:inherit;}

/* ── 토스트 ── */
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);
  background:rgba(255,248,235,.97);border:1px solid var(--gold);color:var(--gold2);
  padding:14px 28px;border-radius:22px;font-size:16px;font-weight:600;
  opacity:0;transition:opacity .28s;pointer-events:none;z-index:200;
  white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis;}
.toast.on{opacity:1;}

.footer{text-align:center;padding:18px 16px;font-size:14px;color:var(--dim);line-height:2.0;}

/* ES 레이아웃 대응 */
body.lang-es .fortune{word-break:normal;overflow-wrap:break-word;hyphens:auto;}
body.lang-es .c-name{word-break:normal;overflow-wrap:break-word;min-height:1.5em;}
body.lang-es .hbtn .lbl{font-size:13px;letter-spacing:0;}
body.lang-ja .hbtn{height:150px;max-width:180px;}
body.lang-ja .hbtn .lbl{font-size:18px;letter-spacing:0;line-height:1.6;text-align:center;white-space:normal;word-break:keep-all;padding:0 8px;}
body.lang-ja .fortune{font-size:17px;line-height:2.1;word-break:normal;overflow-wrap:break-word;}
body.lang-ja .c-name{font-size:17px;font-weight:700;letter-spacing:1px;}
/* HI 폰트 강제 */
body.lang-hi .fortune,body.lang-hi .c-name,
body.lang-hi .guide-txt,body.lang-hi .m-body{font-family:var(--font-hi),sans-serif;}
.hidden{display:none!important;}
</style>

있는 입장이라면 건강) 전염성 질환"}, "☰☳": {"no": 4, "name": "천뢰무망(天雷无妄)", "text": "운세) 하늘에서 천둥이 울리니 하고 이치에 따라서 행동하면 길하지만 된다. 준비없이 무작정 일을 벌이면 소문만 크게 나고 실속은 없을 것이다. 해서는 안 될 일은 도모 하지마라. 내적인 충실을 기하고 안정을 취하면 뜻밖의 행운을 얻게 된다. 일에 대하여 주저하거나 마음이 흐트러지기 쉽지만 가뭄속의 마른나무가 곧 단비를 만나듯이 순조롭게 뜻을 이룰 것이다. 사업) 적극적으로 새로운 일을 벌이기에 앞서 좋다. 순리에 따라 행동해야 길하다. 교섭과 거래는 상대방의 태도에 따라 대응하는 것이 좋으며 금전) 실속을 차려야 하는 때이다. 일상생활에 부족함을 느끼지는 않겠으나 재물에 너무 구애되지 말아야 한다. 명예를 추구하는 것이 더욱 빠르다. 애정) 기질이 비슷한 사람과 사귀게 된다. 학문 사람과 좋은 사이가 될 수 있다. 혼인은 서두르지 않고 자연스럽게 놔두어도 성사 되기 쉽다. 부부사이의 애정이 좋겠다. 건강) 건강한 때이므로 질병이 생기더라도 자연적으로 완치된다. 무리하게 치료할 필요가 없다."}, "☰☴": {"no": 5, "name": "천풍구(天風姤)", "text": "운세) 해와 달이 어두워졌다가 다시 밝아지는 격이다. 목표를 분명히 세우고 생활해야 겠다. 마음에 확실히 정한 바가 없으면 좋은 때를 놓쳐서 손해를 보게 된다. 대체로 재물을 모을 수 있는 운세이므로 뜻밖에 횡재하여 재물이 생기기도 하지만 한편으로는 사기를 당하여 재물을 잃을 수도 있다. 냉철한 판단력으로 행동하여야 할 것이다. 이 괘는 때가 중요하다. 도모하는일의 시작은 비록 미미하더라도 깊이 생각 하여 시행하라. 사업) 다른 일을 함부로 벌이지 말고 하던 일에 충실하는 것이 좋다. 혹 뜻대로 되지 않더라도 서두르지 않고 단계를 밟아 나가면 뜻밖의 좋은 기회가 생길수가 있다. 다른 사람의 사기나 실물사건을 조심하라. 방심은 금물이다. 금전) 작은 돈이 들어오고 큰 돈이 나가기 쉽다. 분수에 맞게 생활 해야겠다. 애정) 자기본위적이고 유희적인 교제를 하게 된다. 여성의 경우는 남성들에게 너무 인기가 좋아서 오히려 참된 애정을 얻기 힘들수도 있다. 혹 상대방이 진실되지 못한 마음을 가질수도 있으니 호의적인 태도 이면에 있는 의도를 잘 파악해야 할 것이다. 건강) 과로"}, "☰☵": {"no": 6, "name": "천수송(天水訟)", "text": "운세) 다른 사람의 의사를 따르고 존중해 주어야 한다. 혹 스스로 옳다고 생각되는 일이 있더라도 하다. 상대편에 동조하던지 주위의 분위기에 융합하는 자세가 필요할 것이다. 겸손하고 유순한 자세를 가지면 복록이 저절로 따르게 마련이다. 언행을 조심하고 쓸데없는 시비를 가까이 하지 말라. 그렇지 않으면 주변 사람들과 의견 충돌이 일어나거나 금전문제로 분쟁이 일어날 수 있다. 사업) 분수에 맞지 않는 일을 벌여서는 안 된다. 동업은 불리하다. 문서 하게 잘 처리해야 할 것이다. 교섭이나 거래를 할 때에는 확실하게 매듭을 짓는 자세가 필요하다. 혼자 고립되어 일을 처리하지 말고 믿을 수 있는 제3자의 도움을 청하는 것도 좋다. 애정) 상대방과 분위기나 입장이 다른 경우가 많다. 스스로 태도를 밝고 명랑하게 유지 하는 것이 중요하다. 상대를 먼저 이해해 주면 작은 갈등은 쉽게 해소 될 것이다. 건강) 소화불량"}, "☰☶": {"no": 7, "name": "천산둔(天山遯)", "text": "운세) 길흉이 상반하니 처음에는 어려움이 있으나 뒤에는 태평해지는 운세이다. 무리하게 일을 벌이기 보다는 현상유지에 힘쓰는 것이 유리하겠다. 계획하는 일은 앞뒤를 잘 살펴서 처리하라. 가끔은 복잡한 업무를 떠나 조용한 즐거움을 가질 필요도 있다. 소인배의 접근을 자연스럽게 막아야 할 것이다. 일을 도모할 때는 사전의 노력이 필요하겠지만. 또한 적절한 시간에 맞춤으로서 행운과 성공을 기약할 수 있는 것이다. 사업) 실속을 차리기 위해서는 큰일을 벌이기 전에 먼저 작은 일부터 착실히 처리 하여야 한다. 특히 극장 교섭과 거래를 할 때는 스스로 적극적으로 나서지 말아야 한다. 투자에는 신중하라. 금전) 수입보다는 지출이 많겠으니 관리를 잘해야 한다. 남의 보증을 서는 것은 위험이 따르니 각별히 주의 하라. 돈은 빌리지도 말고 주지도 말아야겠다. 애정) 단순한 친구사이 지출이 생기겠다. 스스로의 입지를 먼저 다져야 한다. 건강) 평소의 체력관리가 필요하다.만성병"}, "☰☷": {"no": 8, "name": "천지비(天地否)", "text": "운세) 혹 처음에는 어려움이 있더라도 서서히 일이 풀려 나가게 될 것이다. 어려움을 견뎌 내면 뜻밖의 큰 결실을 얻을 수 있는 법이다. 사치스런 생활을 삼가고 검소한 덕으로 내실을 다져야 한다. 너그러운 마음으로 신중하게 행동하면 좋은 복록이 샐길 것이다. 명예와 재물에 지나치게 얽메이지 말고 상하간의 의사전달을 원활하게 하는 것이 중요하다. 혹 막히는 일이 있다면 대인의 도움을 받는 것이 좋겠다. 사업) 적극적으로 나서기 보다는 조용하게 진행하는 것이 좋다. 내부 관리에 더욱 신경 을 써야한다. 교섭과 거래에서는 상대방이 강하고 유리히므로 못하고 수동적인 입장에 처하기 쉽다. 그러나 오래된 거래 관계이면 무난하다. 금전) 대체로 넉넉하지 못하다. 혹시 재물을 잃을수가 있으니 금전과 문서관리에 신중해야 한다. 애정) 상대방의 진실성을 잘 파악하고 행동해야 한다. 오래된 관계면 무난하겠지만 그렇지 않으면 상대와의 화합을 위해 많은 노력을 기울여야 한다. 결혼을 계획하는 사람의 경우 약간의 어려움을 겪더라도 시간이 경과하면 성사될 것이다. 건강) 체력을 다지는 것이 중요하다. 식욕부진"}, "☱☰": {"no": 9, "name": "택천쾌(澤天夬)", "text": "운세) 떠오르는 아침해처럼 운세가 성대하다. 직장인이라면 지위가 높아지고 학생은 성적이 향상된다. 그러나 겸손하게 처신하지 않으면 도리어 실패를 초래할 수 있다. 지나침은 모자란만 못한 법 한 관계를 유지하라. 윗사람에게는 공손하고 아랫사람에게는 너그러운 마음으로 덕을 베풀어야 할 것이다. 사업) 확실한 계획을 세워 두고 좋은 기회를 기다려야 한다. 무작정 추진하면 손해를 보게 될 것이다. 현재 성업중이라도 착실하게 경영을 해야 호조를 유지할 수 있다. 거래할때는 성급하게 하지 말고 상대방의 태도에 따라 수동적으로 응해야 한다. 남의 보증을 함부로 서지 말고 금전) 재물을 풍족하게 얻을 것이니 지나친 과욕은 금물이다. 주변 사람들의 이익을 생각 하고 적당히 베푸는 것이 바람직하다. 애정) 복잡한 상황이다. 만약 상대와 갈등이 생기면 속히 해결하는것이 좋겠다. 먼저 상대를 잘 살펴보라. 건강) 질병이 생기면 빨리 치료하는 것이 좋다. 호흡기 계통질환 등에 주의해야 한다."}, "☱☱": {"no": 10, "name": "태위택(兌為澤)", "text": "운세) 봄바람 가랑비에 초목이 다시 활기를 찾는격이다. 일상새활에는 희망적이고 좋은 일이 많이 생길것이다. 그러나 이괘는 기쁨 이외에 내부적으로 불완전하다는 의미도 포함하고 있다.큰 일은 끝맺음을 분명히 맺어야 하고 다른 사람들과 시비를 벌이지 말라. 조직내의 갈등이나 파벌에는 참여하지 않는 것이 좋다. 사업) 하던 일에 충실하면 좋은 결실을 얻게 된다. 실속을 다져라. 판매계통이나 광고 선전이 필요한 사업은 유망하다. 상대와의 거래에서는 온건책을 구사해야 유리하다. 겸손하고 성실한 태도로써 상대방의 의심을 풀고 호감을 얻어야 한다. 금전) 일상생활에는 전혀 부자유스럽지 않을만큼 재물이 생긴다. 단 겉으로는 화려하게 보이지만 안으로는 실속이 없기 때문이다. 점점 상황이 좋아질 것이다. 애정) 겉모습에 치중하는 일시적이고 유희적인 연예를 하게 된다. 결혼을 계획하는 경우 상대방의 진실성을 자세히 살펴볼 필요가 있다. 이성문제에 너무 집착해서는 안된다. 좋은 운을 그르칠 염려가 있다. 건강) 입안의 질환"}, "☱☲": {"no": 11, "name": "택화혁(澤火革)", "text": "운세) 옛것을 버리고 새로운 것을 취하는 격이다. 주변의 사람들이 바뀌고 하는 일에서도 새로운 영역을 개척하게 된다. 정치가는 개혁을 때가 되었다고 판단되면 적극적으로 변화를 시도 하는 것이 좋다 .혼인을 하거나 가족을 늘리는 수도 있다. 전반적으로 변화를 추구하기에 좋은 시기이지만 올바른 길을 찾아야 실수가 없다. 궁색함을 타개 필요하다 사업) 새로운 사업을 도모하게 된다. 가옥의 개축이나 이사도 가능하다. 전업 같이 변화를 시도하기 좋은때 이지만 상대와의 거래에서도 좋은 기회를 잡게 된다. 하지만 지나치게 서두르지는 말아야 할 것이다. 금전) 재물운이 왕성하니 투자와 노력 여하에 따라 큰 이익을 얻을 수 있다. 애정) 혼기를 놓친 사람에게는 좋은 상대가 나타난다. 올바른 교제를 해야 할 것이다. 한편 건강) 오래된 병이 있으면 빨리 치료하는 것이 좋다. 과로 조심하라."}, "☱☳": {"no": 12, "name": "택뢰수(澤雷隨)", "text": "운세) 천둥은 여름에는 기승을 부리지만 환경에 적응하면서 일해야 하는 시기이다. 남의 의견에 따라 움직이는 것이 상책이다. 관망하는 자세로 실력을 배양하면 좋은 기회가 저절로 찾아올 것이다. 한편 상황에 재빨리 적응해야 한다. 낮에는 일을 하고 밤에는 휴식을 취하듯이 지금까지 왕성한 활동을 했던 사람은 남의 의견에 귀를 귀울이고 스스로를 돌이켜 봐야 한다. 군자는 때를 따라서 움직이는법 없는 것이다. 때로는 실력이 없는 사람과 함께 일하는 경우도 생길 것이다. 그러나 상대를 돕는 너그러운 마음을 가져야 하고 무리하게 참견해서는 안된다. 마음을 곧고 바르게 가지면 이로울 것이다. 사업) 유행에 맞추어 행동하면 좋은 결과를 얻는다. 주위환경에 대한 관찰을 소흘히 해서는 안 된다. 거래를 하는 상대로는 주로 능숙한 사람을 만나게 된다. 쉽게 이루어지지 않더 라도 인내심을 가지고 임하면 일은 성사된다. 금전) 금전융통이 원활하고 수입이 많아진다. 지출도 증가한다. 애정) 주로 나이차가 많은 상대와 교제하게 된다. 주변에 여성이 많을 때이기도 하다. 여자의 경우 간혹 연하의 남성을 사귈 수도 있다. 삼각관계를 조심 해야겠다. 결혼을 계획하는 경우라면 뜻대로 원활하게 진행 될 것이다. 결혼 후에는 정신적인 화합을 위해 노력하라. 건강) 사소한 병이라도 간과해서는 안된다. 환절기의 질병 주의해야 한다."}, "☱☵": {"no": 14, "name": "택수곤(澤水困)", "text": "운세) 분수를 지키고 때를 기다리는 격이다. 올바른 신념과 실행력으로 성실하게 노력 해야 겠다. 뚜렸한 목표를 가지고 생활하면 흉이 변하여 길이 될 것이다. 만약 어려움이 생기면 바른마음으로 은인자중하는것이 상책이다. 그리하여 결점을 찾아내고 스스로의 실력을 쌓으므로써 새로운 도약의 기회를 얻게 되는 것이다. 훌륭한 윗사람이나 동료를 가까이 하라. 사업) 다른 사람의 감언이설을 조심해야 한다. 하던 일을 충실히 지키고 실력을 쌓으면 좋은때가 찾아 올 것이다. 상대와의 거래에서는 서두르지 말고 어느 정도까지는 양보하는 것이 좋다. 일의 마무리를 분명히 하라. 금전) 수입보다는 지출이 많은 때이다. 사치와 낭비를 줄여라. 다른 사람의 사기나 꼬임에 넘어가서는 안된다. 애정) 순수하지 못한 관계는 속히 그만두는 것이 현명하다. 특히 나이차이가 많이 나는 사람은 주의를 요한다. 상대방의 진실성을 정확히 판단해야 할 것이다. 잘목된 짝사랑에 빠질 수 있다. 건강) 체력관리에 힘써라. 과로를 피하고"}, "☱☶": {"no": 15, "name": "택산함(澤山咸)", "text": "운세) 마른나무에 단비가 내리는 격이다. 정성으로 노력하면 하늘도 감동하게 된다. 옳은 것을 받아 들이고 바르게 행동하면 뜻밖의 좋은 결과를 얻게 될 것이다. 주변사람들 과의 정신적인 교분을 항상 두텁게 하고 아랫사람의 뜻을 잘 포용하라. 사람들의 도움으로 뜻밖의 경사가 뒤따르게 된다. 그러나 혹 사업) 주변사람들의 도움이 많을 때이다. 좋은 아이디어를 가진 사람을 만나게 된다. 목표를 세웠으면 빨리추진하라. 주저하면 기회를 놓치기 쉽다. 교섭과 거래는 예상보다 빨리 좋겠다. 금전) 일상생활에 풍족할 정도이다. 노력과 수완에 따라서 큰 돈도 기대할 수 있다. 애정) 이상적인 상대를 만나 정열적인 연애를 하게된다. 혼인을 하면 행복한 가정을 꾸미게 될 것이다. 건강) 신체 건강하다. 감기"}, "☱☷": {"no": 16, "name": "택지췌(澤地萃)", "text": "운세) 용이 넓은 바다를 만나고 오르듯이 사업은 번성하게 될 것이다. 주변에 따르는 사람이 많겠다. 그러나 한편으로는 경쟁이 치열해지고 분쟁이 일어나기 쉬우니 받거나 여러 사람과 같이 일하면 큰일을 이룰 수 있다. 뜻하는 일은 대인의 자문을 구하여 조금이라도 실수가 없도록 하라. 사업) 운세가 왕성하니 일을 순조롭게 이룰 것이다. 거래를 할때는 경제적인 이익에만 급급하지 말고 상대의 이익도 생각해 주어야 한다. 금전) 재물이 풍족하겠다. 스스로의 실력향상에 주력해야 할 것이다. 애정) 이상적인 연애를 한다. 그러나 상대에게 뜻을 두면 한 가지도 제대로 이루지 못한다. 건강) 호흡기 질환"}, "☲☰": {"no": 17, "name": "화천대유(火天大有)", "text": "운세) 중천에더서 찬란한 빛을 발하는 태양처럼 운세가 왕성하다. 마치 가을철에 풍년을 맞은 모습이다. 재물이 풍족하고 정신적으로도 안정을 찾게 되니 세상만사가 태평하다. 그러나 태양이 언제까지나 중천에만 머물지 않듯이 또한 오래 보존하도록 노력해야 겠다. 주변의 환경변화를 소흘히 생각하지 말고 시대의 추세에 따라가야 할 것이다. 사업) 사업운이 대단히 왕성하므로 많은 이익을 얻게 된다. 지금까지 확장시킨 사업의 현상유지와 내부관리를 충실히 하는 것이 좋겠고 겠다. 상대와의 거래와 교섭은 빠를수록 좋다. 또한 혼자보다는 여러 사람이 단체로 나서는 것이 유리하다. 금전) 재물이 풍족하고 자금의 융통이 원활한 시기이다. 그러나 간혹 친척이나 친구의 일로 지출할 수가 있겠다. 애정) 여성의 입지가 강하다. 이지적이고 자존심이 강한 타입으로서 영리하고 미인 인경우 가 많겠다. 여성의 경우 하기에 좋은 때이므로 건강) 식욕부진"}, "☲☱": {"no": 18, "name": "화택규(火澤睽)", "text": "운세) 작은 일을 도모하기에 좋은 시기이다. 지나친 욕심을 버리면 무사태평하게 지낼 수 있을 것이다. 주변 사람들과의 화합에 힘쓰고 언행을 조심하라. 평소에 정신적인 교분을 두텁게 해두면 나중에 많은 도움을 받을수 있을 것이다. 가정이나 직장에서의 갈등이나 문제점은 미리 알아서 해결해 두는 것이 좋겠다. 일상생활에 충실하고 매사에 양보하는 자세를 가지면 좋은 결실이 뒤따른다. 사업) 적극적으로 새로운 사업을 추진하기 전에 먼저 하던일의 내부관리에 충실하는 것이 좋다. 작은 일은 순조롭게 이루어 지겠지만 불필요한 거래는 피해야 한다. 금전) 부자유스럽지는 않겠으나 지출을 줄여야 한다. 애정) 복잡한 상황이다. 성격이 반대이면서도 상대방에게 묘한 매력을 느껴 쉽게 헤어지지 못한다. 건강) 스트레스"}, "☲☲": {"no": 19, "name": "이위화(離為火)", "text": "운세) 해와 달이 하늘에 떠있어 온 천지를 환하게 비추듯이 의욕으로 실력을 발휘할 수 있는 좋은 시기이다. 넓은 아량으로 밝은 덕을 베풀어야 하겠다. 한편 마음이 흩어져 집중이 되지 않기도 한다. 따라서 자신을 지나치게 내세우는 것은 좋지 않다. 강한 운수이긴 하지만 처세하기 어려운 점도 있는 것이다. 이런 때는 모든 일을 주도면밀하게 진행해야 한다. 힘만 믿고 나아가면 실패하는 수가 있다. 경솔한 행동을 피하고 윗사람의 의견을 받아들이는 겸손한 마음자세가 필요할 것이다. 사업) 교육 속으로는 실속이 없을수도 있다. 새로운 일 장기적인 일은 신중히 고려해야 한다. 교섭과 거래는 부분적으로는 순조롭게 진행된다. 그러나 계약상의 착오를 경계하라. 문서관리를 잘 해야 할 것이다. 금전) 부족한 것은 아니나 사치와 낭비가 많겠다. 절약하는 자세가 필요하다. 애정) 솔직하고 정열적인 연애를 하게 된다. 그러나 기질이 서로 비슷하여 쉽게 식을 수도 있다. 위험한 사랑의 장난을 해서는 안 되겠다. 주위에 오가는 혼담이 많아서 확실한 결정을 내리기에 망설여지는 면이 있다. 서두르지 말고 천천히 진행하는 것이 좋다. 허세를 부리지 마라. 건강) 신체가 건강하지만 뜻밖의 질병이 발생하기 쉽다. 고열 시력감퇴 에 유의 하여야 한다."}, "☲☳": {"no": 20, "name": "화뢰서합(火雷噬嗑)", "text": "운세) 불처럼 환하고 천둥처럼 강력하게 활약하게 될 것이다. 마치 음식을 위턱과 아래로 잘게 씹는것 처럼 모든 면에서 의욕적이고 활기가 넘치는 모습이다. 뜻하는 바가 있으면 과감하게 공명정대하게 순서에 맞게 차근 차근 매듭을 지어야 할 것이다. 혹 도중에 어려움이 있더라도 좌절하지 않고 노력을 계속하면 성공할 수도 있다. 시간이 가면 갈수록 탄탄대로를 밝게 된다. 소인배와 시비를 다투지 말라. 다른 사람의 일에 지나치게 간섭하거나 쓸데 없는 비방도 삼가야 하겠다. 설령 부당한 자리에 있더라도 두려워하고 근심하여 힘써 고쳐 나간다면 허물이 오래가지는 않는 법이다. 사업) 사업을 벌이기에 좋은 때이므로 발전하게 된다. 수표 이 많다. 단 과감하게 추진하라. 금전) 일상생활에 불편함이 없다.열심히 노력하면 상당한 이익을 기대할 수 있다. 애정) 성격이 비슷한 사람을 만나기 쉽다. 주변의 이성 관계가 복잡하며. 생활문제나 라이벌이 있어 신경쓸 일이 많겠다. 진실성이 없는 관계는 빨리 청산해야 한다. 건강) 과음 신경을 써야 한다."}, "☲☵": {"no": 22, "name": "화수미제(火水未濟)", "text": "운세) 음양이 비록 제자리를 차지하지 못하였지만 서로 잘 호응하는 모습이다. 이제부터 완성을 향하여 점점 나아가게 된다. 약간의 어려움이 있더라도 기다리면 곧 좋은 운이 찾아 올 것이다. 따라서 때를 기다려 침착하게 스스로의 실력을 쌓는 것이 가장 중요하다. 미래에 대한 희망이 보이는 좋은 운세이므로 노력여하에 따라 앞길은 탄탄대로일 가능 성이 크다. 포부를 크게 가져야 길하다. 혹 부당한 자리에 있더라도 두려워하고 잘못된 허물을 고쳐 나간다면 길하게 되는 법이다. 사업) 처음에는 순탄하지 못하더라도 시간이 지날수록 발전을 거듭한다. 혹 어려움이 있더라도 절대로 중도에 포기해서는 안된다. 일의 진행이 늣더라도 걱정 할 필요는 없다. 먼저 기반을 튼튼히 다지고 꾸준히 노력하면 성공을 기약할 수 있다. 상대와의 교섭은 끈질기게 추진하면 목적을 달성하게 된다. 금전) 풍족하지는 않지만 일상생활에 불편을 느끼지 않을정도는 있다. 애정) 서로 마음에 맞는 사람을 만나게 된다. 결혼을 계획하는 경우 않은 방해자가 나타나는 등 약간의 어려움이 따른다. 그러나 노력하면 성사될 것이다. 건강) 건강하고 기력이 왕성하다. 전염성 질환"}, "☲☶": {"no": 23, "name": "화산려(火山旅)", "text": "운세) 나그네의 여행은 불안과 고독을 수반하는 것. 그렇더라도 서두르지 말고 착실하게 목적지를 향해 나가는 것이 중요하다. 적극적으로 일을 추진하기에 앞서 스스로의 실력을 기르면서 때와 장소에 맞게 행동하라. 목표를 분명히 하고 기초를 튼튼히 하면 불안은 저절로 사라지게 된다. 마음을 바르고 곧게 가지면 저절로 복록이 따를 것이다. 혹 어려움이 생기면 믿을 만한 윗사람인 동료의 도움을 구하라. 중용을 지키면 작은 일은 뜻대로 형통할 것이다. 사업) 새로운 일을 벌이거나 확장하는 것은 좋지 못하다. 그러나 외판 문화사업 등은 유리하다. 상대의 입장과 이익을 먼저 생각해 주면 거래는 순조롭게 진행 될 것이다. 이민 금전) 작은 돈이 들어오고 큰돈이 나가기 쉽다. 사치와 낭비를 줄여야 한다. 애정) 연령차이가 많이나는 교제이다. 학문이나 공동사업을 통하여 만나는 경우는 원만한 관계가 될 것이다. 주거나 직업 같은 건강) 오래된 병이 있으면 빨리 치료 하는것이 좋다. 전염병 감퇴 등에 주의해야 한다."}, "☲☷": {"no": 24, "name": "화지진(火地晉)", "text": "운세) 밝은 임금이 어진 신하를 만난 겪이다. 대지위에 태양이 떠올라 세상을 환하게 비추듯이 새로운 활동을 하게 될 것이다. 기초가 튼튼해야 성공할 수 있는 것이다. 전장에 나가는 용맹한 장수처럼 기세가 강건하지만 혹 주변사람들의 시기가 있거나 하는 일에 어려움이 따르더라도 대처하면 아무런 문제가 없을 것이다. 사업) 새로운 계획을 세우거나 일을 확장하게 된다. 포부를 크게 가져라. 경쟁이 심하겠 지만 근면하게 노력하면 좋은 결과를 얻게 된다. 거래를 할 때에는 계획을 세우고 적극적 으로 추진하라. 우유부단은 금물이다. 직장에서는 승진하게 되는 운세이다. 윗사람이 이끌어 주고 아랫사람이 도와주니 사업의 발전을 기약할 수 있다. 금전) 처음에는 풍족하지 않으나 서서히 많은 수입이 들어올 것이다. 주식이나 투자로 이익이 생긴다. 애정) 밝고 즐거운 연애를 한다. 좋은 인연을 만나게 될 것이다. 건강) 전염성"}, "☳☰": {"no": 25, "name": "뇌천대장(雷天大壯)", "text": "운세) 하늘위에서 천둥이 치면 천리를 진동하더라도 내리지 않는다. 이와 같이 운세가 왕성하더라도 가져야 하겠다. 왕성한 의욕으로 일을 확장하게 되더라도 경솔한 행동은 피해야 한다. 가끔은 마음의 여유를 가질 필요가 있다. 천둥이 천리밖까지 울리지만 소리만 있고 형체는 없듯이 일을 벌이면 실패가 따를 것이다. 예의에 어긋나는 일을 삼가고 좋은 협력자를 구하라. 가진것을 주변에 나누어주면 나중에 복록이 되어 돌아올 것이다. 사업) 새로운 사업을 벌리거나 확장을 할 때이다. 운세가 강하므로 계획성과 조심성만 있으면 무난하게 진행된다. 거래와 교섭에서는 서로 강건한 태도를 취하기 쉬우나 온화하게 대하면 좋은 결과가 생긴다. 운전을 하는 사람은 과속이나 음주운전을 삼가하라. 금전) 여유있고 풍족하다. 저축을 해두면 나중에 편할 것이다. 애정) 감상적이고 들뜬 마음으로 연애를 하게 된다. 침착하고 진지한 자세가 필요하겠다. 마음가짐을 분명히 하고 상대방을 주의 깊게 관찰해 보라. 건강) 대체로 건강하겠지만 위장 질환 있는 경우라면 악화되지 않도록 해야한다."}, "☳☱": {"no": 26, "name": "뇌택귀매(雷澤歸妹)", "text": "운세) 음양이 서로 화합하기 위해 노력하는 형국이다. 바른 길을 지키면 무사태평한 세월을 보내게 된다. 그러나 감정에 사로잡혀 이성적인 판단을 하지 못하면 손해가 따를 것이다. 성급하게 일을 벌이지 말고 여유있게 준비하면서 적절한 때를 기다려라. 새로운 일의 성공을 위해서는 첫출발이 좋아야 하지만 것이다. 사업) 새로운 사업을 무리하게 시도하면 좋지 못하니 유지에 힘써라. 새로운사업을 하고자 한다면 충분히 관망한 다음에 실행에 옮겨야 한다. 상대방과의 교섭이 원활하게 진행되지 않더라도 경솔하게 행동해서는 안된다. 정상적인 절차를 무시하면 때때로 어려움을 격게 될 것이다. 금전) 작은 돈이 들어오고 큰돈이 나가기 쉽다. 지출관리에 힘써야 한다. 애정) 복잡하고 유희적인 교제는 피하는 것이 좋다. 이성문제에 대해서는 조심해야 한다. 여성의 경우 건강) 신경과민"}, "☳☳": {"no": 28, "name": "진위뢰(震為雷)", "text": "운세) 천둥(우뢰)이 사방에 진동하듯이 세워 노력하면 순조롭게 목적을 이룰 수 있을 것이다. 그러나 천둥이 소리만 크고 실속이 없는 것 처럼 전에는 먼저 목표와 계획을 확실하게 세워야 겠다. 스스로를 수양하고 반성하라. 혹 어려움이 생기면 경거망동 하지 말고 윗사람이나 동료의 도움을 청해야 한다. 사업) 두가지 사업을 동시에 벌이기 쉽다. 그러나 계획이 너무 거창하고 일이 분산되면 도리어 실익을 얻기 힘들수 있으니 주의하라. 상대와의 거래에는 눈앞의 이익보다 장기 적인 안목을 가지고 임해야 한다. 경쟁자가 생기기 쉬우므로 일을 은밀히 진행시킬 필요가 있다. 금전) 재물운이 있지만 단번에 들어오지는 않는다. 서서히 풀려 나갈 것이다. 애정) 유희적이고 들뜬 연애를 하게된다. 서로간에 진지함이 결여되어 있다면 혼담까지는 기대할 수 없을 것이다. 건강) 간장 질환"}, "☳☴": {"no": 29, "name": "뇌풍항(雷風恒)", "text": "운세) 해와 달이 세상을 늘 밝게 비추는 겪이다. 반복되는 생활을 유지함으로써 생활의 안정과 기쁨을 얻게된다. 태평스러운 세월을 맞이하게 될 것이다. 현명한 사람은 항구 의 덕을 쫒아 자신의 처소를 쉽게 바꾸지 않는 법이다. 인내심을 갖고 꾸준히 노력 하며 한편으로 권태로움을 수반하므로 변화를 모색하게 되고 욕구불만이 생기기도 쉽지만 감정에 치우치지 않는 확고한 주관을 가져야 할 것이다. 마음을 곧고 바르게 가져야 이롭다. 육친을 공경하고 넓은 덕을 쌓아라. 사업) 지나친 확장이나 새로운 계획은 좋지 않다. 지금까지의 사업을 견실하게 지켜 나가야 한다. 알게 모르게 내부적인 실속이 있는때 이므로 꾸준히 노력하면 발전을 기약할 수 있다. 장기적인 안목으로 교섭을 벌이면 좋다. 기존의 것은 순조롭게 진행 되겠지만 금전) 재물운이 좋으므로 금전이 풍족하고 구애받는 일이 없다. 애정) 무리없는 순탄한 교제를 하게된다. 사귐을 오래 유지할수도 있다. 혼인으로 이어 지기까지는 약간의 어려움이 있더라도 성사되고 나면 좋다. 건강) 규칙적이고 절제된 생활로 병을 막아야 한다. 요통 질병을 조심해야 한다."}, "☳☵": {"no": 30, "name": "뇌수해(雷水解)", "text": "운세) 겨울에 얼어붙었던 것이 새봄을 맞이하여 풀리는 형국이다. 좋은 협조자를 얻고 새로운 활동을 하게된다. 지금까지 막히고 어려운 일이 있었다면 이루어 질 것이다. 이 시기에는 활동함으로써 어려움에서 벗어나게 되므로 목표를 설정해 두어야 한다. 만약 나태하면 좋은 운을 그르칠 것이다. 도모하는 일은 서남쪽이 이로우니 그리로 가면 협력자를 만나서 뜻을 이루게 된다. 주위에 따르는 사람들이 늘어나고 특별히 움직이고 가야 할 곳이 없을 때에는 안정을 취하고 실력향상에 주력하는 것이 현명하다. 혹 상대방에게 허물이 있더라도 관대하게 처리하라. 서로간에 기를 소통함 으로써 서로 화통해 질 것이다. 사업) 몹시 분주하게 활동한다. 수완있는 협조자를 가까이하면 좋은 결과를 얻게 될 것 이다. 직장생활을 하는 사람은 전직이나 이직을 할 수 있다. 그동안 미진했던 교섭이 있다면 문서 정확한 때를 아는 것이 중요하다. 금전) 작은것을 쌓아 큰 산을 이루게 된다. 노력하면 많은 재물을 얻게 될 것이다. 애정) 감상적이고 유희적인 연애를 하게 된다. 감정을 절제해야 피해를 보지 않을 것이다. 무엇 보다도 진실성이 필요하다. 건강) 건강한 시기이므로 가벼운 병은 쉽게 낫는다. 위장병"}, "☳☶": {"no": 31, "name": "뇌산소과(雷山小過)", "text": "운세) 지나침은 모자람만 못한 법 못하다. 비리를 탐내지 않고 겸손하게 행동하면 편안하게 지낼 수 있다. 자신의 분수를 지키지 않거나 막아라. 가까이 하면 손해를 보기 쉽다. 사업) 작은 일은 뜻과 같이 순조롭지만 인화단결이 이루어져야 할 것이다. 교만은 금물이다. 새로운 사업은 규모를 축소하고 내부관리에 주력하라. 금전) 생각보다는 수입이 적고 대신 지출이 많을때이다. 사치와 낭비를 줄여라. 주변 사람들의 감언이설에 주의해야 한다. 애정) 서로간의 의심 없으면 순탄 할 것이다. 건강) 섭생"}, "☳☷": {"no": 32, "name": "뇌지예(雷地豫)", "text": "운세) 천둥이 땅속에서 나와 진동하니 초목이 움직이는 형국이다. 이와 같이 좋은 때를 만났으니 스스로의 실력을 인정받게 된다. 지위가 올라가고 새로운 희망이 보일 것이다. 지도자가 확고하게 계획을 세우면 아랫사람은 불만 없이 그를 따라 행동하게 되듯이 뜻하는 일을 미리 준비하고 확실한 계획을 세우면 앞길은 탄탄대로이다. 자만심을 버리고 주변의 상황을 잘 판단해서 움직이면 더욱 실하다. 겉으로 보이는 화려함 속에서 실속을 찾으려면 확실한 계획을 세우고 큰데 거기에 더하여 겸손의 덕까지 갖추었다면 반드시 기쁨이 있는 법 운세가 더욱 왕성해 질 것이다. 사업) 서두르지 않고 순서를 밟아 나가면 발전하게 된다. 내부관리를 충실하게 해야한다. 새로운 일에 착수해도 좋은 시기이다. 교섭은 순조롭게 진행 될 것이다. 금전) 큰 돈이 들어오지만 지출도 많아진다. 실속을 차리기 위해서는 낭비를 줄여야 한다. 애정) 사회적으로 자신감이 있으며 주변에 따르는 여성이 많다. 방심하지 않고 진실된 마음을 가진다면 이상적인 연분을 찾을 수 있을 것이다. 주로 감성적이고 화려한 연애를 하게 된다. 서로간에 즐거움을 구하며 만남도 빈번하겠다. 그러나 지나치게 긴장감을 풀고 무드에 사로 잡히면 뜻밖의 실수가 뒤따를까 염려된다. 혼인하기에 좋은 때이다. 건강) 신체가 건강하므로 가벼운 병이 생기더라도 쉽게 회복한다. 식중독"}, "☴☰": {"no": 33, "name": "풍천소축(風天小畜)", "text": "운세) 하늘위에서 바람이 부니 곧 비가 내릴듯 하면서도 좀처럼 내리지 않는 겪이다. 모든 사물은 각기 왕성할때가 있는 법이니 대지를 축축히 적실 것이다. 스스로의 내부사정을 충분히 고려해야 하며 서두르면 이롭지 않다. 때를 기다리면서 꾸준히 노력해야 한다. 경솔하게 행동하지 말고 신중을 기하는 것이 유리하다. 실력을 쌓고서 좋은 때를 기다리면 수 있을 것이다. 사업) 재물운이 있으니 적지않은 이익이 생길 것이다. 그러나 새로운 일을 확장하면 힘이 들 때이다. 하던 일에 충실히 임하는 것이 좋다. 교섭과 거래는 늦어지기 쉬우며 상대의 연락을 기다리는 경우가 종종 생긴다. 금전) 작은 재물은 쉽게 들어오므로 일상생활에는 부족함이 없다. 저축하면 돈을 모을 수 있겠지만 지출이 많은 때이다. 애정) 명랑한 태도를 유지하고 상대와의 분위기일치를 위해 노력해야 한다. 혼담의 경우 가족 중에 반대하는 사람이 있어 순조로운 진행을 위해서는 다소 시간이 걸릴 것이다. 그러나 시간이 지나면 순조롭게 풀린다. 먼저 서로 정신적인 일체감을 가질 수 있도록 노력하라. 건강) 신경성 질환이 생기기 쉽다. 감기 사소한 것이라도 병이 생기면 빨리 치료하는 것이 좋다."}, "☴☱": {"no": 34, "name": "풍택중부(風澤中孚)", "text": "운세) 어미새가 알을품고 새끼를 까는 형국이다. 정성으로 노력하면 만사가 순조롭게 진행될 것이다. 여러 사람과 어울리는 일이나 공동사업을 하면 특히 유리하다. 학생은 문서 많은 사람들이 우러러 볼 것이다. 사업) 기회를 잡아서 일을 이루는 운세이다. 능력 이상의 좋은 결실을 얻게 된다. 혹 발전하게 된다. 상대와의 거래에서는 차리기 위해서는 성의를 가지고 임해야 한다. 금전) 수입이 많지만 지출도 많을 때이다. 재물에 대한 지나친 애착을 버리고 주변 사람 들에게 베풀면 복록이 되어 다시 돌아올 것이다. 애정) 마음이 잘 맞는 사람과 열렬한 교제를 하게 된다. 그러나 이성적인 판단력을 잃지 않도록 주의하라. 결혼을 계획하는 경우라면 순조롭게 이루어 질 것이다. 혹 건강) 혈액순환장애"}, "☴☲": {"no": 35, "name": "풍화가인(風火家人)", "text": "운세) 맑은 바다에 들어가 구술을 구하고 밖에 나가서 적극적으로 일을 벌이기전에 사소한 일이라고 소흘히 하지말고 집안일에 충실하여 가도를 바르게 해야 하겠다. 친척이나 가정 내의 일에 특히 관심을 둘 필요가 있다. 꽃이 떨어지고 나면 열매를 맷듯이 이나 새로운 일에 대한 욕구가 강하게 생길 수도 있다. 그러나 하던 일을 지키며 안분하는 것도 하나의 즐거움이다. 사람들에게 덕을 베풀고 언행을 조심하라. 사업) 하던일에 충실하는 것이 좋다. 다른 일을 벌이기 위해서는 철저한 계획이 필요하다. 윗사람이나 선배의 의견을 따르면 이득이 있다. 평상시의 거래는 원활하게 이루어 지겠다. 그러나 큰 거래나 교섭에서는 실속을 차리기 위해 노력해야 한다. 동업을 하면 손해는 없을 것이다. 금전) 재물이 풍족하다. 미래를 위해 투자를 해두면 좋을 것이다. 애정) 서로 마음이 잘 맞고 원만한 교제를 하게 된다. 그러나 뜻밖의 경쟁자를 조심하라. 애정운이 대길하니 좋은 연분을 만날 수 있다. 건강) 체력유지에 힘써야 한다. 과로"}, "☴☳": {"no": 36, "name": "풍뢰익(風雷益)", "text": "운세) 시냇물이 흘러 바다에까지 이르는 형국이다. 직장에서는 승진을 하고 농사를 지으면 풍년을 맞게 된다. 목표를 세운 뒤 좋은 기회가 오면 적극적으로 행동에 옮겨야 한다. 특히 좋은 협력자의 도움으로 능력 이상의 결과를 얻게 될 것이다. 옳은 일은 실행하고 잘못된 일은 과감하게 고쳐라. 공익과 관련된 일은 더욱 좋다. 단 움직여서는 안된다. 그동안 쌓은 덕이 넉넉하면 남아도는 경사가 있는 법이다. 사업) 적극적으로 활동하면 많은 이익이 따른다. 그러나 내부관리를 철저히 해야 실패가 없다. 교섭이나 거래도 순조롭게 진행 되겠다. 부정한 일에는 손대지 말라. 금전) 재물운이 왕성하다. 뜻밖의 횡재수도 있을 것이다. 애정) 서로 뜻이 잘 맞는 상대를 만나게 된다. 순조로운 교제를 하겠다. 건강) 간장"}, "☴☴": {"no": 37, "name": "손위풍(巽為風)", "text": "운세) 초목이 부드러운 바람에 따라 움직이는 겪이다. 바람은 유순하기 때문에 물체에 부딪치면 비켜 돌아가고 쉽게 멈추지 않는다. 이와 같이 주변사람과의 조화를 우선하여 겸손하게 행동하라. 신뢰할수 있는 윗사람이나 동료를 가까이 하면 좋겠다. 작은 일이라면 뜻과 같이 형통하겠으니 바람과 같이 마음이 불안정해지고 우유부단해질 수도 있다. 소인배의 감언이설에 주의 하고 안으로는 굳은 마음을 지녀야겠다. 사업) 지금까지 기반을 다져 놓은 사업이라면 큰 발전이 기대된다. 신규사업이나 기존 사업의 확장은 훌륭한 협력자나 윗사람의 도움을 받아 추진해야 한다. 거래나 교섭은 신속하게 진행하는 것이 좋다. 상대방을 잘 알아야 하며 감언이설에 주의 하라. 바람이 여기저기 움직이는 것처럼 이익을 얻게 될 것이다. 금전) 목표에 전력하면 많은 수입을 기대할 수 있다. 정당하고 익숙한 일에는 이득이 생긴다. 자신감과 독립할 수 있는 능력을 함양하라. 애정) 감상적이고 들뜬 연애를 하기 쉽다. 혼담이 오지만 쉽사리 결정을 내리기 어려운 때이다. 윗사람의 자문을 받아야 실수를 막을 수 있다. 건강) 감기"}, "☴☵": {"no": 38, "name": "풍수환(風水渙)", "text": "운세) 순풍에 돛단격이다. 침체에서 벗어나 새로운일을 도모 하게 되는 전환기로서 물위에 바람이 불어 오듯이 상쾌한 기분으로 큰 일을 도모할 수 있을 것이다. 사업이 활기를 띠게되고 마음속에 근심에서도 벗어난다. 작은일 보다는 큰일 새로운 것을 계획하라. 목표를 분명히 세우고 건실한 마음으로 노력해야겠다. 이 괘는 흩어진다는 의미도 있으니 사업) 새로운 사업을 추진하면 노력 이상의 결과를 얻게 된다. 지금까지 적자가 있었다면 만회할 수 있다. 훌륭한 협력자나 윗사람을 가까이하면 더욱 순탄하게 진행될 것이다. 이전의 관계를 정리하고 새로운 교섭을 시작하게 된다. 먼저 충분한 정보를 입수하는 것이 중요하다. 금전) 수입과 지출이 빈번하겠다. 자금회전은 계획성있고 적절하게 하라. 금전관리에 신경을 쓰지 않으면 혹 구설이 따를 수도 있다. 애정) 단순한 친구사이 에서 서서히 발전하여 이성적인 연애를 할 수 있다. 그러나 이성 문제에 너무 집착하지 말라. 좋은 운을 그르칠 염려가 있다. 건강) 오래된 질병도 치료하면 쉽게 회복된다. 의원을 바꾸는 것도 좋겠다. 성적인 질병을 조심하라."}, "☴☶": {"no": 39, "name": "풍산점(風山漸)", "text": "운세) 작은 것을 쌓아 큰 것을 이루는 격이다. 어린 기러기가 물가에서 바위로 나무위로 나무가 조금씩 자라듯이 점진적인 발전을 하게 될 것이다. 무모하고 경솔하게 일을 진행 하면 좋지 못하다. 차근차근 노력하다 보면 나중에는 뭇 사람들의 선망을 받게 될 것이다. 마음을 곧고 바르게 가져야 이롭다. 사업) 꾸준히 노력하면 장래의 발전을 기약할 수 있다. 순서와 절차에 따라 거래를 해야 유리하다. 자금 금전) 서서히 풍족해 질 것이다. 뜻밖의 이익이 생기기도 한다. 애정) 이상적인 상대와 축복받는 연애를 하게 된다. 결혼을 계획하는 경우. 주변 사람들의 호응속에 순조롭게 성사된다. 건강) 소화기계통 질환"}, "☴☷": {"no": 40, "name": "풍지관(風地觀)", "text": "운세) 해와 달이 천지를 널리 비추는 겪이다. 땅위에 바람이 불어오면 주위를 관찰하고 자신을 돌이켜 봐야 하듯이 특히 학문 세상을 너무 관념적으로만 바라보는 것은 바람직 하지 못한 자세이다. 포용성 가지고 다른 사람과 협조하는 자세가 필요하다. 평소에 덕을 쌓고 겸손하게 생활하면 복록이 저절로 생기겠으나 받을 수 없다. 사회적으로 다른 사람을 지도하는 입장이거나 교육자라면 특히 대길한 운세이다. 사업) 새로운 사업의 확장에는 신중을 가해야 한다. 먼저 냉철한 판단력과 관찰력이 필요 하다. 재물에 지나친 욕심을 부리는 것은 바람직하지 못하다. 스스로의 판단이 명확하지 않아 갈피를 잡지 못하면 손해를 보게 된다. 금전) 적당한 재물은 생기는 때이다. 욕심을 버리고 노력하면 재물이 따를 것이다. 애정) 이상적인 교제를 하겠다. 그러나 결혼을 생각하는 입장이라면 주변 사정 때문에 시간이 걸리게 된다. 그러나 상대방 여성이 안정된 직업을 가지고 있다면 원만하게 진행 될 것이다. 남자다운 기백이 필요하다. 건강) 대체로 건강한 시기이다. 식욕부진"}, "☵☰": {"no": 41, "name": "수천수(水天需)", "text": "운세) 구름이 하늘에 올라가서 비가 되어 다시 내리기를 기다리는 형국이다. 비가 땅에 내리기까지는 시간이 필요 하듯이 때를 기다려야 한다. 초조해하지 말고 마음을 너그럽게 가져야 크게 성공한다. 적당한 기회를 노리면서 덕을 쌓아야 하는 것이다. 마음을 곧고 바르게 가지면 머지 않아 좋은 결과가 있을 것이다. 어디를 가든지 반드시 성공하게 된다. 사업) 장래는 유망하지만 먼저 주변환경과 기반을 살필 필요가 있다. 교섭과 거래는 초조해 하지 말고 적당한 때를 기다리면 도리어 순조로워 질 것이다. 성급하게 서두르면 분쟁이 발생할 수도 있다. 금전) 일상생활에는 불편함이 없다. 애정) 먼저 생활의 안정을 찿아야 순조로운 교제를 하게 된다. 상대방이 현재 약간의 어려움을 헤쳐 나가야 하는 입장일 수도 있다. 그러나 장래의 발전을 기약할 수 있는 사람이겠다. 한편 상대방의 관심이나 목적이 다른곳에 있을 가능성이 많으므로 여러 곳에 혼처를 알아볼 필요도 있다. 시간이 지나면 좋은 배필을 만나게 될 것이다. 건강) 대체적으로 건강한 편이지만"}, "☵☱": {"no": 42, "name": "수택절(水澤節)", "text": "운세) 사계절이 각각 그 때를 어기지 않는 겪이다. 도모하는 일을 이루기 위해서는 순리와 절제가 필요하다. 넘치지도 모자라지도 않는 안정된 태도를 취해야 좋다. 절제가 지나 치면 발전하지 못하고 지침으로 삼고 순리대로 일을 처리하라. 그리하면 복록이 뒤따를 것이다. 사업) 작은 사업은 착실히 노력하면 상당한 이익을 얻게 된다. 그러나 큰 사업은 신중히 추진해야 실패하지 않는다. 거래와 교섭에는 지나친 욕심을 갖고 임해서는 안된다. 먼저 상대방의 이익과 의도를 인정해 줘야 순조롭게 진행된다. 금전) 재물이 풍족하더라도 저축을 해야한다. 필요없는 지출이 많을 때이다. 애정) 상당히 발전되어 쉽게 헤어지기 힘든 경우가 많다. 지속적인 연애를 하게 된다. 결혼하기에 좋은 시기이므로 건강) 과음"}, "☵☲": {"no": 43, "name": "수화기제(水火旣濟)", "text": "운세) 밝은 임금이 어진 신하를 만나고 상황이 뜻과 같이 이루어지니 안정감과 만족감을 느끼게 된다. 그러나 달이차면 기울 듯이 미래를 대비하는 지혜도 필요하다. 일을 성취한 다음에는 마무리를 잘하고 내부관리에 충실하라. 현상유지에 더욱 치중하고 사업) 사업은 대단한 호황을 누리게 된다. 그러나 현상유지에 주력하고 지나친 확장은 피하라. 동업도 길하지만 의견이 서로 흩어지기 쉬우니 적당한 선에서 양보해야 한다. 금전) 재물운이 왕성하다. 수입을 잘 관리하여 다음을 대비하는 지혜가 필요하다. 애정) 이상적인 상대를 만나게 된다. 서로간의 정신적인 친밀감을 키워야 할 것이다. 한편 건강) 대체적으로 건강한 때이다. 그러나 가벼운 병이라도 생기는 즉시 빨리 치료하는 것이 좋다."}, "☵☳": {"no": 44, "name": "수뢰둔(水雷屯)", "text": "운세) 얼어붙은 땅위에서 새싹이 봄을 기다리고 있는 모습이다. 음과 양이 화합하여 새로운 생명을 탄생시키는 과정과 같다. 아직은 완전한 때가 아니므로 다른사람의 도움을 받으면서 실력을 쌓아야한다. 무조건 앞으로 나아가지 말고 뜻을 펼칠 때를 기다려야 하는 것이다. 약간의 어려움이 있어도 희망을 갖고 꾸준히 노력하면 바라는 바를 이루게 될 것이다. 다른 사람의 부탁을 받으면 서슴지 말고 도와주어야 나중에 복록이 되어 돌아 온다. 혼자서 움직이면 효과를 거두기가 어렵다. 따라서 좋은 협력자를 구해야 할 것이다. 사업) 기복이 심하지만 다른 사람의 도움을 받으면 좋아진다. 희망을 갖고 꾸준히 노력 하면 좋은 결실이 있을 것이다. 교섭이나 거래를 뜻대로 순조롭게 진행시키기 위해서는 서두르지 말고 신중히 추진해야 한다. 금전) 부족함이 없는 상태이다. 그러나 투자한 자금을 제때에 회수하지 못할 수도 있다. 애정) 망설임이 있는 상태이다. 서로의 입장이나 환경이 달라서 곧바로 결합되기는 힘들 수도 있다. 좋은 상대를 만나기 위해서는 급하게 서두르지 말아야 한다. 적극적으로 나서기보다는 느긋하게 대처하라. 건강) 신경"}, "☵☴": {"no": 45, "name": "수풍정(水風井)", "text": "운세) 우물에서 물을 길어올리는 모습으로서 에는 어려움이 있을지라도 시간이 지남에 따라 점점 희망이 생길 것이다. 새로운 일을 도모하지 말고 지금까지 하던 일을 지키는 것이 유리하다. 직분을 지키고 견실하게 노력 하면 복록이 저절로 생길 것이다. 주변 사람들과의 협력관계를 잘 유지하고 넓은 아량 으로 덕을 베풀어라. 사업) 하던 일을 지키고 내부관리에 충실하라. 새로운 일에는 위험이 따르니 먼저 목표를 분명히 해두어야 손해가 없을 것이다. 금전) 지출이 많을 때이다. 사치와 낭비를 줄여라. 애정) 신선한 자극이 필요하다. 정신적으로 친밀한 사이라면 권태감은 쉽게 극복할 수 가 있을 것이다. 건강) 과로"}, "☵☵": {"no": 46, "name": "감위수(坎為水)", "text": "운세) 밖은 허하지만 속은 실한 형국이다. 정성스런 마음과 건실성을 가진다면 혹 어려움이 생기더라도 평탄하게 지나갈 수 있을 것이다. 때로는 마음의 안정을 잃고 흐트러지기 쉽지만 이다. 종교나 학문 연구 분야에 몰두하면 스스로의 능력을 좋은 면으로 발전 있을 것이다. 다른 사람과 시비를 벌이지 말라. 구설수가 두렵다. 넓은 덕을 베풀고 성실 하고 근면하게 생활하라. 때를 맞추어 일을 한다면 나아가 공을 이룰 수 있을 것이다. 사업) 적극적으로 일을 확장하기보다는 먼저 내부관리에 충실해야 한다. 문서 관계는 분명히 처리해야 할 것이다. 남의 보증을 서지 말아야 한다. 교섭에 임할 때는 먼저 상대의 장단점을 파악해야 손해가 없다. 의외로 순조롭게 진행될 수도 있다. 금전) 사치와 낭비를 조심해야 한다. 수입보다는 지출이 많을 때이다. 애정) 깊은 애정에 빠지기 쉽다. 이성문제에 너무 집착하다가는 좋은 운도 그르칠 염려가 있다. 감정의 절제가 필요하다. 건강) 체력을 낭비하기 쉽다. 섭생에 힘쓰고"}, "☵☶": {"no": 47, "name": "수산건(水山蹇)", "text": "운세) 안전한 것을 선택하고 훌륭한 협조자를 얻으면 험한 것을 보더라도 조심하여 머물러 있으면 편안해지는 법이니. 무모한 용기를 부리 거나 모험을 해서는 안 된다. 주변을 관망하고 조심스럽게 행동해야 하겠다. 도모하는 일은 서남쪽이 이롭고 동북쪽은 불리하다. 대인을 만나면 도움을 받게 될 것이니 곧고 바르게 가져라. 사업) 서두르지 말아야 한다. 인사 길을 택하는 것이 좋다. 투자에는 신중해야 손해가 없을 것이다. 스스로를 돌이켜 살피고 덕을 쌓아라. 금전) 작은 돈이 들어오고 큰돈이 나갈 염려가 있다. 지출관리가 필요하다. 애정) 복잡하다. 진지하지 못한 교제는 빨리 청산하는 것이 좋을 것이다. 소극적인 태도가 유리하다. 여난을 조심하라. 건강) 소화기 질환"}, "☵☷": {"no": 48, "name": "수지비(水地比)", "text": "운세) 이 괘는 땅위에 물이 있어 흙과 물이 서로 친근한 형국이다. 이와 같이 덕망 있고 신뢰할 수 있는 사람을 가까이 하면 소망을 이룰 수 있다. 스스로의 지위에 맞추어 좋은 사람들과의 교분을 두텁게 해야 할 것이다. 경쟁이 치열한 때이므로 좋은 일을 남보다 먼저 추진해야 하고 협력자의 도움을 적극적으로 구해야 한다. 진실하게 노력하면 희망찬 내일을 기대할 수 있다. 또한 주변 사람들에게 넓은 덕을 베풀고 화합에 힘써야겠다. 사업) 좋은 협력자를 얻으면 사업을 순조롭게 발전시킬 수 있다. 운세가 왕성하니 많은 수입을 얻게 될 것이다. 교섭과 거래를 할 때는 자신감을 가지고 경쟁 상대보다 빨리 손을 쓰는 것이 유리하다. 금전) 소유하고 있는 재물은 많지 않아도 도와주는 사람이 생긴다. 애정) 길하다. 그러나 주변에 이성이 많기때문에 쉽사리 마음의 결정을 내리지 못하겠다. 한편으론 여난을 조심해야 할 것이다. 구별없이 아무하고나 친하다고 좋은 것은 결코 아니다. 혼담이 오가더라도 결혼까지는 시간이 조금 걸리게 된다. 진실한 마음을 가져라. 건강) 만성적인 병"}, "☶☰": {"no": 49, "name": "산천대축(山天大畜)", "text": "운세) 하늘에 기운이 산으로 내려오니 초목이 무성하게 자라는 형국이다. 지금까지 꾸준히 키워 온 실력을 바탕으로 경험을 바탕으로 미래의 행동에 대한 방침을 정하고 착수하라. 혹 어려움이 있더라도 끈기와 노력만 있으면 앞길은 탄탄대로일 것이다. 안에서 일하는 것보다 밖으로 나가는 것이 좋고 꾸준히 노력하는 분야나 공직에 종사하면 발전이 보장된다. 범이 산속에서 포효하니 뭇 짐승이 다 놀라고 사업) 서두르지 말고 순서에 따라 기초를 다져나가면 큰 이익을 얻게 된다. 재물관리를 잘하면 사업이 번창할 것이다. 상대의 태도가 미온적이더라도 후퇴하지말고 적극적으로 거래를 추진하라. 그러나 지나치게 과격해서는 안된다. 금전) 재물운이 왕성하므로 실력여하에 따라서 큰돈이 들어올수 있을 것이다. 재물을 모으는 과정에서는 노력이 중요하지만 애정) 성실하고 진실한 연애를 하게 된다. 그러나 생활 문제와 가정 문제가 따를 수 있겠다. 좋은 연분을 만나는 때이므로 적극적으로 나서면 좋다. 건강) 과로"}, "☶☱": {"no": 50, "name": "산택손(山澤損)", "text": "운세) 땅을 파서 물을 구하고 보다는 장래의 더 큰 결실을 구하는 것이 현명하다. 처음에는 노고가 따르고 손해를 보더라도 그로써 상대를 기쁘게 만들고 원대한 포부를 실현하기 위해서는 위하여 거리낌 없이 봉사하고 희사하거나 결과가 있을 것이다. 사업) 새로운사업을 벌이면 처음에는 어려움이 있더라도 장래가 유망하다. 서두르지 말고 착실하게 진행해야 한다. 당장은 손해인듯 하지만 꾸준히 노력하면 좋은 결과가 있을 것이다. 이른바 초곤후퇴이다. 그러나 부정한 일에 손을 대어서는 안 된다. 금전) 지출이 많을 때이니 금전 관리에 유의해야 한다. 나중에 풍족해질 것이다. 애정) 서로 진실한 연애를 하게 된다. 좋은 인연을 만날 것이다. 건강) 체력보강에 힘써아 한다. 절제된 생활"}, "☶☲": {"no": 51, "name": "산화비(山火賁)", "text": "운세) 석양의 노을이 세상을 붉게 비추면 냉철한 이성보다는 감상과 상상에 잠기게 된다. 이와 같이 겉모습에 치중하게 되고 쉽다. 분수에 맞는 생활을 하고 실속을 찾아야 하겠다. 계획하는 일은 서서히 진행하는 것이 좋다. 밖으로는 화려하지만 내면으로는 어려움이 따를수 있으니 앞일을 설계해야 한다. 학문 된다. 사업) 겉치레를 많이 하는 사업에는 위험이 따른다. 작은 규모의 사업은 상당히 잘 진행 될 것이다. 특히 상대방의 이익도 고려해야 길하다. 일상적인 거래는 순조롭게 진행 되겠지만 계약을 맺어야 한다. 상대방의 감언이설에 주의하라. 금전) 작은 재물은 쉽게 들어온다. 선물을 받을 일이 많이 생기겠다. 사치와 낭비를 줄여라. 애정) 진심으로 상대를 대해야 실패가 없다. 겉모습에 치중하다가는 손해를 보기 쉽다. 상대방을 냉정하고 깊이 있게 관찰해 볼 필요가 있다. 건강) 절제된 생활을 하지 못하면 질병이 생기기 쉽다. 성병 주의 해야한다."}, "☶☳": {"no": 52, "name": "산뢰이(山雷頤)", "text": "운세) 용이 맑은 물속으로 들어가고 생활속에서 잘못된 것이 있었다면 바로잡고 이러한 과정에서 표면적으로는 태평하겠지만 먹고 마시는 것을 절제하는 것은 몸을 기르는 근본이니 새로운 일을 계획하거나 직업을 갖는데 적절한 시기이다. 스스로의 분수에 맞게 일을 성실하게 추진하라. 실속을 차리기 위해 뜻이 맞는 동료를 찾아서 같이 일하면 좋은 결과를 얻게 된다. 평소에 덕을 쌓고 정직과 성실로써 생활한다면 복록이 저절로 뒤따를 것이다. 사업) 동료의 도움을 받아 단계적으로 일을 추진하면 많은 이익을 얻게 된다. 그러나 지나친 욕심을 부려서는 안된다. 상대와의 교섭과 거래에서는 쉽게 의견일치를 이룬다. 상대방의 실체를 명확히 판단해야 손해가 없을 것이다. 쓸데없는 말을 해서 손해를 보기 쉬우니 언행을 조심하라. 금전) 생활에 부족함을 느끼지 않는다. 그러나 지나친 기대는 좋지 않겠다. 애정) 정신적으로 일치하는 사람과 사귀게 된다. 경제 문제와 같은 주변의 문제를 잘 해결해야 하겠다. 건강) 건강에 소흘하여 병이 생기기 쉽다. 소화불량"}, "☶☴": {"no": 53, "name": "산풍고(山風蠱)", "text": "운세) 잘못된 것을 개선하는 마음자세가 필요하다. 일상생활에서 안락만을 추구하다 보면 심신이 부패해지는 법 잡아 고쳐야 할 것이다. 그 과정에서 때로는 정신적인 괴로움이 따르겠지만 극복하고 나면 오히려 더 크게 형통해지는 법이다. 소인배를 가까이하지 말라. 결국은 이익이 없을 것이다. 사업) 주변 상황의 변동에 잘 대처해야 한다. 적극적으로 새로운일을 벌이거나 확장하지 말고 서두르지 말고 내부 정리를 철저희 한 다음에 응하는 것이 유리하다. 금전) 일상생활에 불편하지는 않다. 그러나 수입보다는 지출이 많을 때이므로 사치를 부리거나 과소비를 하면 곤란하다. 애정) 유희적인 교제를 해서는 안된다. 복잡하거나 자연스럽지 못한 관계가 되기 쉬울 수 있다. 만약 처음 사귀는 경우라면 상대방의 진실성을 자세히 살펴볼 필요가 있다. 건강) 오래 지속된 병이 있으면 빨리 치료하는 것이 좋다."}, "☶☵": {"no": 54, "name": "산수몽(山水蒙)", "text": "운세) 산아래에서 샘물이 솟아오르고 험한 것이 놓여 있으니 형국이다. 확실한 전망을 세우기가 곤란하므로 경솔한 행동을 삼가야 한다. 제자가 스승에게 가르침을 구하고 게몽을 받아야 하듯이 경청해야 하겠다. 또한 협력자와 힘을 합쳐 나간다면 뜻하는 일이 순조롭게 이루어진다. 발전할 가능성이 무한하므로 장래를 바라보고 산처럼 무겁게 덕을 쌓아라. 산골짜기에서 나오는 물이라도 노력하면 넓은 바다에 까지 이르는 법 것이다. 스스로의 노력으로 때를 맞추면 가장 길하다. 사업) 윗사람이나 선배의 의견을 듣고 사업 계획을 세워야 한다. 교섭과 거래는 유능한 사람에게 맡기는 것도 좋다. 처음에는 확실한 결실을 얻지 못하더라도 서서히 나아질 것이다. 금전) 용도가 불확실한 지출이 많겠으니 내부관리를 잘하고 지출에 신경을 써야한다. 애정) 상대방은 적극적이더라도 스스로가 확실히 결정하지 못하고 애매한 행동을 취하게 된다. 조금 기다리면 이상적인 혼인을 위한 좋은 시기가 찾아 올 것이다. 건강) 증세가 애매한 경우가 많다. 호흡기질환"}, "☶☶": {"no": 55, "name": "간위산(艮為山)", "text": "운세) 하던일을 지키고 스스로의 분수를 지켜야 하는 겪이다. 산이 한곳에 머물러 있듯이 부동심으로 지조를 지키고 좋은 때가 오기를 기다려야 한다. 경솔하게 움직이기보다는 장래를 위하여 실력을 쌓는 것이 상책이다. 때와 장소에 맞게 진퇴를 분별하라. 그칠 때는 그치고 행할 때는 행하며 발전을 이루는 분야에서는 큰 발전을 이룰 수 있을 것이다. 사업) 두가지 일을 동시에 벌이기보다는 한 가지로 집중하는 것이 유리하다. 힘의 분산을 막아야 한다. 적극적으로 거래를 하기 전에 상대방을 관망하라. 하고자 하는 의욕은 있으나 업무가 많다면 기른 다음에 다시 시작하는 것이 현명하다. 무리하는 것은 좋지 못하다. 임기웅변을 적절히 구사하라. 금전) 현금이 풍족하지는 않으나 애정) 부담없는 친구사이거나 정신적인 만남이다. 취미 건강) 섭생"}, "☶☷": {"no": 56, "name": "산지박(山地剝)", "text": "운세) 높은 산이 비바람을 맞는 격이다. 지금까지 하던일을 재 점검하라. 만약 새로운 일을 도모 한다면 철저한 사전 준비로 실수가 없도록 해야한다. 겨울철에는 다시 봄이 오기를 기다리듯이 위해서는 흐트러진 심신을 바로잡고 좋은 때가 오기를 기다려야 하는 법. 경솔하게 일을 추진해서는 안 된다. 혹 멀리하는 것이 상책이다. 능력이상의 일을 해야 하는 부담이 생기더라도 형성하여 윗사람이나 동료의 도움을 받으면 뜻하는 일을 순조롭게 진행시킬 수 있을 것이다. 사업) 확장보다는 먼저 내부관리에 충실하라. 관리소흘로 뜻밖의 손해를 초래할 수 있다. 상대를 먼저 파악하고 충분한 사전 조사를 한 다음 거래에 임해야 손해가 없다. 금전) 주변의 일로 불필요한 금전 지출이 많을 때이다. 사치와 낭비를 해서는 안 된다. 애정) 주변에 이성이 많더라도 진지함이 결여된 만남이라면 빨리 청산 하는편이 낫다. 색난을 조심해야 할 것이다. 만일 중매 결혼을 하게 된다면 먼저 중매인의 진실성을 잘 파악해야 한다. 건강) 오래된 병이있으면 치료를 해야 한다. 체력소모"}, "☷☰": {"no": 57, "name": "지천태(地天泰)", "text": "운세) 작은 것이 가고 큰 것이 들아오니 모든 것이 원만한 격이다. 운수가 대길하니 뜻하는 일을 순조롭게 이룰 것이다. 주변 사람들과 단결이 잘되므로 착수하여도 순풍에 돛단 듯 어려움 없이 발전한다. 겉으로는 유순하고 안으로는 견실하니 불만이 없는 모습이다. 포부를 크게 갖고 성심으로 노력하면 더욱 길하다. 그러나 일이 잘 풀리면 교만과 나태에 빠지기 쉬우니 야 한다. 군자의 덕을 쌓는 사람은 득세 하겠지만 소인 이라면 몰락한다. 사업) 노력에 비하여 많은 결실이 따르는 시기이다. 작은 투자로 큰 이익을 얻게된다. 적극적으로 추진하면 교섭과 거래는 쉽게 이루어 질 것이다. 내부관리에 더욱 신경 써야 한다. 금전) 많은 수입을 기대할 수 있다. 뜻밖의 횡재가 생길 수 있으며 금전의 융통 원활하다. 애정) 좋은 상대를 소개받을 수 있다. 남성에게 의지하면서도 분위기를 잘 이끌어 가는 현숙한 여성과 교제하게 된다. 여성의 경우 상대방 남성은 도량이 넓고 이상적이다. 혼인하기에 적절한 시기이다. 건강) 신체는 건강하지만 간혹 무절제한 생활로 인한 병이 생기기 쉽다. 두통"}, "☷☱": {"no": 58, "name": "지택림(地澤臨)", "text": "운세) 고기와 용이 넓은 바다와 강을 만난 격이다. 봄과 여름에는 양기가 왕성해지는 것과 같이 활약이 기대되는 때이다. 그러나 운세가 강하기 때문에 지나치게 앞질러 나가는 경향도 있다. 새로운 일에 착수하는 것도 좋지만 행동해야 할 것이다. 또한 미래를 위하여 대비하고 주의하는 것이 좋다. 변화의 시기에는 주변의 협력자와 힘을 합쳐야 하고 이므로 결단력과 순발력이 필요하다. 하지만 그러한 운세라고 해서 스스로 교만에 빠져서는 안 되겠다. 사업) 새로운 사업에 착수하면 순조롭게 진행된다. 그러나 신중을 기해야 한다. 상대와의 거래와 교섭에서는 강경책보다 온건책이 유리하다. 주위의 변화에 보조를 맞추어 나가라. 금전) 여유가 있다. 그러나 사치에 빠지기 쉬우므로 지출은 신중하게 해야 한다. 애정) 화려하고 달콤한 연애를 하게 된다. 그러나 결혼에 대해서는 상대방이 가정사정 등을 이유로 주저할 수 있다. 좋은 연분을 만나는 때이므로 성사 시키기 위하여 노력하라. 윗사람의 의견을 따를 필요도 있다. 건강) 건강할 때이므로 사소한 병이 생기더라도 쉽게 회복한다. 가벼운 증상을 병으로 착각하기 쉽다. 호흡기"}, "☷☲": {"no": 59, "name": "지화명이(地火明夷)", "text": "운세) 성인이 세상에 나올 전조로서 나타난다는 상상속의 상서로운 동물 것은 밟지도 먹지도 않는다고 한다. 이 성인을 기다리는 형국이다. 미래를 위하여 차분 하게 내면의 실력을 기르는 것이 상책이다. 특히 학문연구나 시험준비와 같이 차분하게 실력을 쌓는 분야에 종사하면 좋은 결실을 얻게 된다. 만약 자신의 역량을 과신하여 나태한 생활을 해 나간다면 결국 이익이 없을 것이다. 하는 일에 혹 어려움이 있더라도 상황이 정상으로 돌아올 때까지 바른길을 지켜라. 마음속에 밝음을 간직하고 겉으로는 유순하게 행동해야 하는 것이다. 덕은 베풀고 다른 사람의 시기나 구설 주어야겠다. 나쁜 유혹이나 사기를 조심하라. 마음을 곧고 바르게 가져야 이롭다. 사업) 하던일에 충실하는 것이 좋다. 새로운 일을 벌이거나 사업을 확장하는 데는 어려움 이 따르기 쉬우니 철저한 계획과 준비가 필요하다. 속임수가 있겠으나 거래에는 신중을 기하고 금전) 돈이 풍족하지는 않다. 재물이 많더라도 남에게 과시하면 뜻밖의 손해를 본다. 애정) 다른 사람들이 잘 모르는 은밀한 교제를 하게 된다. 비밀이 많을 때이다. 짝사랑을 할 수도 있겠다. 건강) 체력보강과 섭생에 힘써야 한다. 소화기 질환"}, "☷☳": {"no": 60, "name": "지뢰복(地雷復)", "text": "운세) 겨울이 지나고 따뜻한 봄이 다시 돌아온 격이다. 1년중의 절기로 비유하자면 해가 점점 길어지고 양기가 처음으로 생기는 동지에 해당한다. 새로운 일을 시작할 수 있는 자신감과 능력이 생길 것이다. 만약 유망한 사업을 발견하면 꾸준히 노력하는 태도가 중요하겠다. 그러나 아직은 성급하게 추진 해서는 안 된다. 운세가 아직은 썩 강하지 않다. 따라서 차근차근하게 계획을 세우고 가까운 것부터 시작하여 서서히 먼 곳에까지 확장 시켜 나가야 한다. 땅을 파서 금을 얻듯이 머지 않아 마음껏 활약 할 때가 올 것이다. 특히 고향을 떠나 타향에서 방황하던 사람은 금의환향하고 이라면 드디어 뜻을 이루고 노력의 대가를 얻을 수 있을 것이다. 사업) 차차 활기를 띠게 된다. 그러나 경솔하게 여러가지 일을 벌이면 소득이 별로 없을 것이다 거래를 할 때에는 계약 금전) 일상생활에 부족함은 없다. 그러나 상업에 종사하는 사람은 금전 융통이 뜻대로 순조롭지는 못할 것이다. 애정) 주변에 따르는 이성이 많겠으나 단순한 친구 수준의 교제로 그치기 쉽다. 재혼이나 재결합을 하려는 경우는 의미가 좋은 운세이다. 그러나 초혼인 경우라면 신중을 기할 필요가 있다. 건강) 오래된 병이 있더라도 다시 회복할 수 있을 것이다. 위장"}, "☷☴": {"no": 61, "name": "지풍승(地風升)", "text": "운세) 작은 것을 쌓아 큰 것을 이루는 격이다. 능력을 인정받아 점차 뜻을 펼치게 될 것이다. 어린나무가 싹이터서 큰 나무로 자라듯이 걷게 된다. 그러나 단번에 뛰어오르는 도약은 아니기 때문에 단계적으로 실력을 쌓아야 한다. 노력하면 반드시 목표를 달성하게 될 것이다. 훌륭한 협력자나 윗사람과 가까이 하는 것이 좋다. 덕과 지위의 향상에는 반드시 대인의 도움이 필요한 법이다. 처음에는 스스로의 힘이 부족하므로 경솔하게 행동해서는 안된다. 사업) 새로운 계획이나 계약에 착수하게 된다. 처음부터 큰 이익을 바랄수는 없지만 운세가 왕성하니 적극적으로 움직이면 좋은 결과를 얻게된다. 적은 자본금으로 높은 수익을 얻게 될 것이다. 그러나 투기성 사업은 좋지 않다. 금전) 노력한 만큼의 대가를 바랄 수 있다. 수입이 점점 증가할 것이다. 애정) 오래된 만남이라면 사이가 더욱 긴밀해지고 사귀게 된다. 좋은 연분이다. 건강) 소화기질환"}, "☷☵": {"no": 62, "name": "지수사(地水師)", "text": "운세) 이 괘는 땅속에 물이 있는 모습과도 같다. 지하수는 지상으로 나와 만물에 공급 될 때 비로서 그 가치를 발휘하게 된다. 따라서 앞으로 수많은 사람을 거느리게 될 것이 다. 많은 사람이 모여들어 경쟁이 심해지고 혼란이 생기면 태도를 취해야 하는 법 대하면 복록이 따를 것이다. 내부관리에 충실하고 성심으로 노력하라. 도움을 받을 수 있는 훌륭한 협력자나 조언자가 필요하다. 사업) 하던 일을 지키면 이익이 있다. 새로운 일을 벌일 때에는 내부의 단결을 먼저 도모 해야 한다. 상대와의 교섭과 거래는 적극적으로 추진하는 것이 유리하다. 금전) 일상생활에 불편하지 않을 정도의 재물은 생긴다. 사적인 일보다 공적인 사업에 중점을 두면 이익이 많을 것이다. 애정) 현실적인 생활이 우선이고 약간 무리가 있다. 혼인을 순조롭게 추진하기 위해서는 먼저 생활을 안정 시켜야 할 것이다. 남성의 경우 얽메이면 좋지 못하다. 건강) 만성질환으로 생기는 병 건강을 위해 시간을 가질 필요가 있다."}, "☷☶": {"no": 63, "name": "지산겸(地山謙)", "text": "운세) 행동을 조심하고 주변사람들을 겸손하게 대해야 한다. 도리에 맞는 생활을 하면 저절로 복록이 찾아올 것이다. 지나침은 모자람만 못한 법이니 있으면 모자라는 곳에 덜어 주어야 한다. 욕심을 부리지 말고 주변 사람들에게 베푸는 태도가 중요하겠다. 겸양의 도는 어디에나 통하지 않는 곳이 없다. 구름속에 있는 달은 시간이 지나면 저절로 빛을 발하게 될 것이니 한다. 달이 차고 나면 겸손의 덕으로써 지켜 나가야 한다. 사업) 기반을 다지고 내부관리에 충실해야 한다. 교섭과 거래는 서두르지 말아야 한다. 순서를 따라 진행하면 성사될 가능성이 높아진다. 금전) 넉넉하지는 않으나 일상생활에는 불편함이 없다. 여유있는 마음으로 살아가면 곧 풍족해 질 것이다. 애정) 남성의 경우 주변에 여성이 많겠다. 진실하지 못한 교제는 하지 않는것이 바람직 하다. 지나친 욕심을 부리면 손재수가 생길 우려도 있다. 혼인을 계획하는 경우 와의 정신적인 일치감이 강하다면 시간은 걸려도 성사는 될 것이다. 스스로 남자로서의 강한 기백을 키워야 한다. 건강) 만성병"}, "☷☷": {"no": 64, "name": "곤위지(坤為地)", "text": "운세) 대지는 모든 것을 제한 없이 싣고 키우는 덕을 갖고 있다. 땅위를 걸어다니는 유순한 암소처럼 것이 더 길하다. 또한 땅이 만물을 포용하는 것처럼 사람들에게 덕을 베풀어야 한다. 분수를 지키고 마음을 곧게 가지면 모든 일을 순조롭게 이룰 수있을 것이다. 서남쪽으로 가면 좋은 협력자를 얻지만 사업) 좋은 협력자를 만날 수 있다. 그러나 새로운 사업을 적극적으로 추진할 때는 아니 므로 지나치게 성급하거나 우유부단하면 손해를 보게 된다. 상대의 이익을 먼저 생각해 주면 순조롭게 진행될 것이다. 애정) 마음의 결단을 쉽게 내리지 못한다. 오래 끈다면 흐지부지될 가능성도 있다. 결혼을 계획하는 경우 남성의 경우 의 경우 건강) 과로"}, "☱☴": {"no": 13, "sym": "☱☴", "name": "택풍대과(澤風大過)", "text": "운세) 지나침은 오히려 모자람만 못한 것이다. 정상적인 괘도를 지키고 중도를 지켜야 길할 것이다. 책임지고 해결해야 할일이 많아서 분주한 세월을 보낼 수도 있다. 그렇더라도 많은 임무를 한꺼번에 해결하려 들지말고, 사소한 문제는 보류하며 마음의 안정을 취해야 한다. 다른 사람의 협조를 구하거나, 양보할 것이 있다면 양보하라. 어려움이 있더라도 침착하게 대처하면 도리어 좋은 결과를 얻게 되는 법이다. 사업) 능력 이상의 일을 벌려서는 안된다. 먼저 기초를 튼튼히 다지고 내부관리에 충실 해야 할 것이다. 균형을 맞추어 일을 추진한다면, 거래와 교섭에서는 안면이 있는 사람이 뜻밖의 도움을 줄 것이다. 사적인 일은 보류하거나 무시해도 되겠지만, 공적인 일은 과감하게 추진, 처리하라. 금전) 수입과 지출의 균형을 맞추어야 한다. 애정) 복잡하고 미묘한 만남이 되기 쉽다. 연령차이가 많은 이성을 사귀게 될 가능성이 많다. 무엇보다 서로의 성격을 잘 조화시켜야 할 것이다. 건강) 과로해서는 안된다. 소화불량, 체력낭비가 염려된다, 섭생조절에 힘쓰고, 오래된 질환은 빨리 치료해야 한다."}, "☲☴": {"no": 21, "sym": "☲☴", "name": "화풍정(火風鼎)", "text": "운세) 진귀한 신선의 약을 얻으며, 옛것을 버리고 새것을 취하는 운세이다. 나무에 불이 붙어서 타오르는 것처럼, 계획하는 일이 순조롭게 진행될 것이다. 특히 다른사람들과 협력하여 일을 추진하면 예상 밖의 소득을 기대할 수 있다. 인화단결이 중요하다. 윗사람에게는 공손하고 아랫사람에게는 관대하게 처세하라. 낡은 것보다는 새롭고 참신한 것에 뜻을 두어야 할 것이다. 사업) 사업의 내용이나 겉모습을 새롭게 하는 것이 중요하다. 또한 좋은 협력자를 얻어 일을 진행해야 한다. 뜻이 맞는 세사람이 동업을 하여 이익을 골고루 분배하는 것도 좋겠다. 거래에서는 먼저 상대의 입장과 이익을 고려해 주어야 좋은 결과를 얻을 수 있다. 금전) 풍족하다. 자금을 여러 곳으로 융통시켜야 한다. 애정) 이지적이며 성격이 잘 맞는 여성과 교재하게 된다. 여성의 경우, 상대방 남성이 수려하다. 진실성만 있다면 혼담도 원만하게 이루어 지겠다. 분위기를 주도적으로 이끈다. 건강) 전염성 질환, 호흡기 질환, 장 질환 등에 주의하라."}, "☳☲": {"no": 27, "sym": "☳☲", "name": "뇌화풍(雷火豊)", "text": "운세) 어둠을 멀리하고 밝음을 향하여 나아가는 겪이다. 태양이 중천에 떠 있으면 세상이 밝고 환해진다. 이와 같이 운세가 강하고 활기차니 풍성한 결실을 얻을 수 있겠다. 그러나 달이차면 기울듯이, 표면적으로는 원기 왕성하더라도 내부적으로는 점차 힘이 약해지기 시작한다. 만약 오랫동안 끌어온 일이 있다면 빨리 마무리 지어라. 일을 신속 하고 분명하게 처리 할 수 있는 결단력과 임기웅변이 필요하다. 사업) 순조롭게 진행된다. 그러나 신규사업을 벌이기보다는 성대해진 사업을 견실하게 운영하는 것이 더 중요하다. 내부 관리에 충실해야 하겠다. 상대와의 거래는 빨리 결정 내리는 것이 유리하다. 강한 운세를 믿고 경솔하게 처리 해서는 안 될 것이다. 금전) 재물운이 왕성하다. 그러나 겉치레와 사치로 인한 지출을 삼가야 한다. 저축을 해두는 것이 좋겠다. 애정) 물질적이고 외면적이며 유희적인 연애를 하기 쉽다. 상대방의 화려한 겉모습 만을 보지 말고 내면과 진실성을 파악해야 실패를 막을 수 있을 것이다. 결혼을 계획하는 경우는 생활문제, 가정문제를 먼저 해결해야 순조롭게 진행된다. 건강) 변화가 많을 때이므로 평소에 충분한 섭생과 건강관리가 필요하다. 유행성 질병, 급성 병 등을 조심해야 한다."}};

function _getEN(sym) {
  if (!_ZAMI_EN_DATA) {
    _ZAMI_EN_DATA = {"☰☰": {"no": 1, "name": "Qian — Heaven over Heaven (乾為天)", "text": "Qian embodies the image of six dragons ascending to the heavens in supreme strength. Celestial Guidance) This is a period of extraordinary power; it is auspicious to hold great ambitions and pursue grand undertakings. As the sky is vast and boundless, walking the righteous path shall leave no obstacle before you — conduct yourself with honour and dignity. Model your life upon the way of Heaven: maintain discipline, strive with diligence, and above all preserve humility. To build great things from small foundations, draw close to trustworthy superiors and faithful companions. Enterprise) Tangible gains do not manifest with ease at this time. An abundance of talent around you, or a diversity of opinion, makes execution difficult. In negotiations and transactions, excessive haste breeds loss. Persevere with patience and in time all shall come to fruition. Wealth) Daily needs are not wanting; however, those in commerce may find the flow of capital constrained. Romance) When two strong and wilful natures meet, the sweetness of love is difficult to taste. Men tend to encounter women who are either reserved or intensely active; women encounter men who are reliable and trustworthy. Self-restraint in matters of the heart is essential. Vitality) Generally sound, yet vigilance against infectious ailments is advised."}, "☰☱": {"no": 2, "name": "Lü — Heaven over Lake (天澤履)", "text": "Lü signifies treading the path — to walk it and to put principle into practice. Celestial Guidance) Even if one finds oneself in an unfavourable position, as treacherous as stepping on a tiger's tail, perseverance in propriety and righteous conduct shall bring ultimate good fortune. It is vital to follow the appointed order of things and not overreach one's station. Observe those who walk ahead and guard against failure. One who accepts responsibilities beyond one's capacity risks falling short midway; yet if one succeeds in bearing such a burden, the reward shall be unexpectedly great. In new endeavours, heed the counsel of those wiser than yourself and unite your strength with trustworthy partners. Patience and the flexibility to adapt gracefully to circumstances are indispensable. Enterprise) Lay thorough plans before acting. Handle contracts with care from the outset. Avoid petty disputes with others. Follow the guidance of superiors when difficulties arise and in time conditions shall improve. Wealth) Sufficient for comfortable living; effort can bring increase. Substance is to be valued over appearance. Romance) Many suitors surround you, making it difficult to settle on one. Guard against unworthy entanglements and deal with others with sincerity. Vitality) Generally a healthy season. Take care of the respiratory system."}, "☰☲": {"no": 3, "name": "Tong Ren — Heaven over Fire (天火同人)", "text": "Tong Ren means to unite with others — to act in common purpose. Celestial Guidance) Just as the sun illuminates all the world with impartial light, acting with fairness and integrity shall bring your aspirations to fulfilment. Do not pursue what runs contrary to reason. This is a favourable time for partnership and joint endeavour; greater development may be expected. This is a period in which you may lead many; those around you shall respond with support. Yet fierce competition among people for the same aims may arise, and jealousy may appear. In such circumstances, open communication and sincere cooperation shall lead to great success. Enterprise) Careful internal management yields smooth progress. Exercise caution in the concluding of agreements. On the whole, the assistance of colleagues and superiors is your good fortune. Joint ventures are especially auspicious. You shall hold the initiative in negotiations and dealings. Wealth) A sense of abundance prevails. Gains shall exceed the efforts made. Beware, however, of disputes arising from financial matters. Romance) Competitors for your affection are numerous. Women in particular may find it difficult to choose from many admirers. Maintaining a deep spiritual intimacy with your chosen one shall bring fine results. This is a suitable time to consider marriage, but first observe your partner carefully. Vitality) Guard against contagious ailments."}, "☰☳": {"no": 4, "name": "Wu Wang — Heaven over Thunder (天雷无妄)", "text": "Wu Wang signifies the natural state unburdened by desire — pure spontaneity. Celestial Guidance) Thunder sounds from heaven: acting in accordance with the principles of Heaven brings good fortune. Launching ventures without preparation yields rumour without substance. Do not pursue what ought not to be pursued. Cultivate inner completeness and seek stillness, and unexpected good fortune shall come. Though hesitation and a scattered mind may arise, like a parched tree receiving the long-awaited rain, your intentions shall be fulfilled with ease. Enterprise) Do not rush to expand into new endeavours; consolidate your position first. Act in accordance with natural order. In negotiations and transactions, respond in kind to the attitude of the other party. Wealth) This is a time to secure real substance. Daily needs are not lacking, but excessive attachment to wealth should be avoided. Pursuit of honour and repute brings faster reward. Romance) You shall meet one whose temperament resembles your own — a person of learning and refinement is a particularly fine match. Marriage proceeds naturally without the need to force it. Affection between husband and wife is warm. Vitality) Health is good; even if illness arises, natural recovery follows. Aggressive treatment is unnecessary."}, "☰☴": {"no": 5, "name": "Gou — Heaven over Wind (天風姤)", "text": "Gou signifies encounter — the meeting of forces. Celestial Guidance) The sun and moon pass through darkness and return to light. Set your aims clearly and live by them; without firm resolution you shall miss favourable moments and suffer loss. On the whole this is a period in which wealth may be gathered — unexpected windfall is possible, yet so too is loss through deception. Act with cool and clear judgement. The timing of this Sacred Hexagram is paramount. Even if the beginning of an endeavour appears modest, reflect deeply before proceeding. Enterprise) Do not rashly scatter your energies into new ventures; remain devoted to what you are already doing. Even if things do not proceed as hoped, advance step by step without haste, and a fine unexpected opportunity shall appear. Be wary of fraud and the loss of valuables. Vigilance must not lapse. Wealth) Small sums come in while large sums flow out easily. Live within your means. Romance) Relations tend toward self-indulgence and playfulness. Women may find themselves so popular that genuine affection becomes difficult to secure. The true intentions concealed behind a friendly façade must be discerned with care. Vitality) Guard against fatigue."}, "☰☵": {"no": 6, "name": "Song — Heaven over Water (天水訟)", "text": "Song signifies supplication — to make one's case before a higher authority. Celestial Guidance) You must respect and defer to the intentions of others. Even when you believe yourself to be in the right, exercise restraint. The posture of harmonising with your surroundings and adapting gracefully to the prevailing atmosphere is what is needed. A humble and yielding disposition shall cause blessings to follow of their own accord. Guard your words and actions and keep clear of needless disputes; otherwise conflicts of opinion or financial quarrels with those around you are likely. Enterprise) Do not pursue ventures that exceed your proper station. Partnership is unfavourable. Handle documents with meticulous care. In negotiations and transactions, bring matters to a clear and definite conclusion. Do not isolate yourself; it is wise to seek the assistance of a trusted third party. Romance) Your circumstances and outlook often diverge from those of your partner. Maintain a bright and cheerful demeanour. If you first seek to understand the other, minor conflicts resolve themselves easily. Vitality) Take care of digestion."}, "☰☶": {"no": 7, "name": "Dun — Heaven over Mountain (天山遯)", "text": "Dun signifies withdrawal — to retreat and take shelter from difficulty. Celestial Guidance) Fortune and misfortune stand opposed: though early hardship is present, tranquility follows in time. Rather than forcing matters, it is more advantageous to preserve the status quo. In all you plan, examine both the beginning and the end before proceeding. Occasion rises to step away from complex affairs and find quiet pleasure. Petty influences must be gently but surely kept at distance. Though effort must be made in advance of any undertaking, aligning oneself with the right moment is what assures good fortune and success. Enterprise) To secure real gains, attend first to small matters faithfully before embarking on grand projects. Especially in negotiations and transactions, do not push forward on your own initiative. Exercise caution in investment. Wealth) Expenditure exceeds income; careful management is essential. Standing surety for others carries danger — take particular care. Neither borrow nor lend money. Romance) Even simple social obligations bring expenditure. First establish your own footing securely. Vitality) Regular attention to physical conditioning is needed. Beware of chronic ailments."}, "☰☷": {"no": 8, "name": "Pi — Heaven over Earth (天地否)", "text": "Pi signifies obstruction — the absence of foundation, causing affairs to stagnate and not flow freely. Celestial Guidance) Even if early hardship is present, matters shall gradually open up and find resolution. Enduring difficulty leads to unexpectedly great harvest. Forsake extravagance and build inner substance through frugal virtue. Acting with a magnanimous and careful spirit shall cause fine blessings to take root. Do not become ensnared by the pursuit of honour or wealth; ensuring that communication flows freely between above and below is what matters most. When obstacles arise, seek the assistance of a person of great virtue and standing. Enterprise) Rather than advancing aggressively, quiet steady progress is better. Direct greater attention to internal management. In negotiations and dealings, the opposing party holds the stronger position, placing you in a passive stance — yet if the relationship is long-established, there is no difficulty. Wealth) Generally insufficient. Guard documents and finances carefully against the risk of loss. Romance) Examine the sincerity of the other party carefully before acting. Long-established relationships are manageable; otherwise, great effort is required to achieve harmony. Those planning marriage shall face some difficulty, yet in time it shall be accomplished. Vitality) Building physical constitution is important. Guard against loss of appetite."}, "☱☰": {"no": 9, "name": "Guai — Lake over Heaven (澤天夬)", "text": "Guai signifies resolution and decisive action. Celestial Guidance) Your fortune rises as gloriously as the morning sun. Those in employment shall advance in rank; students shall improve their standing. Yet if humility is abandoned, failure may actually result. Excess is worse than deficiency — maintain balance. Show respect to superiors and magnanimous generosity to those beneath you, dispensing virtue freely. Enterprise) Establish a clear plan and await the right moment. Blind advance brings loss. Even when business is flourishing, steady and careful management sustains prosperity. In dealings with others, do not be hasty — respond passively according to the attitude of the other party. Do not stand surety for others carelessly. Wealth) Abundance of wealth shall come; excessive greed must be avoided. Consider the benefit of those around you and practise appropriate generosity. Romance) The situation is complex. If conflict with your partner arises, it is better to resolve it swiftly. First observe the other carefully. Vitality) Attend promptly to any illness that arises. Give particular care to ailments of the respiratory system."}, "☱☱": {"no": 10, "name": "Dui — Lake over Lake (兌為澤)", "text": "Dui signifies joy and delight. Celestial Guidance) Like vegetation reviving under a gentle spring rain, many hopeful and pleasant things shall arise in daily life. Yet this Sacred Hexagram contains, alongside joy, a meaning of inner incompleteness. Bring all great matters to clear and definite conclusions, and do not engage in disputes with others. Avoid involvement in internal conflicts or factions within any organisation. Enterprise) Devotion to your present work shall bear fine fruit. Build substance and solidity. Ventures in sales, promotion or publicity are promising. In dealings with others, a moderate and measured approach proves advantageous. Win the other's trust and goodwill through humility and sincerity. Wealth) Sufficient for comfortable living, though the outward appearance of affluence may exceed the inner reality. Conditions shall improve gradually. Romance) There is a tendency toward superficial and playful relationships focused on outward appearance. Those planning marriage should examine the sincerity of the other party closely. Do not become excessively attached to matters of the heart — there is a risk of squandering good fortune. Vitality) Take care of ailments of the mouth."}, "☱☲": {"no": 11, "name": "Ge — Lake over Fire (澤火革)", "text": "Ge signifies reformation — to renew and transform what is old. Celestial Guidance) The time has come to set aside the old and embrace the new. The people around you change, and new territories open up in your work. Those in positions of leadership who judge that the hour of reform has arrived should act decisively to bring about change. Marriage or the expansion of one's household is also possible. On the whole, this is a fine season for embracing change, but the right path must be found to avoid error. Confronting difficult circumstances and breaking free requires determined effort. Enterprise) A new enterprise takes shape. Renovation of one's home or relocation is also possible. A fine opportunity presents itself in transactions and dealings as well. Yet do not act with excessive haste. Wealth) The fortunes of wealth are vigorous; depending on the degree of investment and effort, great gains are possible. Romance) Those who have missed the proper time for marriage shall find a worthy partner appearing. Conduct your relationship with integrity. Vitality) If a long-standing ailment exists, seek prompt treatment. Guard against fatigue."}, "☱☳": {"no": 12, "name": "Sui — Lake over Thunder (澤雷隨)", "text": "Sui signifies following — to adapt and move in accordance with the flow. Celestial Guidance) Though thunder rages fiercely in summer, it is a period in which one must adapt to one's environment and act accordingly. Following the counsel of others is the wisest course. Cultivating your abilities with a watchful and patient posture shall cause fine opportunities to arrive of their own accord. Adapt swiftly to changing circumstances. As one who rests at night after the labours of the day, those who have been vigorously active must now listen to others and reflect inward. The noble person moves in harmony with the season. At times you may find yourself working alongside those of limited ability; yet bear with them with a generous heart and avoid meddling excessively. Holding your mind upright and clear shall be to your benefit. Enterprise) Aligning your actions with prevailing trends yields fine results. Do not neglect observation of the surrounding environment. You shall tend to encounter skilful and experienced parties in your dealings. Even when progress is slow, patience and perseverance bring the matter to completion. Wealth) The flow of funds is smooth and income increases; expenditure also rises. Romance) Your partner tends to be considerably older or younger. Women may occasionally find themselves with a younger man. Guard carefully against entanglement in a triangular relationship. For those planning marriage, the way shall proceed smoothly; after marriage, work to cultivate spiritual unity. Vitality) Even minor ailments must not be overlooked. Take care during seasonal transitions."}, "☱☴": {"no": 13, "name": "Da Guo — Lake over Wind (澤風大過)", "text": "Da Guo signifies excess — going too far beyond what is proper. Celestial Guidance) Excess is worse than insufficiency. Remain upon the correct course and hold to the middle way — only so shall good fortune follow. You may find yourself burdened with much responsibility, passing through a busy and demanding season. Even so, do not attempt to resolve all obligations simultaneously. Set aside minor matters and preserve inner equilibrium. Seek the cooperation of others; where concession is called for, concede. Though difficulties arise, meeting them with composure shall in fact yield fine results. Enterprise) Do not embark on ventures that exceed your capacity. First lay solid foundations and attend faithfully to internal management. Proceeding in a balanced manner, an acquaintance may offer unexpected assistance in negotiations and dealings. Set aside personal matters or deal with them minimally, but pursue public and important work with bold resolution. Wealth) Income and expenditure must be kept in balance. Romance) The relationship tends toward complexity and subtlety. There is considerable likelihood of involvement with someone of a very different age. Above all, the temperaments of the two must be brought into harmony. Vitality) Avoid overexertion. Guard against digestive troubles and depletion of vitality. Attend to long-standing ailments promptly."}, "☱☵": {"no": 14, "name": "Kun — Lake over Water (澤水困)", "text": "Kun signifies entrapment — being blocked and obstructed by circumstances from without. Celestial Guidance) Observe your proper measure and await your season. Strive earnestly with righteous conviction and resolute action. Living with a clear purpose shall transform misfortune into good fortune. If difficulty arises, the wisest course is to withdraw with a composed mind and wait patiently. In this way, discern your own shortcomings, build your real abilities, and a new opportunity for advancement shall present itself. Draw close to fine superiors and worthy companions. Enterprise) Beware the honeyed words of others. Persevere faithfully in your present work and build your strength — a better time shall come. In dealings, do not rush; yield up to a point. Bring all matters to a definite conclusion. Wealth) Expenditure exceeds income at this time. Reduce extravagance and waste. Do not be deceived or manipulated by others. Romance) It is wise to end impure relationships swiftly. Take special care with those of considerably different age. The sincerity of the other party must be judged with precision. Beware of becoming trapped in an unwise one-sided attachment. Vitality) Attend to physical conditioning. Avoid overexertion."}, "☱☶": {"no": 15, "name": "Xian — Lake over Mountain (澤山咸)", "text": "Xian signifies mutual resonance — the felt response of heaven and earth to sincere effort. Celestial Guidance) Like life-giving rain falling upon a parched land, sincere and devoted effort shall move even the heavens. Receive what is right and act with integrity, and unexpected fine results shall follow. Cultivate deep spiritual fellowship with those around you and embrace the aspirations of those beneath you with open generosity. The assistance of others shall bring about unexpected celebrations. Enterprise) Many helpful people surround you at this time. You are likely to encounter someone with fine and innovative ideas. Having set a goal, advance swiftly — hesitation causes opportunities to slip away. Negotiations and transactions shall proceed better and faster than anticipated. Wealth) Ample for comfortable living. Depending on effort and skill, large sums may also be expected. Romance) You shall meet an ideal partner and experience a passionate connection. A marriage formed at this time shall lead to a happy and harmonious household. Vitality) Physical health is good. Take care against colds."}, "☱☷": {"no": 16, "name": "Cui — Lake over Earth (澤地萃)", "text": "Cui signifies gathering and flourishing — assembly leading to abundance. Celestial Guidance) As a dragon meets the open sea and ascends with power, your enterprise shall thrive. Many shall gather around you in support. Yet on the other side, competition intensifies and disputes become easy to arise — working together with many people in unity enables great undertakings to be achieved. In all that you pursue, seek the counsel of a person of great wisdom and virtue so that no error, however small, may occur. Enterprise) Fortune is vigorous; you shall accomplish your aims with ease. In dealings, do not be driven purely by economic gain — consider the benefit of the other party as well. Wealth) Material abundance prevails. You must concentrate your energies on improving your own abilities. Romance) An ideal romance unfolds. However, spreading your attentions across multiple parties means achieving nothing well. Vitality) Guard against ailments of the respiratory system."}, "☲☰": {"no": 17, "name": "Da You — Fire over Heaven (火天大有)", "text": "Da You signifies great possession — great abundance in all things. Celestial Guidance) Your fortune shines as brilliantly as the sun blazing at its zenith in the heavens — like a bountiful harvest in the season of autumn. Wealth is plentiful and the spirit finds stability; all things under the sky are peaceful. Yet just as the sun does not linger at the zenith forever, strive also to preserve what you have gained. Do not overlook the changes in your surroundings and keep pace with the currents of the age. Enterprise) The fortunes of enterprise are exceptionally vigorous; great gains shall be realised. Maintain and manage carefully the operations that have been built up; a steady hand is best. Act swiftly in dealings and negotiations. Working collectively as a group is more advantageous than acting alone. Wealth) Material abundance and the free flow of funds characterise this season. Occasional expenditure for the sake of family or friends may arise. Romance) Women hold a position of considerable influence. Intellectually sharp, proud and self-possessed, they tend to be both sharp-witted and attractive. For women, this is a fine time to move forward. Vitality) Take care of appetite and digestion."}, "☲☱": {"no": 18, "name": "Kui — Fire over Lake (火澤睽)", "text": "Kui signifies opposition and divergence — striving amid estrangement. Celestial Guidance) This is a favourable season for pursuing modest matters. Setting aside excessive ambition permits peaceful and undisturbed progress. Devote yourself to harmony with those around you and guard your words and deeds with care. Cultivating deep spiritual bonds in ordinary times shall bring abundant assistance when it is needed. Tensions or issues within the household or the workplace should be anticipated and resolved early. Living faithfully in daily life and maintaining a yielding posture in all things shall cause fine fruit to follow. Enterprise) Before aggressively pursuing new ventures, attend first to the faithful internal management of your present work. Small matters shall proceed smoothly, but unnecessary dealings should be avoided. Wealth) Not wanting, though expenditure should be reduced. Romance) The situation is complex. Despite opposing temperaments, there is a curious attraction that makes parting difficult. Vitality) Take care of stress-related conditions."}, "☲☲": {"no": 19, "name": "Li — Fire over Fire (離為火)", "text": "Li signifies the bright sun — the radiant illumination that lights all beneath heaven. Celestial Guidance) As the sun and moon hang in the heavens and illuminate all creation, this is a fine season in which you may demonstrate your abilities with great vigour and enthusiasm. Extend your magnanimous spirit and spread bright virtue. At the same time, the mind may become scattered and concentration difficult. Therefore, do not thrust yourself forward excessively. Though the fortune is strong, there are aspects of this period that make skilful navigation of life difficult. Approach all matters with thoroughness and careful planning. To proceed on strength alone invites failure. Avoid rash behaviour and cultivate the humble disposition to receive the counsel of superiors. Enterprise) Inwardly, the real substance may be lacking. Long-term or new ventures require careful deliberation. Negotiations and dealings proceed smoothly in partial respects — yet guard vigilantly against errors in contracts. Documents must be managed with great care. Wealth) Not lacking, though expenditure on extravagance and waste tends to be great. A spirit of economy is needed. Romance) Frank and passionate love unfolds, though two similar temperaments may cool toward each other swiftly. Do not play dangerous games with affection. Many proposals of marriage circulate around you, making it difficult to arrive at a firm decision. Proceed slowly and without haste. Do not put on airs. Vitality) The body is healthy, but unexpected illness may arise suddenly. Take care against high fever and deterioration of eyesight."}, "☲☳": {"no": 20, "name": "Shi He — Fire over Thunder (火雷噬嗑)", "text": "Shi He signifies biting and closing the mouth — resolving obstacles by meeting them head-on with determination. Celestial Guidance) Bright as fire and mighty as thunder, you shall be active and vigorous in all you do. Just as food is chewed and ground between the jaws, you are full of enthusiasm and vitality in every sphere. When you have a purpose, advance with bold and upright resolve, proceeding step by step in proper order. Even if difficulties arise along the way, continuing to strive without yielding to despair may lead to success. The path ahead opens wider with the passage of time. Do not wrangle with petty people. Refrain from excessive interference in the affairs of others and abstain from idle slander. Even if you find yourself in an unjust position, if you face your faults with fear and earnestness and work to correct them, the stain shall not endure long. Enterprise) This is a fine season to launch new ventures — progress and advancement shall follow. Move forward with bold determination. Wealth) Daily life is without discomfort. Diligent effort allows for the expectation of considerable gain. Romance) You are likely to encounter someone of similar temperament. The web of relationships with the opposite sex around you is complex; there are many who may cause you anxiety through domestic issues or rivalry. Relationships lacking in sincerity must be set aside swiftly. Vitality) Be mindful of the effects of excessive drinking."}, "☲☴": {"no": 21, "name": "Ding — Fire over Wind (火風鼎)", "text": "Ding signifies the sacred iron cauldron with three legs — transformation through the sacred vessel. Celestial Guidance) A precious and rare medicine is obtained; the old is discarded and the new is embraced. Just as wood catches fire and burns brightly, all that you plan shall proceed with smooth progression. When you act in cooperation with others, gains beyond expectation may be anticipated. Unity and harmony among people are of the utmost importance. Show respect to superiors and magnanimous generosity to those beneath you. Set your aspirations upon what is fresh and creative rather than what is old and worn. Enterprise) Renewing the content and presentation of your enterprise is important. Secure fine partners in cooperation and proceed together. Three like-minded partners working together and sharing the fruits of their labour equally is also advantageous. In all transactions, first consider the position and interests of the other party — only thus shall fine results be obtained. Wealth) Plentiful. Funds must be circulated and deployed across several avenues. Romance) You shall enter into association with an intellectually refined woman whose temperament matches well. For women, the partner appears to be handsome and fine. Where there is true sincerity, marriage negotiations shall proceed smoothly. You carry the atmosphere forward with natural authority. Vitality) Take care against contagious ailments, disorders of the respiratory system, and intestinal complaints."}, "☲☵": {"no": 22, "name": "Wei Ji — Fire over Water (火水未濟)", "text": "Wei Ji signifies that which is not yet complete — though fulfilment has not yet arrived, it is approaching. Celestial Guidance) Though yin and yang have not yet found their proper places, they respond to each other harmoniously. Steady advancement toward completion is now underway. Even if slight difficulties arise, if you wait, a fine season of fortune shall come. Therefore, what matters most is to wait for the right moment, remain composed, and steadily build your real abilities. This is a good period in which hope for the future becomes visible; depending on the degree of effort, the road ahead is likely to be clear and open. Hold your ambitions great — only so is there good fortune. Even if you find yourself in an unjust position, if you correct your errors with a spirit of reverence, good fortune shall come. Enterprise) Though the start may not be smooth, progress and development accumulate as time passes. Under no circumstances give up halfway through difficulties. Even if the pace of progress is slow, there is no need for concern. First lay solid foundations; persevere steadily and success may be expected. Drive your negotiations with tenacious persistence and you shall achieve your aim. Wealth) Not plentiful, yet sufficient to avoid discomfort in daily life. Romance) You shall encounter someone whose heart is in accord with yours. Those planning marriage face some interference and minor difficulty. Yet effort shall bring the matter to fruition. Vitality) Health is good and vitality is vigorous. Guard against contagious ailments."}, "☲☶": {"no": 23, "name": "Lü — Fire over Mountain (火山旅)", "text": "Lü signifies the traveller — the journey of the wanderer upon the road. Celestial Guidance) The journey of the wanderer is attended by anxiety and solitude. Even so, do not rush — proceed steadily and with composure toward your destination. Before acting aggressively, cultivate your abilities and act in a manner befitting the time and place. Fix your goals clearly and build your foundations soundly, and the anxiety shall dissolve of its own accord. Hold your mind upright and true, and blessings shall follow naturally. When difficulty arises, seek the assistance of a trustworthy superior or worthy companion. Holding to the middle way, small matters shall proceed as you wish. Enterprise) Launching new ventures or expanding existing ones is not advantageous at this time. However, ventures in external sales, cultural enterprise and the like are favourable. First consider the position and interests of the other party and dealings shall proceed smoothly. Wealth) Small sums come in while large sums flow out easily. Reduce extravagance and waste. Romance) A relationship with a considerable age difference. A meeting through shared learning or joint endeavour shall develop into a harmonious connection. Consider living circumstances and occupation carefully. Vitality) If a long-standing ailment exists, seek prompt treatment. Guard against epidemic illness and physical decline."}, "☲☷": {"no": 24, "name": "Jin — Fire over Earth (火地晉)", "text": "Jin signifies advancement — to press forward and ascend. Celestial Guidance) A wise sovereign meets a virtuous minister — the image of noble alignment. Just as the sun rises above the great earth and illuminates the world in brilliance, new and vigorous activity shall unfold. Strong foundations are what enable success. Bold as a valiant commander taking to the field, your spirit is powerful and resolute — yet even if the jealousy of those around you arises, or difficulties appear in your work, meeting them with composure shall present no problem. Enterprise) New plans take shape and expansion of your endeavours commences. Hold your ambitions great. Though competition is fierce, diligent effort yields fine results. In dealings, lay your plans and pursue them actively — indecision must be avoided at all cost. In your work you shall receive promotion. Both superiors who guide you and subordinates who support you are present, allowing progress in your enterprise to be expected. Wealth) At first not plentiful, but gradually greater income shall flow in. Profit through investment or shares is possible. Romance) A bright and joyful love unfolds. A fine bond of destiny is approaching. Vitality) Guard carefully against contagious ailments."}, "☳☰": {"no": 25, "name": "Da Zhuang — Thunder over Heaven (雷天大壯)", "text": "Da Zhuang signifies great and vigorous flourishing — extraordinary strength and power. Celestial Guidance) Thunder crashing above the heavens shakes the world for a thousand leagues yet does not descend. Likewise, even when your fortune is at its most vigorous, composure and restraint must be maintained. Though strong and vigorous aspiration drives you to expand, rash behaviour must be guarded against. Occasional moments of mental ease and repose are necessary. Thunder resounds for a thousand leagues but is only sound without form — if you launch ventures without substance, failure shall follow. Avoid all that is contrary to propriety and seek fine partners in cooperation. What you share generously with those around you shall return to you as blessing in the future. Enterprise) The time has come to launch new ventures or expand existing ones. Since fortune is strong, careful planning and caution are all that is needed for smooth progress. In dealings and negotiations, both parties tend to take strong and assertive positions — yet meeting the other with gentleness produces fine results. Those who drive vehicles must refrain from speeding and driving after drinking. Wealth) Comfortable and plentiful. Savings put aside now shall bring ease in the future. Romance) A romantic and excitable love unfolds. Composure and earnestness are needed. Fix your heart clearly and observe your partner with care and attention. Vitality) Generally healthy, though if gastrointestinal ailments are present, take care that they do not worsen."}, "☳☱": {"no": 26, "name": "Gui Mei — Thunder over Lake (雷澤歸妹)", "text": "Gui Mei signifies the younger sister's marriage — waiting with watchful patience for the right season to arrive. Celestial Guidance) Yin and yang strive to harmonise with each other. Holding to the righteous path shall permit the passage of peaceable and tranquil days. Yet if one is swept away by emotion and loses the power of rational judgement, loss shall follow. Do not rush into new ventures; prepare thoroughly at a measured pace and await the fitting moment. For a new endeavour to succeed, its beginning must be auspicious. Enterprise) Forcing a new enterprise brings unfavourable results — direct your energies instead to maintaining what you have. If you do wish to launch a new enterprise, observe and reflect thoroughly before proceeding to action. Even if negotiations with the other party do not proceed smoothly, rash behaviour must be avoided. Disregarding proper procedure shall bring difficulty from time to time. Wealth) Small sums come in while large sums flow out easily. Careful management of expenditure is essential. Romance) Complex and frivolous associations are best avoided. Exercise caution in matters concerning the opposite sex. For women in particular, great care is needed. Vitality) Guard against nervous sensitivity and irritability."}, "☳☲": {"no": 27, "name": "Feng — Thunder over Fire (雷火豊)", "text":
