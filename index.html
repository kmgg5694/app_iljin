obre las apariencias. Romance) Muchos pretendientes te rodean; es difícil elegir uno. Protégete de enredos indignos y actúa con sinceridad. Salud) Generalmente saludable. Cuida el sistema respiratorio."}, "☰☲": {"no": 3, "name": "Tong Ren — Cielo sobre Fuego (天火同人)", "text": "Tong Ren significa unirse a los demás — actuar con propósito común. Guía Celestial) Así como el sol ilumina el mundo con luz imparcial, actuar con equidad e integridad realizará tus aspiraciones. Esta es una época favorable para asociaciones y empresas conjuntas. Puedes liderar a muchos; los que te rodean responderán con apoyo. Sin embargo, puede surgir feroz competencia. La comunicación abierta y la cooperación sincera conducen al gran éxito. Empresa) La gestión interna cuidadosa produce progreso fluido. Las alianzas conjuntas son especialmente propicias. Finanzas) Predomina la sensación de abundancia. Las ganancias superarán el esfuerzo. Cuida disputas por asuntos financieros. Romance) Hay numerosos competidores. Mantener una intimidad espiritual profunda con tu elegido traerá buenos resultados. Salud) Protégete de enfermedades contagiosas."}, "☰☳": {"no": 4, "name": "Wu Wang — Cielo sobre Trueno (天雷无妄)", "text": "Wu Wang significa el estado natural sin deseos — espontaneidad pura. Guía Celestial) El trueno suena desde el cielo: actuar conforme a los principios del Cielo trae buena fortuna. Lanzar empresas sin preparación produce rumores sin sustancia. No persigas lo que no debes perseguir. Cultiva la plenitud interior y busca la quietud; llegará la buena fortuna inesperada. Empresa) No te apresures a expandirte; consolida primero tu posición. Actúa en conformidad con el orden natural. En negociaciones, responde según la actitud de la otra parte. Finanzas) Es momento de asegurar sustancia real. Las necesidades diarias no faltan. Romance) Encontrarás a alguien de temperamento similar. El matrimonio procede naturalmente. Salud) Buena salud; incluso si surge enfermedad, la recuperación natural sigue."}, "☰☴": {"no": 5, "name": "Gou — Cielo sobre Viento (天風姤)", "text": "Gou significa encuentro — el encuentro de fuerzas. Guía Celestial) El sol y la luna pasan por la oscuridad y regresan a la luz. Establece tus objetivos claramente; sin resolución firme, perderás momentos favorables. En general es un período donde se puede acumular riqueza, aunque también es posible sufrir pérdidas por engaño. Actúa con juicio frío y claro. Empresa) No disperses energías en nuevas empresas; permanece dedicado a lo que ya haces. Avanzando paso a paso, aparecerá una oportunidad inesperada. Cuídate del fraude y la pérdida de objetos valiosos. Finanzas) Entran sumas pequeñas mientras las grandes fluyen fácilmente. Vive dentro de tus posibilidades. Romance) Las relaciones tienden hacia la complacencia y la diversión. Discerne las verdaderas intenciones ocultas tras una fachada amistosa. Salud) Protégete de la fatiga."}, "☰☵": {"no": 6, "name": "Song — Cielo sobre Agua (天水訟)", "text": "Song significa súplica — presentar el caso ante una autoridad superior. Guía Celestial) Debes respetar y ceder a las intenciones de los demás. Incluso cuando creas tener razón, ejerce moderación. Una disposición humilde y condescendiente hará que las bendiciones lleguen por sí solas. Protege tus palabras y acciones, evita disputas innecesarias. Empresa) No persigas empresas que excedan tu posición. La asociación es desfavorable. Maneja los documentos con meticuloso cuidado. En negociaciones, lleva los asuntos a una conclusión clara y definitiva. Finanzas) No se carece, aunque el gasto debe reducirse. Romance) Tus circunstancias y perspectivas difieren frecuentemente de las de tu pareja. Mantén una actitud alegre y brillante. Salud) Cuida la digestión."}, "☰☶": {"no": 7, "name": "Dun — Cielo sobre Montaña (天山遯)", "text": "Dun significa retiro — retroceder y refugiarse de la dificultad. Guía Celestial) Fortuna e infortuna se oponen: aunque hay dificultad temprana, la tranquilidad llega con el tiempo. En lugar de forzar las cosas, es más ventajoso preservar el estado actual. En todo lo que planees, examina tanto el inicio como el final. Empresa) Para asegurar ganancias reales, atiende primero asuntos pequeños fielmente antes de embarcarte en grandes proyectos. En negociaciones, no avances por tu propia iniciativa. Ejerce cautela en inversiones. Finanzas) El gasto supera el ingreso; la gestión cuidadosa es esencial. Ni pidas ni prestes dinero. Romance) Incluso las obligaciones sociales simples conllevan gastos. Primero establece tu propio terreno con firmeza. Salud) Se necesita atención regular al acondicionamiento físico. Cuídate de las dolencias crónicas."}, "☰☷": {"no": 8, "name": "Pi — Cielo sobre Tierra (天地否)", "text": "Pi significa obstrucción — la ausencia de fundamento que hace que los asuntos se estanquen. Guía Celestial) Aunque haya dificultad temprana, los asuntos se abrirán gradualmente. Soportar la dificultad conduce a una cosecha inesperadamente grande. Renuncia a la extravagancia y construye sustancia interior a través de la virtud frugal. Empresa) En lugar de avanzar agresivamente, el progreso tranquilo y firme es mejor. Dirige mayor atención a la gestión interna. La parte opuesta ocupa una posición más fuerte, colocándote en una postura pasiva. Finanzas) Generalmente insuficiente. Guarda documentos y finanzas con cuidado. Romance) Examina cuidadosamente la sinceridad de la otra parte antes de actuar. Quienes planean matrimonio enfrentarán alguna dificultad. Salud) La constitución física es importante. Cuídate de la falta de apetito."}, "☱☰": {"no": 9, "name": "Guai — Lago sobre Cielo (澤天夬)", "text": "Guai significa resolución y acción decisiva. Guía Celestial) Tu fortuna asciende gloriosamente como el sol de la mañana. Quienes trabajan avanzarán en rango; los estudiantes mejorarán su posición. Sin embargo, si se abandona la humildad, puede resultar el fracaso. El exceso es peor que la deficiencia — mantén el equilibrio. Muestra respeto a los superiores y generosidad magnánima a quienes están debajo. Empresa) Establece un plan claro y espera el momento adecuado. El avance ciego trae pérdidas. En los tratos con los demás, no seas apresurado — responde pasivamente. Finanzas) Vendrá abundancia de riqueza; debe evitarse la codicia excesiva. Romance) La situación es compleja. Si surge conflicto con tu pareja, es mejor resolverlo rápidamente. Salud) Atiende prontamente cualquier enfermedad. Cuida especialmente los padecimientos del sistema respiratorio."}, "☱☱": {"no": 10, "name": "Dui — Lago sobre Lago (兌為澤)", "text": "Dui significa alegría y deleite. Guía Celestial) Como la vegetación que revive bajo una suave lluvia de primavera, surgirán muchas cosas esperanzadoras en la vida diaria. Sin embargo, este hexagrama contiene, junto con la alegría, un significado de incompletitud interior. Lleva todos los asuntos importantes a conclusiones claras y definitivas, y no te involucres en disputas con otros. Empresa) La devoción a tu trabajo actual dará buenos frutos. Construye sustancia y solidez. Las empresas de ventas o publicidad son prometedoras. Finanzas) Suficiente para vivir cómodamente, aunque la apariencia exterior de riqueza puede superar la realidad interior. Las condiciones mejorarán gradualmente. Romance) Hay tendencia hacia relaciones superficiales centradas en la apariencia exterior. No te apegues excesivamente a asuntos del corazón. Salud) Cuida las dolencias de la boca."}, "☱☲": {"no": 11, "name": "Ge — Lago sobre Fuego (澤火革)", "text": "Ge significa reforma — renovar y transformar lo antiguo. Guía Celestial) Ha llegado el momento de dejar atrás lo viejo y abrazar lo nuevo. Las personas a tu alrededor cambian, y se abren nuevos territorios en tu trabajo. Quienes están en posiciones de liderazgo y juzgan que ha llegado la hora de la reforma deben actuar decisivamente. En general, esta es una buena época para abrazar el cambio, pero debe encontrarse el camino correcto para evitar errores. Empresa) Una nueva empresa toma forma. También es posible la renovación del hogar o la reubicación. Finanzas) Las fortunas de la riqueza son vigorosas. Romance) Quienes perdieron el momento apropiado para el matrimonio encontrarán un compañero digno. Conduce tu relación con integridad. Salud) Si existe una dolencia antigua, busca tratamiento pronto. Protégete de la fatiga."}, "☱☳": {"no": 12, "name": "Sui — Lago sobre Trueno (澤雷隨)", "text": "Sui significa seguir — adaptarse y moverse en conformidad con el flujo. Guía Celestial) Aunque el trueno ruge ferozmente en verano, es un período en que uno debe adaptarse al entorno y actuar en consecuencia. Seguir el consejo de los demás es el curso más sabio. Cultivar tus habilidades con una postura vigilante y paciente hará que lleguen oportunidades. Empresa) Alinear tus acciones con las tendencias prevalentes produce buenos resultados. No descuides la observación del entorno circundante. Finanzas) El flujo de fondos es fluido y el ingreso aumenta; el gasto también aumenta. Romance) Tu pareja tiende a ser considerablemente mayor o menor. Las mujeres pueden ocasionalmente encontrarse con un hombre más joven. Protégete cuidadosamente contra el enredo en una relación triangular. Salud) Incluso las dolencias menores no deben pasarse por alto."}, "☱☴": {"no": 13, "name": "Da Guo — Lago sobre Viento (澤風大過)", "text": "Da Guo significa exceso — ir demasiado lejos más allá de lo que es apropiado. Guía Celestial) El exceso es peor que la insuficiencia. Permanece en el curso correcto y aférrate al camino medio. Es posible que te encuentres cargado con mucha responsabilidad. Aun así, no intentes resolver todas las obligaciones simultáneamente. Deja de lado los asuntos menores y preserva el equilibrio interior. Empresa) No te embarques en empresas que excedan tu capacidad. Primero establece bases sólidas y atiende la gestión interna fielmente. Finanzas) El ingreso y el gasto deben mantenerse en equilibrio. Romance) La relación tiende hacia la complejidad y la sutileza. Hay una probabilidad considerable de involucrarse con alguien de edad muy diferente. Salud) Evita el exceso de esfuerzo. Protégete de los problemas digestivos."}, "☱☵": {"no": 14, "name": "Kun — Lago sobre Agua (澤水困)", "text": "Kun significa atrapamiento — quedar bloqueado y obstruido por circunstancias externas. Guía Celestial) Observa tu medida apropiada y espera tu estación. Esfuérzate con convicción justa y acción resuelta. Vivir con un propósito claro transformará la mala fortuna en buena. Si surge dificultad, el curso más sabio es retirarse con una mente tranquila y esperar pacientemente. Empresa) Cuídate de las palabras melosas de los demás. Persevera fielmente en tu trabajo actual. En los tratos, no te apresures; cede hasta cierto punto. Finanzas) El gasto supera el ingreso en este momento. Reduce la extravagancia y el despilfarro. Romance) Es sabio terminar rápidamente las relaciones impuras. La sinceridad de la otra parte debe juzgarse con precisión. Salud) Atiende el acondicionamiento físico. Evita el exceso de esfuerzo."}, "☱☶": {"no": 15, "name": "Xian — Lago sobre Montaña (澤山咸)", "text": "Xian significa resonancia mutua — la respuesta sentida del cielo y la tierra al esfuerzo sincero. Guía Celestial) Como la lluvia vivificante que cae sobre una tierra árida, el esfuerzo sincero y dedicado moverá incluso a los cielos. Recibe lo que es correcto y actúa con integridad; seguirán resultados inesperadamente buenos. Cultiva la profunda comunión espiritual con quienes te rodean. Empresa) Muchas personas útiles te rodean en este momento. Es probable que encuentres a alguien con ideas excelentes e innovadoras. Las negociaciones y transacciones procederán mejor y más rápido de lo anticipado. Finanzas) Amplio para vivir cómodamente. Romance) Conocerás una pareja ideal y experimentarás una conexión apasionada. Salud) La salud física es buena. Cuídate de los resfriados."}, "☱☷": {"no": 16, "name": "Cui — Lago sobre Tierra (澤地萃)", "text": "Cui significa reunión y florecimiento — la asamblea que conduce a la abundancia. Guía Celestial) Como un dragón que se encuentra con el mar abierto y asciende con poder, tu empresa prosperará. Muchos se reunirán a tu alrededor en apoyo. Sin embargo, la competencia se intensifica y las disputas surgen fácilmente; trabajar junto con muchas personas en unidad permite lograr grandes empresas. En todo lo que persigas, busca el consejo de una persona de gran sabiduría. Empresa) La fortuna es vigorosa; lograrás tus objetivos con facilidad. Finanzas) Prevalece la abundancia material. Romance) Se desarrolla un romance ideal. Sin embargo, dispersar tu atención entre múltiples partes significa no lograr nada bien. Salud) Protégete de padecimientos del sistema respiratorio."}, "☲☰": {"no": 17, "name": "Da You — Fuego sobre Cielo (火天大有)", "text": "Da You significa gran posesión — gran abundancia en todas las cosas. Guía Celestial) Tu fortuna brilla tan brillantemente como el sol ardiendo en el cenit del cielo — como una abundante cosecha en la temporada de otoño. La riqueza es plentiful y el espíritu encuentra estabilidad; todo bajo el cielo está en paz. Sin embargo, así como el sol no permanece siempre en el cenit, también esfuérzate por preservar lo que has ganado. Empresa) Las fortunas de la empresa son excepcionalmente vigorosas; se realizarán grandes ganancias. Trabajar colectivamente como grupo es más ventajoso que actuar solo. Finanzas) Abundancia material y libre flujo de fondos caracterizan esta temporada. Romance) Las mujeres ocupan una posición de influencia considerable. Salud) Cuida el apetito y la digestión."}, "☲☱": {"no": 18, "name": "Kui — Fuego sobre Lago (火澤睽)", "text": "Kui significa oposición y divergencia — esforzarse en medio del alejamiento. Guía Celestial) Esta es una época favorable para perseguir asuntos modestos. Dejando de lado la ambición excesiva se permite un progreso pacífico e ininterrumpido. Dedícate a la armonía con quienes te rodean y guarda tus palabras y hechos con cuidado. Las tensiones o problemas dentro del hogar o el lugar de trabajo deben anticiparse y resolverse temprano. Empresa) Antes de perseguir agresivamente nuevas empresas, atiende primero a la gestión interna fiel de tu trabajo actual. Los asuntos pequeños procederán fluidamente. Finanzas) No falta, aunque el gasto debería reducirse. Romance) La situación es compleja. A pesar de los temperamentos opuestos, existe una curiosa atracción que hace difícil separarse. Salud) Cuídate de condiciones relacionadas con el estrés."}, "☲☲": {"no": 19, "name": "Li — Fuego sobre Fuego (離為火)", "text": "Li significa el sol brillante — la iluminación radiante que alumbra todo bajo el cielo. Guía Celestial) Esta es una época en que puedes demostrar tus habilidades con gran vigor y entusiasmo. Extiende tu espíritu magnánimo y difunde virtud brillante. Al mismo tiempo, la mente puede dispersarse y la concentración volverse difícil. Por lo tanto, no te proyectes excesivamente. Empresa) Interiormente puede faltar sustancia real. Las empresas a largo plazo o nuevas requieren deliberación cuidadosa. Las negociaciones proceden fluidamente en aspectos parciales — sin embargo, protégete vigilantemente contra errores en contratos. Finanzas) No falta, aunque el gasto en extravagancia tiende a ser grande. Romance) Se desarrolla un amor franco y apasionado, aunque dos temperamentos similares pueden enfriarse rápidamente entre sí. Salud) El cuerpo está sano pero puede surgir enfermedad inesperada de repente."}, "☲☳": {"no": 20, "name": "Shi He — Fuego sobre Trueno (火雷噬嗑)", "text": "Shi He significa morder y cerrar la boca — resolver obstáculos enfrentándolos de frente con determinación. Guía Celestial) Brillante como el fuego y poderoso como el trueno, estarás activo y vigoroso en todo lo que hagas. Cuando tengas un propósito, avanza con determinación audaz e íntegra, procediendo paso a paso en el orden apropiado. Incluso si surgen dificultades en el camino, continuar esforzándote sin ceder a la desesperación puede conducir al éxito. Empresa) Esta es una buena época para lanzar nuevas empresas — seguirán progreso y avance. Muévete hacia adelante con determinación audaz. Finanzas) La vida diaria no tiene incomodidades. Romance) Es probable que encuentres a alguien de temperamento similar. Las relaciones que carecen de sinceridad deben dejarse de lado rápidamente. Salud) Cuídate de los efectos del exceso de alcohol."}, "☲☴": {"no": 21, "name": "Ding — Fuego sobre Viento (火風鼎)", "text": "Ding significa el sagrado caldero de hierro con tres patas — transformación a través del recipiente sagrado. Guía Celestial) Se obtiene una medicina preciosa y rara; lo viejo se descarta y lo nuevo se abraza. Así como la madera enciende el fuego y arde brillantemente, todo lo que planeas procederá con progresión fluida. Cuando actúes en cooperación con los demás, pueden anticiparse ganancias más allá de las expectativas. La unidad y la armonía entre las personas son de suma importancia. Empresa) Renovar el contenido y la presentación de tu empresa es importante. Asegura buenos socios en cooperación y procede juntos. Finanzas) Plentiful. Los fondos deben circular y desplegarse en varias avenidas. Romance) Entrarás en asociación con una mujer intelectualmente refinada cuyo temperamento encaja bien. Salud) Cuídate contra las enfermedades contagiosas, los trastornos del sistema respiratorio y las quejas intestinales."}, "☲☵": {"no": 22, "name": "Wei Ji — Fuego sobre Agua (火水未濟)", "text": "Wei Ji significa lo que aún no está completo — aunque el cumplimiento no ha llegado todavía, se está acercando. Guía Celestial) Aunque el yin y el yang aún no han encontrado sus lugares apropiados, responden armoniosamente entre sí. El avance constante hacia la realización está ahora en marcha. Incluso si surgen ligeras dificultades, si esperas, llegará una buena temporada de fortuna. Por lo tanto, lo que más importa es esperar el momento correcto, permanecer tranquilo y construir constantemente tus capacidades reales. Empresa) Aunque el inicio puede no ser fluido, el progreso y el desarrollo se acumulan a medida que pasa el tiempo. Bajo ninguna circunstancia te rindas a mitad de camino. Finanzas) No plentiful, sin embargo suficiente para evitar incomodidades en la vida diaria. Romance) Encontrarás a alguien cuyo corazón está en concordia con el tuyo. Salud) La salud es buena y la vitalidad es vigorosa."}, "☲☶": {"no": 23, "name": "Lü — Fuego sobre Montaña (火山旅)", "text": "Lü significa el viajero — el viaje del errante por el camino. Guía Celestial) El viaje del errante está acompañado de ansiedad y soledad. Aun así, no te apresures — avanza constantemente y con compostura hacia tu destino. Antes de actuar agresivamente, cultiva tus habilidades y actúa de manera apropiada al tiempo y lugar. Fija tus objetivos claramente y construye tus bases solidamente, y la ansiedad se disolverá por sí sola. Empresa) Lanzar nuevas empresas o expandir las existentes no es ventajoso en este momento. Sin embargo, las empresas en ventas externas y empresa cultural son favorables. Primero considera la posición e intereses de la otra parte y los tratos procederán fluidamente. Finanzas) Entran sumas pequeñas mientras las grandes fluyen fácilmente. Romance) Una relación con una diferencia de edad considerable. Salud) Si existe una dolencia antigua, busca tratamiento pronto. Protégete de enfermedades epidémicas."}, "☲☷": {"no": 24, "name": "Jin — Fuego sobre Tierra (火地晉)", "text": "Jin significa avance — presionar hacia adelante y ascender. Guía Celestial) Un soberano sabio se encuentra con un ministro virtuoso — la imagen del noble alineamiento. Así como el sol se eleva sobre la gran tierra e ilumina el mundo en brillantez, se desplegará nueva y vigorosa actividad. Las bases sólidas son las que permiten el éxito. Empresa) Se forman nuevos planes y comienza la expansión de tus empresas. Alberga grandes ambiciones. Aunque la competencia es feroz, el esfuerzo diligente produce buenos resultados. En los tratos, establece tus planes y persígalos activamente. Finanzas) Al principio no plentiful, pero gradualmente fluirá mayor ingreso. Es posible la ganancia a través de inversiones o acciones. Romance) Se desarrolla un amor brillante y alegre. Una buena conexión del destino se acerca. Salud) Protégete cuidadosamente contra las enfermedades contagiosas."}, "☳☰": {"no": 25, "name": "Da Zhuang — Trueno sobre Cielo (雷天大壯)", "text": "Da Zhuang significa gran y vigoroso florecimiento — fuerza y poder extraordinarios. Guía Celestial) El trueno que estalla sobre los cielos sacude el mundo por mil leguas pero no desciende. Del mismo modo, incluso cuando tu fortuna está en su punto más vigoroso, la compostura y la moderación deben mantenerse. Aunque la aspiración fuerte y vigorosa te impulsa a expandirte, el comportamiento imprudente debe evitarse. Empresa) Ha llegado el momento de lanzar nuevas empresas o expandir las existentes. Puesto que la fortuna es fuerte, la planificación cuidadosa y la cautela son todo lo que se necesita para un progreso fluido. Finanzas) Cómodo y plentiful. El ahorro ahora traerá facilidad en el futuro. Romance) Se desarrolla un amor romántico y excitable. Se necesita compostura y seriedad. Salud) Generalmente saludable, aunque si existen padecimientos gastrointestinales, cuida de que no empeoren."}, "☳☱": {"no": 26, "name": "Gui Mei — Trueno sobre Lago (雷澤歸妹)", "text": "Gui Mei significa esperar con vigilante paciencia a que llegue la temporada adecuada. Guía Celestial) El yin y el yang se esfuerzan por armonizarse entre sí. Mantenerse en el camino recto permitirá días pacíficos y tranquilos. Sin embargo, si uno se deja llevar por la emoción y pierde el poder del juicio racional, seguirá la pérdida. No te apresures en nuevas empresas; prepárate minuciosamente a un ritmo medido y espera el momento conveniente. Empresa) Forzar una nueva empresa trae resultados desfavorables — dirige tus energías en cambio a mantener lo que tienes. Finanzas) Entran sumas pequeñas mientras las grandes fluyen fácilmente. La gestión cuidadosa del gasto es esencial. Romance) Las asociaciones complejas y frívolas es mejor evitarlas. Ejerce cautela en asuntos referentes al sexo opuesto. Salud) Protégete de la sensibilidad nerviosa y la irritabilidad."}, "☳☲": {"no": 27, "name": "Feng — Trueno sobre Fuego (雷火豊)", "text": "Feng significa abundancia y rica plenitud. Guía Celestial) El camino es alejarse de la oscuridad y avanzar hacia la luz. Cuando el sol está en el cenit, el mundo es brillante y radiante. Del mismo modo, tu fortuna es fuerte y vigorosa — puede esperarse una rica cosecha de resultados. Sin embargo, así como la luna llena comienza a menguar, incluso el vigor exterior oculta el debilitamiento gradual de las fuerzas interiores. Empresa) El progreso es fluido. Sin embargo, en lugar de lanzar nuevas empresas, es más importante gestionar solidamente la empresa que ya ha florecido. La fidelidad a la gestión interna es esencial. Finanzas) Las fortunas de la riqueza son vigorosas. Romance) Hay tendencia hacia relaciones materiales, superficiales y placenteras. No te deslumbres por el esplendor exterior. Salud) Como este es un período de cambios frecuentes, se necesita atención regular a la nutrición."}, "☳☳": {"no": 28, "name": "Zhen — Trueno sobre Trueno (震為雷)", "text": "Zhen significa trueno — el gran estruendo que sacude los cuatro cuartos. Guía Celestial) Así como el trueno resuena y sacude todo en todas las direcciones, si estableces tus objetivos firmemente y te esfuerzas, tu propósito se alcanzará fluidamente. Sin embargo, así como el trueno hace mucho ruido pero carece de sustancia real, primero fija tus objetivos y haz tus planes con certeza y claridad. Cultívate y reflexiona hacia adentro. Empresa) Hay una tendencia a perseguir dos empresas simultáneamente. Sin embargo, si los planes son demasiado grandiosos y las energías se dispersan, los beneficios reales se vuelven difíciles de obtener. Finanzas) Hay fortuna en la riqueza, aunque no llega de una vez. Se irá desplegando gradualmente. Romance) Tiende a desarrollarse una relación viva y excitable. Salud) Cuídate de las dolencias relacionadas con el hígado."}, "☳☴": {"no": 29, "name": "Heng — Trueno sobre Viento (雷風恒)", "text": "Heng significa constancia — firmeza inquebrantable a través de todas las estaciones. Guía Celestial) Así como el sol y la luna iluminan perpetuamente el mundo con su luz, mantener el ritmo de la vida ordinaria produce estabilidad y alegría. Llegarán días de tranquila facilidad. Una persona de sabiduría no abandona fácilmente su lugar apropiado, sino que sigue la virtud de la constancia perdurable. Mantén la paciencia y persevera constantemente. Empresa) La expansión excesiva o los nuevos planes no son favorables. Gestiona fielmente y constantemente la empresa que has construido hasta ahora. Finanzas) Las fortunas de la riqueza son buenas; los fondos son plentiful y no enfrentas restricciones apremiantes. Romance) Se desarrolla una relación estable y armoniosa. Puede desarrollarse un vínculo largo y duradero. Salud) Una vida regulada y disciplinada es lo que mantiene alejada la enfermedad. Cuídate de las dolencias de la espalda."}, "☳☵": {"no": 30, "name": "Jie — Trueno sobre Agua (雷水解)", "text": "Jie significa liberación y resolución — la disolución de lo que ha sido congelado y atado. Guía Celestial) Como el hielo que estuvo firmemente atrapado durante el invierno se derrite al llegar la cálida primavera, encontrarás buenos aliados y te involucrarás en actividad fresca y vigorosa. Los asuntos que han estado bloqueados o difíciles hasta ahora comenzarán a resolverse. En esta temporada, la actividad es el medio de escapar de la dificultad — establece tus objetivos claramente. Empresa) La actividad es intensa y ocupada. Acercarse a aliados capaces y hábiles producirá buenos resultados. Finanzas) Las cosas pequeñas acumuladas llevan a la gran abundancia. Salud) Este es un período saludable; las dolencias menores se recuperan rápidamente. Cuídate de los trastornos gastrointestinales."}, "☳☶": {"no": 31, "name": "Xiao Guo — Trueno sobre Montaña (雷山小過)", "text": "Xiao Guo significa ligero exceso — ir apenas un poco demasiado lejos más allá de la medida apropiada. Guía Celestial) El exceso es peor que la deficiencia. Actuar con humildad y sin codiciar lo que no te corresponde apropiadamente permite paz y facilidad. Quienes no observan sus fronteras apropiadas deben controlarse. Empresa) Los asuntos pequeños proceden fluidamente como se desea, pero se necesita unidad de espíritu entre las personas. La arrogancia debe evitarse absolutamente. Finanzas) El ingreso tiende a ser menos de lo esperado mientras el gasto es mayor. Reduce la extravagancia y el despilfarro. Romance) Donde hay sinceridad mutua y ausencia de sospecha, el camino será fluido. Salud) Atiende a la nutrición y el mantenimiento físico."}, "☳☷": {"no": 32, "name": "Yu — Trueno sobre Tierra (雷地豫)", "text": "Yu significa anticipación y preparación — alegre disposición para lo que está por venir. Guía Celestial) El trueno emerge desde dentro de la tierra y sacude el mundo — haciendo que toda la vegetación se agite y mueva. Del mismo modo, habiendo encontrado una buena temporada, tus habilidades reales recibirán el debido reconocimiento. Tu posición ascenderá y aparecerá nueva esperanza ante ti. Prepárate minuciosamente para lo que deseas perseguir y establece planes claros. Empresa) Proceder en orden sin prisa traerá desarrollo. Atiende fielmente a la gestión interna. Esta es también una buena época para embarcarse en nuevo trabajo. Finanzas) Llegan grandes sumas, pero el gasto también aumenta. Romance) Mantienes confianza social y muchas mujeres se atraen a tu alrededor. Si permaneces vigilante y guardas un corazón sincero, encontrarás tu compañero del destino ideal. Salud) Como el cuerpo está sano, incluso las dolencias menores se recuperan rápidamente."}, "☴☰": {"no": 33, "name": "Xiao Xu — Viento sobre Cielo (風天小畜)", "text": "Xiao Xu significa pequeña acumulación — reunir y construir gradualmente. Guía Celestial) El viento sopla sobre los cielos como si fuera a llover, pero la lluvia no cae fácilmente. Todas las cosas tienen su temporada de pleno florecimiento — como la tierra que espera ser profundamente humedecida, esa temporada llegará. Considera minuciosamente tus circunstancias interiores; la prisa no te beneficia. Espera el momento adecuado y persevera constantemente. Empresa) Las fortunas de la riqueza están presentes y aparecerá ninguna pequeña medida de ganancia. Sin embargo, este no es el momento de expandirse hacia nuevas empresas. Las negociaciones y los tratos tienden a retrasarse. Finanzas) Las sumas pequeñas fluyen fácilmente. Romance) Mantén una actitud alegre y brillante. Salud) Tienden a surgir dolencias nerviosas. Incluso la enfermedad menor debe recibir tratamiento pronto."}, "☴☱": {"no": 34, "name": "Zhong Fu — Viento sobre Lago (風澤中孚)", "text": "Zhong Fu significa sinceridad interior — verdad y fe mantenidas en el mismo centro del corazón. Guía Celestial) Como un pájaro madre que incuba sus huevos hasta que los jóvenes eclosionan, el esfuerzo sincero y dedicado hará que todas las cosas procedan fluidamente. Las empresas que involucran a muchas personas o la empresa conjunta son particularmente favorables. Los estudiantes y quienes trabajan con documentos recibirán admiración de muchos. Empresa) Esta es una temporada en que aprovechas el momento y logras lo que te propusiste hacer. Procede con sinceridad y compromiso genuino en todos los tratos. Finanzas) El ingreso es considerable, aunque el gasto también es grande en este momento. Romance) Entrarás en comunión apasionada con alguien cuyo corazón está en concordia con el tuyo. Salud) Cuídate de los trastornos circulatorios."}, "☴☲": {"no": 35, "name": "Jia Ren — Viento sobre Fuego (風火家人)", "text": "Jia Ren significa la familia — quienes habitan juntos en el hogar. Guía Celestial) No descuides incluso las cosas pequeñas — devótate fielmente a los asuntos del hogar y mantén el camino de la familia erecto y apropiado. Presta especial atención a los asuntos que involucran a familiares y el hogar. Preservar tu camino presente y encontrar contentamiento dentro de tu posición es en sí mismo una forma de alegría. Empresa) Es mejor permanecer devotado a tu trabajo presente. Embarcase en otras empresas requiere planificación minuciosa. Las gestiones cotidianas proceden fluidamente. Finanzas) Los recursos materiales son plentiful. Invertir para el futuro ahora sería beneficioso. Romance) Se desarrolla una relación armoniosa con buen acuerdo de corazón a corazón. Sin embargo, cuídate de rivales inesperados. Salud) Atiende al mantenimiento de la fuerza física. Protégete de la fatiga."}, "☴☳": {"no": 36, "name": "Yi — Viento sobre Trueno (風雷益)", "text": "Yi significa aumento y beneficio — ventaja fluyendo y creciendo en todas las direcciones. Guía Celestial) Como un arroyo que fluye sin cesar para llegar finalmente al mar, quienes están empleados recibirán promoción y quienes labran la tierra darán la bienvenida a un año de cosecha abundante. Una vez establecido tu objetivo y llegada una buena oportunidad, muévete a la acción sin titubear. La asistencia de un buen aliado en particular traerá resultados que superan tus propias habilidades. Empresa) La actividad vigorosa trae grandes ganancias. Sin embargo, la gestión interna fiel es esencial para evitar el fracaso. Finanzas) Las fortunas de la riqueza son vigorosas. También es posible la ganancia inesperada. Romance) Conocerás a alguien cuyas aspiraciones están en concordia con las tuyas. Salud) Cuídate de las condiciones relacionadas con el hígado."}, "☴☴": {"no": 37, "name": "Xun — Viento sobre Viento (巽為風)", "text": "Xun significa el viento soplando suavemente — suave, cediente y persistente. Guía Celestial) Como los árboles y las plantas que se balancean con el suave viento, el viento es cediente por naturaleza — cuando encuentra un obstáculo se mueve alrededor de él y no se detiene fácilmente. Del mismo modo, da primera prioridad a la armonía con quienes te rodean y condúcete con humildad. Acercarse a superiores o colegas confiables es favorable. Empresa) Si esta es una empresa cuyas bases se han estado construyendo constantemente hasta ahora, puede esperarse un gran desarrollo. Las nuevas empresas o la expansión de las existentes deben impulsarse hacia adelante con la asistencia de un buen aliado o superior. Finanzas) Concentrar completamente tus energías en tu objetivo permite un gran ingreso. Hay beneficio en el trabajo honesto y familiar. Romance) Hay una tendencia hacia el romance sentimental y excitable. Salud) Cuídate contra los resfriados."}, "☴☵": {"no": 38, "name": "Huan — Viento sobre Agua (風水渙)", "text": "Huan significa dispersión — las cosas se disuelven y se abren libremente. Guía Celestial) El viento llena las velas y empuja el barco hacia adelante. Este es un punto de inflexión — emerger del estancamiento y avanzar hacia nuevas empresas frescas. Tu empresa comienza a cobrar nueva vitalidad y la carga de la ansiedad interior se eleva. En lugar de asuntos pequeños, planifica hacia lo que es grande y nuevo. Empresa) Perseguir una nueva empresa produce resultados que superan tu esfuerzo. Donde ha habido pérdidas hasta ahora, es posible la recuperación. Las relaciones anteriores se borran y se comienzan nuevas negociaciones. Primero, la minuciosa recopilación de información es vital. Finanzas) El ingreso y el gasto son ambos frecuentes. Gestiona los fondos de manera planificada. Romance) Lo que comienza como una simple amistad se desarrolla y profundiza gradualmente en amor romántico. Salud) Incluso la enfermedad antigua se recupera con el tratamiento apropiado."}, "☴☶": {"no": 39, "name": "Jian — Viento sobre Montaña (風山漸)", "text": "Jian significa avance gradual — proceder paso a paso firmemente. Guía Celestial) Las grandes cosas se construyen por la acumulación de cosas pequeñas. Como un ganso joven que avanza del agua a la roca a la rama del árbol, como un árbol que crece poco a poco — el progreso gradual y constante será tu camino. Proceder imprudente y descuidadamente no es bueno. Perseverando paso a cuidadoso paso, eventualmente te convertirás en objeto de la admiración y el anhelo de muchos. Empresa) La perseverancia firme da motivo para esperar futuro desarrollo y crecimiento. Seguir el orden y el procedimiento apropiados en los tratos es ventajoso. Finanzas) La abundancia se acumulará gradualmente. También puede surgir ganancia inesperada. Romance) Te embarcarás en un romance bendito con una pareja ideal. Para quienes planean casarse, el apoyo de quienes te rodean permitirá que el asunto proceda fluida y felizmente. Salud) Cuídate de las dolencias del sistema digestivo."}, "☴☷": {"no": 40, "name": "Guan — Viento sobre Tierra (風地觀)", "text": "Guan significa observación — ver y percibir con atención cuidadosa y clara. Guía Celestial) Así como el sol y la luna iluminan todo bajo el vasto cielo, vivir humildemente y acumular virtud en la vida ordinaria hará que lleguen bendiciones por sí solas. La disposición de abrazar la apertura y cooperar con los demás es lo que se necesita. Quienes lideran a otros en la sociedad o quienes son educadores encuentran esta época particularmente propicia. Empresa) La nueva expansión requiere deliberación cuidadosa. Primero, el juicio claro y tranquilo y los poderes de observación son esenciales. La codicia excesiva de riqueza no es deseable. Finanzas) Llegará un grado moderado de bien material a su debido tiempo. Dejar de lado la codicia y esforzarse sinceramente hace que la riqueza llegue naturalmente. Romance) Se desarrolla una relación ideal. Salud) Generalmente un período saludable."}, "☵☰": {"no": 41, "name": "Xu — Agua sobre Cielo (水天需)", "text": "Xu significa esperar — la paciente espera del momento adecuado y señalado. Guía Celestial) Como nubes que ascienden a los cielos, se convierten en lluvia y descienden nuevamente — el ciclo requiere tiempo. Así como la lluvia necesita su tiempo apropiado para caer a la tierra, debes esperar tu temporada. No permitas que la ansiedad te domine; un espíritu magnánimo y generoso es lo que conduce al gran éxito. Empresa) El futuro es prometedor, sin embargo primero debes examinar cuidadosamente tu entorno y tus bases. En negociaciones y tratos, en lugar de crecer ansioso, esperar el momento adecuado hará en realidad que las cosas procedan más fluidamente. Finanzas) La vida diaria no tiene incomodidades. Romance) Primero establecer la estabilidad en la vida diaria conduce a relaciones fluidas y armoniosas. Salud) Generalmente sano, aunque ciertas condiciones pueden requerir atención cuidadosa."}, "☵☱": {"no": 42, "name": "Jie — Agua sobre Lago (水澤節)", "text": "Jie significa moderación y disciplina — la medida apropiada que gobierna todas las cosas. Guía Celestial) Así como cada una de las cuatro estaciones llega sin traicionar jamás su tiempo señalado, el logro de lo que buscas requiere el orden natural y el espíritu de disciplina. Una actitud que no excede ni carece — estable y medida — es el ideal. Cuando la disciplina se vuelve demasiado severa, el progreso se ve impedido; aférrate a tus principios como guía. Empresa) Las empresas pequeñas, perseguidas fielmente y constantemente, traerán ganancias considerables. Las grandes empresas, sin embargo, deben impulsarse hacia adelante con cautela para evitar el fracaso. Finanzas) Incluso cuando la riqueza material es plentiful, deben mantenerse los ahorros. El gasto innecesario tiende a ser considerable en este momento. Romance) La relación se ha profundizado hasta un grado considerable, haciendo difícil la separación. Se desarrolla un amor duradero y perdurable. Salud) Cuídate de los efectos del exceso de alcohol."}, "☵☲": {"no": 43, "name": "Ji Ji — Agua sobre Fuego (水火旣濟)", "text": "Ji Ji significa lo que ya está realizado — todas las cosas ya han sido llevadas a su culminación. Guía Celestial) Un soberano sabio se encuentra con un ministro virtuoso; las circunstancias se desarrollan como se esperaba, y una profunda sensación de estabilidad y satisfacción impregna todas las cosas. Sin embargo, así como la luna llena comienza a menguar, la sabiduría para prepararse para lo que está por venir también es necesaria. Después de lograr lo que te propusiste hacer, lleva los asuntos a una conclusión minuciosa y atiende fielmente a la gestión interna. Empresa) La empresa goza de prosperidad extraordinaria. Sin embargo, concentra tus energías en mantener el estado presente y evita la expansión excesiva. Finanzas) Las fortunas de la riqueza son vigorosas. Gestiona el ingreso con cuidado y prepárate sabiamente para el futuro. Romance) Aparece una pareja ideal. Profundiza la intimidad espiritual entre ustedes. Salud) Generalmente un período saludable."}, "☵☳": {"no": 44, "name": "Zhun — Agua sobre Trueno (水雷屯)", "text": "Zhun significa el proceso de crecimiento — una cosa viva que lucha por surgir y establecerse. Guía Celestial) Como un nuevo brote esperando bajo la tierra congelada el calor de la primavera, esta es una imagen del yin y el yang armonizándose para traer nueva vida. El tiempo aún no ha madurado completamente — recibe la asistencia de los demás mientras construyes constantemente tus habilidades reales. No avances ciegamente; espera el momento en que tus aspiraciones puedan desplegarse verdaderamente. Empresa) Hay altibajos, pero la asistencia de los demás trae mejora. Aférrate a la esperanza y persevera constantemente. Para que las negociaciones y los tratos procedan como se desea y sin fricción, no te apresures. Finanzas) No falta. Sin embargo, los fondos invertidos pueden no ser recuperables a tiempo. Romance) Prevalece un estado de vacilación e indecisión. Salud) Cuídate de las condiciones nerviosas."}, "☵☴": {"no": 45, "name": "Jing — Agua sobre Viento (水風井)", "text": "Jing significa el pozo — una fuente inagotable de alimento extraído de lo profundo de la tierra. Guía Celestial) La imagen de sacar agua del pozo: aunque puede haber dificultades al inicio, la esperanza crece constantemente con el paso del tiempo. En lugar de perseguir nuevas empresas, es ventajoso proteger y mantener lo que has estado haciendo hasta ahora. Mantener fielmente tu posición apropiada y esforzarte con seriedad constante hará que las bendiciones surjan naturalmente. Empresa) Protege tu trabajo presente fielmente y atiende cuidadosamente a la gestión interna. Las nuevas empresas conllevan riesgo — fija tus objetivos claramente de antemano para evitar pérdidas. Finanzas) El gasto es considerable en este momento. Reduce la extravagancia y el despilfarro. Romance) Se necesita nueva estimulación. Si el vínculo espiritual entre ustedes dos es profundo y genuino, el cansancio de la familiaridad puede superarse. Salud) Protégete de la fatiga."}, "☵☵": {"no": 46, "name": "Kan — Agua sobre Agua (坎為水)", "text": "Kan significa el agua fluyendo siempre — el movimiento perpetuo a través de capas de profundidad y dificultad. Guía Celestial) La forma exterior parece vacía, sin embargo la realidad interior es sólida y plena. Con un corazón sincero y fiabilidad sana, incluso si surgen dificultades pasarán fluidamente. A veces la mente puede perder su equilibrio y dispersarse — sin embargo a través de la devoción a la religión, la erudición o la investigación, tus capacidades interiores pueden desarrollarse y cultivarse en una dirección positiva. Empresa) En lugar de expandir tus actividades agresivamente, primero atiende fielmente a la gestión interna. Los asuntos relacionados con documentos deben manejarse con absoluta claridad. No respondas de fiador por otros. Finanzas) Cuídate de la extravagancia y el despilfarro. El gasto tiende a exceder el ingreso en este momento. Romance) Hay tendencia a caer profundamente en el apego apasionado. Salud) La vitalidad tiende a disiparse fácilmente."}, "☵☶": {"no": 47, "name": "Jian — Agua sobre Montaña (水山蹇)", "text": "Jian significa cautela — evitar la acción imprudente y buscar seguridad y protección. Guía Celestial) Elige el curso seguro y asegura buenos aliados — enfrentar incluso lo que es difícil y peligroso con paciencia tranquila, permanecer donde estás trae paz y seguridad. El coraje imprudente y la aventura no deben perseguirse. Observa tu entorno y actúa con circunspección cuidadosa. En tus empresas, la dirección suroeste es favorable mientras que el noreste no lo es. Empresa) No seas apresurado. Elige el camino que es seguro y considerado. La deliberación cuidadosa en todas las inversiones es esencial para evitar pérdidas. Finanzas) Entran sumas pequeñas mientras existe el riesgo de que las grandes salgan. Romance) La situación es compleja. Las relaciones que carecen de seriedad genuina es mejor eliminarlas prontamente. Salud) Cuídate de las dolencias digestivas."}, "☵☷": {"no": 48, "name": "Bi — Agua sobre Tierra (水地比)", "text": "Bi significa cercanía y afinidad — mutua pertenencia y calurosa comunión entre almas afines. Guía Celestial) Este hexagrama sagrado muestra el agua reposando sobre la tierra — el suelo y el agua en relación cercana e íntima entre sí. Del mismo modo, acercarse a quienes son de verdadera virtud y fiabilidad permite que tus aspiraciones se realicen. Profundiza tu comunión con personas excelentes de una manera que corresponda a tu propia posición. Como la competencia es intensa en este momento, debes perseguir buenas oportunidades antes que los demás y buscar la asistencia de aliados con determinación activa. Empresa) Asegurar buenos aliados permite que tu empresa avance fluidamente. Finanzas) La riqueza en tu posesión puede no ser grande, pero aparecen personas que ofrecen asistencia. Romance) Propicio. Sin embargo, porque muchos del sexo opuesto te rodean, es difícil llegar a una decisión clara del corazón. Salud) Cuídate de las dolencias crónicas."}, "☶☰": {"no": 49, "name": "Da Xu — Montaña sobre Cielo (山天大畜)", "text": "Da Xu significa gran acumulación y almacenamiento — reunir abundantemente y construir reservas. Guía Celestial) La energía del cielo desciende sobre la montaña y la exuberante vegetación crece en abundancia. Aprovechando las habilidades que has cultivado constantemente hasta ahora y la sabiduría de la experiencia, determina tu curso de acción futuro y comiénzalo con resolución. Incluso si surgen dificultades, con solo perseverancia y esfuerzo el camino adelante será claro y abierto. Empresa) Sin prisa, establecer tus bases paso a cuidadoso paso producirá grandes ganancias. La gestión cuidadosa de la riqueza material hará que la empresa florezca. Finanzas) Las fortunas de la riqueza son vigorosas; dependiendo de tus habilidades, pueden fluir grandes sumas. Romance) Se desarrolla un amor sincero y genuino. Sin embargo, pueden surgir asuntos prácticos y domésticos a considerar. Salud) Protégete de la fatiga."}, "☶☱": {"no": 50, "name": "Sun — Montaña sobre Lago (山澤損)", "text": "Sun significa sacrificio y pérdida que conduce a la acumulación de virtud — la sabiduría de buscar lo que es mayor renunciando a lo que es menor. La buena fortuna sigue después de la dificultad temprana. Guía Celestial) En lugar de buscar pequeñas ganancias inmediatas, es el curso más sabio cavar profundo y buscar la gran cosecha que está adelante. Aunque están presentes el trabajo inicial y la pérdida, al traer alegría a los demás de esta manera y dar libre y generosamente sin reserva en la persecución de grandes aspiraciones, los resultados al final se realizarán. Empresa) Lanzar una nueva empresa puede traer dificultad temprana, sin embargo el futuro es prometedor. Procede sin prisa de manera cuidadosa y firme. Finanzas) El gasto es pesado en este momento — se necesita atención cuidadosa a la gestión financiera. La abundancia llegará en el futuro. Romance) Se desarrolla un amor sincero y genuino. Un buen vínculo del destino será encontrado. Salud) Atiende a construir la fuerza física y el acondicionamiento."}, "☶☲": {"no": 51, "name": "Ben — Montaña sobre Fuego (山火賁)", "text": "Ben significa adorno y embellecimiento — dar forma hermosa y esplendor exterior. Guía Celestial) Como el resplandor vespertino del sol poniente que pinta el mundo de carmesí, la mente se entrega al sentimiento y la imaginación en lugar al pensamiento racional frío. Del mismo modo, hay tendencia a preocuparse por las apariencias exteriores. Vive de acuerdo con tu posición apropiada y busca la sustancia real. Permite que los planes se desarrollen gradualmente — este es el mejor curso. Empresa) Las empresas con fuerte énfasis en la apariencia exterior conllevan riesgo. La empresa de pequeña escala procederá bastante bien. Considera especialmente el beneficio de la otra parte. Finanzas) Las sumas pequeñas fluyen fácilmente. Las ocasiones para recibir regalos tienden a multiplicarse. Romance) La verdadera sinceridad hacia el otro es lo que previene el fracaso. La preocupación por la apariencia exterior conduce fácilmente a la pérdida. Salud) Sin una vida disciplinada y regulada, la enfermedad tiende a surgir."}, "☶☳": {"no": 52, "name": "Yi — Montaña sobre Trueno (山雷頤)", "text": "Yi significa la mandíbula — alimento y la provisión apropiada para el crecimiento. Guía Celestial) Como el dragón que desciende al agua clara, si ha habido algo incorrecto en la vida diaria, ahora es el momento de corregirlo. Aunque el proceso puede parecer tranquilo en la superficie, así como la moderación en comer y beber es el fundamento mismo del alimento físico, este es un momento adecuado para planificar nuevo trabajo o asumir una nueva ocupación. Persigue tu trabajo sinceramente y de acuerdo con tu posición apropiada. Para asegurar ganancias reales, encuentra colegas de mente afín y trabaja juntos. Empresa) Recibir la asistencia de colegas y avanzar paso a paso produce grandes ganancias. Finanzas) Las necesidades diarias no faltan. Sin embargo, las expectativas excesivas es mejor no albergarlas. Romance) Te asociarás con alguien cuyo espíritu está en concordia con el tuyo. Salud) El descuido de la salud conduce fácilmente a la enfermedad."}, "☶☴": {"no": 53, "name": "Gu — Montaña sobre Viento (山風蠱)", "text": "Gu significa estancamiento que demanda renovación — el viento soplando desde debajo de la montaña. Guía Celestial) El espíritu de mejorar lo que ha salido mal es esencial. Perseguir solo la comodidad y la facilidad en la vida diaria conduce al deterioro del cuerpo y la mente — lo que está distorsionado y corrompido debe ser agarrado firmemente y enderezado. A través de este proceso puede haber a veces angustia mental y espiritual, sin embargo habiéndola superado, las cosas florecerán más grandemente que antes. Empresa) Debes adaptarte bien a los cambios en las circunstancias circundantes. No te apresures agresivamente en nuevas empresas o expansiones. Finanzas) La vida diaria no es incómoda. Sin embargo, dado que el gasto tiende a exceder el ingreso en este momento, la extravagancia o el consumo excesivo traerán dificultad. Romance) Las relaciones frívolas y jugueteas no son apropiadas. Salud) Si persiste una dolencia antigua, el tratamiento pronto es mejor."}, "☶☵": {"no": 54, "name": "Meng — Montaña sobre Agua (山水蒙)", "text": "Meng significa juventud e inexperiencia — el estado sin cultivar de quien aún no ha encontrado el camino. Guía Celestial) Un manantial surge desde debajo de la montaña con dificultad y obstrucción ante él. Establecer una visión clara no es fácil, y la acción imprudente debe evitarse estrictamente. Así como un discípulo debe buscar instrucción e iluminación de un maestro, escuchar con atención cuidadosa y receptiva es lo que se necesita. Además, combinar tu fuerza con la de buenos aliados hará que tus aspiraciones se realicen fluidamente. El potencial de desarrollo es ilimitado — mira hacia el futuro y acumula virtud. Empresa) Presta atención al consejo de superiores y compañeros al formular tus planes. En negociaciones y tratos, también es sabio confiar los asuntos a alguien de competencia probada. Finanzas) El gasto en propósitos inciertos o poco claros tiende a ser considerable. Romance) Incluso cuando la otra parte es entusiasta y directa, tú mismo tiendes a ser incapaz de llegar a una decisión clara. Salud) La causa de los síntomas tiende a ser poco clara. Cuídate de los padecimientos respiratorios."}, "☶☶": {"no": 55, "name": "Gen — Montaña sobre Montaña (艮為山)", "text": "Gen significa quietud y permanencia — permanecer firme e inmóvil en el lugar apropiado. Guía Celestial) El tiempo demanda proteger lo que has estado haciendo y permanecer fielmente dentro de tu posición apropiada. Así como la montaña permanece firme en un lugar, mantén un corazón inamovible e integridad inquebrantable, y espera que llegue la buena temporada. En lugar de moverte imprudentemente, construir tus habilidades reales en preparación para el futuro es el curso más sabio. Discerne claramente cuándo avanzar y cuándo retirarse, de acuerdo con el tiempo y el lugar. Empresa) En lugar de perseguir dos empresas simultáneamente, concentrar tus energías en una es más ventajoso. La dispersión de la fuerza debe prevenirse. Antes de involucrarte activamente en tratos, observa la otra parte desde una distancia vigilante. Finanzas) Los fondos listos no son plentiful. Romance) Una relación de amistad sin complicaciones o encuentro espiritual de mentes. Salud) Atiende a la nutrición y el cuidado físico."}, "☶☷": {"no": 56, "name": "Bo — Montaña sobre Tierra (山地剝)", "text": "Bo significa despojo — la montaña desmoronándose, y la necesidad de alejarse del escombro que cae antes de que golpee. Guía Celestial) La imagen de una alta montaña azotada por el viento y la lluvia. Revisa cuidadosamente el trabajo que has estado persiguiendo hasta ahora. Si estás contemplando una nueva empresa, la preparación minuciosa por adelantado es esencial para evitar errores. Así como se espera a través del invierno el regreso de la primavera, para que las cosas se vuelvan a tu favor, recoge tu espíritu y cuerpo dispersos y espera que llegue la buena temporada. Empresa) Antes de la expansión, devótate primero fielmente a la gestión interna. El descuido de la gestión puede conducir a pérdidas inesperadas. Finanzas) El gasto innecesario causado por los asuntos de quienes te rodean tiende a ser considerable en este momento. Romance) Incluso cuando muchos del sexo opuesto están a tu alrededor, si la conexión carece de seriedad genuina, es mejor eliminarla prontamente. Salud) Si existe una dolencia antigua, el tratamiento es necesario."}, "☷☰": {"no": 57, "name": "Tai — Tierra sobre Cielo (地天泰)", "text": "Tai significa paz y gran facilidad — la más alta armonía de todas las condiciones. Guía Celestial) Lo pequeño parte y lo grande llega — todas las cosas son llevadas a la culminación armoniosa. La fortuna es grandemente propicia y todo lo que pongas en tu corazón se realizará fluidamente. Como quienes te rodean están unidos en espíritu y propósito, todo lo que emprendas procede como si tuviera el viento detrás de las velas, avanzando sin obstáculo ni dificultad. Empresa) Esta es una época en que la cosecha de resultados supera ampliamente el esfuerzo invertido. La pequeña inversión produce gran retorno. La búsqueda activa y audaz hace que las negociaciones y los tratos se realicen con facilidad. Finanzas) Puede esperarse un gran ingreso. La ganancia inesperada es posible y el flujo de fondos es fluido y libre. Romance) Puede presentarte una buena pareja. Esta es una época adecuada para considerar el matrimonio. Salud) El cuerpo está sano, aunque la enfermedad puede surgir ocasionalmente de una vida que carece de disciplina y moderación."}, "☷☱": {"no": 58, "name": "Lin — Tierra sobre Lago (地澤臨)", "text": "Lin significa presidir y gobernar — enfrentar cada situación con respuesta hábil y ágil. Guía Celestial) Como los peces y el dragón que se encuentran con el amplio mar y el río abierto — justo como la energía yang crece y florece en primavera y verano, este es un tiempo de gran actividad esperada y logro. Sin embargo, precisamente porque la fortuna es fuerte, hay también tendencia a correr demasiado lejos adelante. Comenzar nuevo trabajo también está bien, sin embargo en toda acción uno debe proceder con cuidado reflexivo. Los tiempos de cambio demandan cooperación con los aliados a tu alrededor, y es esencial la capacidad de juicio decisivo y ágil. Empresa) Comenzar una nueva empresa procede fluidamente. Sin embargo, es necesaria la cautela deliberada. Finanzas) Hay un excedente. Sin embargo, la extravagancia tiende a ser una tentación. Romance) Se desarrolla un romance brillante y dulce. Esta es una época para conocer una buena pareja. Salud) Como la salud es buena, incluso la enfermedad menor se recupera fácilmente."}, "☷☲": {"no": 59, "name": "Ming Yi — Tierra sobre Fuego (地火明夷)", "text": "Ming Yi significa la herida de la luz — alejarse del brillo y enfrentarse hacia la oscuridad. Guía Celestial) El curso más sabio es cultivar tus habilidades interiores tranquilamente y con calma compostura en preparación para el futuro. En particular, quienes están dedicados al cultivo constante de habilidades — como la investigación académica o la preparación para exámenes — cosecharán buenos recompensas. Si uno se vuelve complaciente dependiendo de las propias capacidades y cae en la vida ociosa, al final no habrá beneficio. Incluso si surgen dificultades en tu trabajo, mantén el camino recto hasta que las circunstancias regresen a su estado apropiado. Empresa) La devoción a tu trabajo presente es el mejor curso. Las nuevas empresas y la expansión de empresa tienden a ir acompañadas de dificultad. Finanzas) Los fondos no son plentiful. Incluso cuando la riqueza es considerable, exhibirla ante los demás trae pérdidas inesperadas. Romance) Tiende a desarrollarse una asociación privada y secreta, oculta a los ojos de los demás. Salud) Atiende a construir la fuerza física y la nutrición."}, "☷☳": {"no": 60, "name": "Fu — Tierra sobre Trueno (地雷復)", "text": "Fu significa retorno — el regreso de lo que ha partido. Guía Celestial) Como el calor de la primavera que regresa después de que ha pasado el largo invierno — en el ciclo de las estaciones, esto corresponde al solsticio de invierno, cuando los días comienzan a alargarse y la energía yang se agita por primera vez nuevamente. La autoconfianza y la capacidad para comenzar cosas nuevas surgirán dentro de ti. Si se descubre una empresa prometedora, una postura de esfuerzo paciente y constante será crucial. Sin embargo, en esta etapa, proceder con prisa excesiva no está bien. Por lo tanto, establece tus planes paso a cuidadoso paso, comenzando por lo que está cerca y gradualmente extendiéndote hacia lo que está más distante. Empresa) La vida y el vigor regresan gradualmente. Finanzas) Las necesidades diarias no faltan. Romance) Muchos del sexo opuesto tienden a reunirse a tu alrededor, aunque la relación tiende a permanecer en el nivel de la simple amistad. Salud) Incluso la enfermedad antigua eventualmente se recuperará."}, "☷☴": {"no": 61, "name": "Sheng — Tierra sobre Viento (地風升)", "text": "Sheng significa ascenso — el levantamiento constante hacia arriba. Guía Celestial) Las grandes cosas se construyen por la acumulación de cosas pequeñas. Tus habilidades recibirán el debido reconocimiento y gradualmente te darán la oportunidad de desplegar completamente tus aspiraciones. Como un árbol joven que crece de una semilla hasta convertirse en un árbol grande, estás caminando el camino del crecimiento gradual. Sin embargo, esto no es un salto de una vez a gran altura — el avance debe construirse etapa a etapa. Esfuérzate sinceramente y sin falta lograrás tu objetivo. Acercarse a buenos aliados y superiores respetados es ventajoso. Empresa) Se forman nuevos planes y nuevos contratos. Las grandes ganancias no pueden esperarse inmediatamente, sin embargo con fortuna vigorosa, el movimiento activo produce buenos resultados. Finanzas) Puede esperarse un retorno proporcional al esfuerzo que has invertido. El ingreso aumentará gradualmente. Romance) Si el vínculo ya está bien establecido, la intimidad se profundizará y crecerá. Salud) Cuídate de las dolencias digestivas."}, "☷☵": {"no": 62, "name": "Shi — Tierra sobre Agua (地水師)", "text": "Shi significa el gran ejército — movimiento colectivo disciplinado y con propósito. Guía Celestial) Este hexagrama sagrado es como la imagen del agua contenida dentro de la tierra. El agua subterránea realiza su verdadero valor solo cuando emerge a la superficie y se da a todos los seres vivientes. Por lo tanto, en los días por venir liderarás y dirigirás a un gran número de personas. Como se reúnen grandes números y la competencia se intensifica y surge la confusión, debe discernirse la postura apropiada a adoptar — encontrar todas las cosas con sinceridad hará que las bendiciones sigan. Empresa) Proteger tu trabajo presente fielmente trae beneficio. Cuando lances nuevas empresas, primero persigue la unidad de los que están dentro antes de volverse hacia afuera. Finanzas) Estarán presentes los recursos materiales suficientes para vivir diariamente con comodidad. Romance) La vida diaria práctica tiene prioridad y hay un grado de tensión. Salud) Las dolencias que surgen de condiciones crónicas requieren que se reserve tiempo para la salud y el descanso."}, "☷☶": {"no": 63, "name": "Qian — Tierra sobre Montaña (地山謙)", "text": "Qian significa humildad — rebajarse a uno mismo y conducirse con modesta gracia en todas las cosas. Guía Celestial) Protege tu conducta con cuidado y trata a todos quienes te rodean con genuina humildad. Vivir de acuerdo con los principios apropiados hará que las bendiciones lleguen naturalmente. El exceso es peor que la deficiencia — lo que tienes en exceso debería compartirse con quienes carecen. No cedas a la codicia; la postura de generosidad hacia quienes te rodean es lo que más importa. El camino del humilde ceder penetra en cada rincón de la vida sin excepción. Empresa) Consolida tus bases y atiende fielmente a la gestión interna. No te apresures en negociaciones y tratos. Seguir el orden y el procedimiento apropiados aumenta la probabilidad de conclusión exitosa. Finanzas) No desbordante, sin embargo la vida diaria no tiene incomodidades. Romance) Los hombres encontrarán muchas mujeres a su alrededor. Para quienes planean matrimonio, si hay una fuerte unidad espiritual con la pareja, se realizará — aunque puede tomar tiempo. Salud) Cuídate de las dolencias crónicas."}, "☷☷": {"no": 64, "name": "Kun — Tierra sobre Tierra (坤為地)", "text": "Kun encarna la tierra ilimitada e infinita — la extensión sin límites que recibe todas las cosas. Guía Celestial) La gran tierra posee la virtud de cargar y nutrir todas las cosas sin limitación ni condición. Como una yegua gentil y cediente caminando sobre la tierra, seguir en lugar de liderar es lo que trae la mayor buena fortuna. Así como la tierra abraza y nutre a todos los seres vivientes, otorga virtud a los demás con un espíritu abierto y generoso. Observar tu medida apropiada y mantener tu mente recta y verdadera permitirá que todas las cosas se realicen fluidamente. Procediendo hacia el suroeste se encontrarán buenos aliados. Empresa) Pueden encontrarse buenos aliados y socios. Sin embargo, este no es el momento de perseguir nuevas empresas con determinación agresiva. Primero considera el beneficio de la otra parte, y las cosas procederán fluidamente. Romance) Una decisión clara del corazón no se alcanza fácilmente. Permitir que las cosas se prolonguen demasiado puede hacer que la relación se disuelva inconclusamente. Salud) Protégete de la fatiga."}}; }
  return _ZAMI_ES_DATA[sym];
}

var _ZAMI_JA_DATA = null;
function _getJA(sym) {
  if (!_ZAMI_JA_DATA) {
    _ZAMI_JA_DATA = {
"☰☰":{"no":1,"name":"乾為天（けんいてん）","text":"運勢) 非常に強い時期です。大きな志を持ち、堂々と正道を歩めば前途は開けます。天の道にならい、節度ある努力と謙虚さを忘れずに。信頼できる上位者や仲間と力を合わせることが吉です。事業) 実質的な利益はすぐには現れにくい時期です。交渉や取引は焦らず、忍耐強く進めることで成果が生まれます。金運) 日常生活に支障はありませんが、商業に携わる方は資金繰りに注意が必要です。恋愛) 個性の強い相手との出会いが多い時期です。自制心を持って接することが大切です。健康) 全般的に健康ですが、感染症には注意してください。"},
"☰☱":{"no":2,"name":"天澤履（てんたくり）","text":"運勢) 虎の尾を踏むような危うい状況でも、礼節を守り正道を歩めば吉となります。順序を踏んで慎重に進むことが大切です。目上の人の助言を参考にし、忍耐と柔軟性を持つことが肝要です。事業) 事前に綿密な計画を立て、契約は慎重に。些細なことで争わず、上位者の指示に従えば安泰です。金運) 日常生活には不自由しません。見た目よりも実質を重視しましょう。恋愛) 周囲に人が多く一人に絞れない状況です。誠実な態度で接することが肝心です。健康) 全般的に健康な時期です。呼吸器系に気をつけてください。"},
"☰☲":{"no":3,"name":"天火同人（てんかどうじん）","text":"運勢) 太陽が世界を公平に照らすように、公明正大に行動すれば志を遂げられます。協力して大きな発展が期待できる時期です。競争が激しくなることもありますが、心を開いて協力すれば大きな成功が得られます。事業) 内部管理に徹すれば順調に進みます。共同事業は特に吉です。金運) 豊かさを感じられます。金銭絡みのトラブルには注意しましょう。恋愛) 競争相手が多い時期です。相手と精神的な絆を深めることで良い結果が生まれます。健康) 感染症に注意してください。"},
"☰☳":{"no":4,"name":"天雷无妄（てんらいむぼう）","text":"運勢) 天からの雷が鳴るように、自然の理にしたがって行動すれば吉です。準備なく無闇に動くと実りがありません。内側を充実させて安定を保てば思わぬ幸運が訪れます。事業) 新たな展開を急ぐより現状を固めることが先決です。相手の出方に合わせて対応するのが得策です。金運) 実質を大切にする時期です。日常生活には不自由しませんが、財物への執着は禁物です。恋愛) 気質の似た相手と縁があります。婚縁は焦らず自然な流れに任せれば成就します。健康) 健康な時期です。病が生じても自然に回復するでしょう。"},
"☰☴":{"no":5,"name":"天風姤（てんぷうこう）","text":"運勢) 日月が暗くなった後また輝くような時期です。目標を明確に定めて行動しましょう。思わぬ横財も期待できますが、詐欺に遭うリスクもあります。冷静な判断が重要です。事業) 余計なことに手を出さず、本業に専念するのが良いでしょう。焦らず段階を踏んで進めれば思わぬ好機が訪れます。詐欺や紛失には注意を。金運) 小銭は入りやすく、大金が出やすい時期です。身の丈に合った生活を心がけましょう。恋愛) 自己中心的で遊び的な交際になりやすい時期です。相手の真意を見極めてください。健康) 過労に注意してください。"},
"☰☵":{"no":6,"name":"天水訟（てんすいしょう）","text":"運勢) 他者の意見を尊重し、自分が正しいと思う場合でも自制することが大切です。周囲に馴染む柔軟な姿勢が福をもたらします。言動に注意し、無用なトラブルを避けてください。事業) 分不相応なことには手を出さないように。書類の処理は慎重に。交渉では明確な決着をつける姿勢が重要です。金運) 日常生活には支障ありません。恋愛) 相手と状況や気持ちが噛み合わないことが多い時期です。明るい態度を保ち、相手を理解しようとすれば小さな摩擦は解消されます。健康) 消化不良に気をつけてください。"},
"☰☶":{"no":7,"name":"天山遯（てんざんとん）","text":"運勢) 吉凶が相半ばする時期です。無理に動くより現状維持に努めることが有利です。計画はよく吟味して進めてください。時には静かな楽しみの時間を持つことも必要です。事業) 実益を得るには、まず小さなことを着実にこなすことが大切です。交渉では自ら積極的に出るのは控えましょう。投資は慎重に。金運) 収入より支出が多い時期です。人の保証人になることは危険です。恋愛) 友人関係でも出費が生じることがあります。まず自分の地盤を固めることが先決です。健康) 日頃から体力の維持に努めてください。慢性病に注意。"},
"☰☷":{"no":8,"name":"天地否（てんちひ）","text":"運勢) 最初は困難があっても、徐々に道は開けてきます。困難に耐えれば思わぬ大きな実りが得られます。贅沢を慎み、質素な徳で内実を固めましょう。事業) 積極的に出るより静かに進める方が良いでしょう。内部管理に注意を払ってください。交渉では相手が有利な立場にある場合が多いですが、長年の取引先なら問題ありません。金運) 全般的に余裕は少ない時期です。金銭・書類の管理を慎重に。恋愛) 相手の誠意をよく見極めて行動してください。結婚を考えている場合は、時間が経てば成就するでしょう。健康) 体力を養うことが大切です。食欲不振に注意。"},
"☱☰":{"no":9,"name":"澤天夬（たくてんかい）","text":"運勢) 昇る朝日のように運勢が盛んな時期です。謙虚に振る舞わなければかえって失敗を招くことがあります。上位者には礼儀正しく、下位者には寛大な心で接しましょう。事業) 確実な計画を立てて好機を待ちましょう。相手の出方に応じて受動的に対応することが重要です。金運) 財物は豊かに得られますが、過度の欲は禁物です。周囲の利益も考え、適度に分かち合いましょう。恋愛) 複雑な状況です。相手との摩擦はすぐに解決するのが良いでしょう。健康) 病が生じたら速やかに治療しましょう。呼吸器系疾患に注意してください。"},
"☱☱":{"no":10,"name":"兌為澤（だいいたく）","text":"運勢) 春雨に草木が活気を取り戻すような時期です。日常生活には希望に満ちた良い出来事が多く訪れます。ただ、この卦には喜びの一方で内面的な不完全さの意味もあります。物事の締めくくりをしっかりつけ、不必要な争いは避けてください。事業) 本業に専念すれば良い実りが得られます。販売や宣伝を要する事業は有望です。金運) 日常生活には十分な財物が入ります。だんだんと状況が改善されるでしょう。恋愛) 外見重視の一時的な交際になりやすい時期です。異性問題に執着しすぎないようにしましょう。健康) 口の中の疾患に注意してください。"},
"☱☲":{"no":11,"name":"澤火革（たくかかく）","text":"運勢) 古いものを捨て、新しいものを取り入れる時期です。周囲の人が変わり、仕事でも新しい領域を開拓することになります。変化を求めるのに良い時期ですが、正しい道を見つけることが大切です。事業) 新たな事業が生まれます。転業など変化を試みるには良い時期です。取引でも良い機会が訪れます。金運) 財運が旺盛です。投資と努力次第で大きな利益を得ることができます。恋愛) 縁談を逃していた人に良い相手が現れます。誠実な交際を心がけましょう。健康) 持病があれば早めに治療しましょう。過労に注意してください。"},
"☱☳":{"no":12,"name":"澤雷隨（たくらいずい）","text":"運勢) 雷は夏に威力を発揮しますが、環境に適応しながら動くべき時期です。他者の意見に従って行動するのが上策です。状況の変化に素早く対応し、今まで活発に動いてきた人は他者の話に耳を傾け自分を振り返るべきです。事業) 流行に合わせて行動すれば良い結果が得られます。周囲の環境をよく観察することが重要です。焦らず忍耐を持って進めれば成就します。金運) 資金繰りは円滑で収入が増えます。出費も増えます。恋愛) 年齢差のある相手と交際することが多い時期です。三角関係には注意しましょう。健康) 些細な病でも見逃さないようにしましょう。季節の変わり目に注意してください。"},
"☱☴":{"no":13,"name":"澤風大過（たくふうたいか）","text":"運勢) 行き過ぎはかえって足りないより良くないものです。正しい軌道を守り、中道を歩むことが肝心です。責任が重くなることがありますが、一度に解決しようとせず、心の安定を保つことが大切です。他者の協力を求め、譲れることは譲りましょう。事業) 能力以上のことに手を出してはいけません。まず基礎を固め、内部管理に徹しましょう。金運) 収入と支出のバランスを保つことが重要です。恋愛) 複雑で微妙な出会いになりやすい時期です。年齢差のある相手との縁が多いです。健康) 過労は禁物です。消化不良や体力消耗に注意し、持病は早めに治療しましょう。"},
"☱☵":{"no":14,"name":"澤水困（たくすいこん）","text":"運勢) 分を守って時を待つことが大切です。明確な目標を持って誠実に努力すれば凶が転じて吉になります。困難な時は正しい心で自重することが上策です。事業) 他者の甘言に惑わされず、本業をしっかり守りましょう。取引では焦らず、ある程度譲歩することが得策です。金運) 収入より支出が多い時期です。浪費を減らし、詐欺や誘惑に乗らないようにしてください。恋愛) 不純な関係は早めに清算するのが賢明です。相手の誠意を正確に見極めましょう。健康) 体力管理に励んでください。過労を避けましょう。"},
"☱☶":{"no":15,"name":"澤山咸（たくざんかん）","text":"運勢) 枯木に慈雨が降るような時期です。誠実に努力すれば天も動きます。周囲の人と精神的な交流を深め、下位者の志を包み込む寛大さを持ちましょう。事業) 周囲の助力が多い時期です。優れたアイデアを持つ人と出会えます。目標を定めたら迷わず進めましょう。金運) 日常生活には十分です。努力次第で大きな収入も期待できます。恋愛) 理想の相手に出会い、情熱的な恋愛ができます。結婚すれば幸せな家庭を築けるでしょう。健康) 身体は健康です。風邪に注意してください。"},
"☱☷":{"no":16,"name":"澤地萃（たくちすい）","text":"運勢) 龍が広い海に出るように事業は栄えるでしょう。周囲に従う人が多くなります。ただ競争が激しくなり、争いが起きやすいため、大人の知恵を借りながら進めてください。事業) 運勢が旺盛で物事は順調に進みます。取引では相手の利益も考えることが大切です。金運) 財物は豊かです。自らの実力向上に力を注ぎましょう。恋愛) 理想的な恋愛ができます。ただし注意が散漫になると何も成就しません。健康) 呼吸器系の疾患に注意してください。"},
"☲☰":{"no":17,"name":"火天大有（かてんたいゆう）","text":"運勢) 中天に輝く太陽のように運勢が旺盛です。秋の豊作のような時期で、財物が豊かで精神的にも安定しています。しかし太陽も常に中天にあるわけではないので、変化に備えることも忘れずに。事業) 事業運が非常に旺盛で多くの利益を得られます。取引や交渉は早めに動くほど有利です。金運) 財物は豊かで資金繰りも円滑な時期です。恋愛) 女性の立場が強い時期です。健康) 食欲不振に注意してください。"},
"☲☱":{"no":18,"name":"火澤睽（かたくけい）","text":"運勢) 小さなことを進めるのに適した時期です。欲を抑えれば無事に過ごせます。周囲との和合に努め、言動を慎みましょう。普段から精神的な交流を大切にしておけば後に多くの助けが得られます。事業) 積極的に新事業を推進する前に現在の仕事の内部管理を充実させましょう。小さなことは順調に進みますが、不必要な取引は避けてください。金運) 不自由はしませんが、出費を減らしましょう。恋愛) 状況が複雑です。気質が反対でも不思議な魅力を感じ、離れられない関係になりやすいです。健康) ストレスに注意してください。"},
"☲☲":{"no":19,"name":"離為火（りいか）","text":"運勢) 日月が天に輝き世界を照らすように、意欲をもって実力を発揮できる良い時期です。ただし心が散り集中が難しくなることもあります。自分を過度にアピールするのは避け、上位者の意見を素直に受け入れる謙虚さが必要です。事業) 実質的な中身がないことがあります。長期的な仕事や新規事業は慎重に。書類管理を徹底しましょう。金運) 不足はしませんが、浪費が多くなりがちです。節約を心がけてください。恋愛) 率直で情熱的な恋愛をします。ただ気質が似ているために早く冷めることも。見栄を張らないようにしましょう。健康) 身体は健康ですが思わぬ病が起きやすいです。高熱・視力低下に注意してください。"},
"☲☳":{"no":20,"name":"火雷噬嗑（からいぜいこう）","text":"運勢) 火のように明るく、雷のように力強く活躍できる時期です。志があれば果敢に公明正大に順を追って一歩ずつ進んでいきましょう。困難があっても諦めず努力を続ければ成功に近づきます。事業) 事業を始めるのに良い時期です。果敢に推進しましょう。金運) 日常生活には不便はありません。一生懸命努力すれば相当な利益が期待できます。恋愛) 気質の似た相手に出会いやすい時期です。誠意のない関係は早めに整理しましょう。健康) 飲酒過多には注意してください。"},
"☲☴":{"no":21,"name":"火風鼎（かふうてい）","text":"運勢) 古いものを捨て、新しいものを取り入れる好機です。木に火がつき燃え上がるように計画していることは順調に進みます。他者と協力することで予想以上の成果が期待できます。事業) 事業の内容や見せ方を新しくすることが重要です。良い協力者と組み、利益を適切に分配することも吉です。金運) 豊かです。資金はいくつかの方向に融通させましょう。恋愛) 知性的で気が合う相手との交際ができます。誠実さがあれば縁談もうまくいくでしょう。健康) 感染症・呼吸器系・腸疾患に注意してください。"},
"☲☵":{"no":22,"name":"火水未濟（かすいびせい）","text":"運勢) 陰陽は正位を得ていませんが、互いにうまく応じ合っている状態です。これから完成に向けて少しずつ前進していきます。多少の困難があっても待てばやがて良い運が訪れます。焦らず沈着に実力を蓄えることが最も大切です。事業) 最初は順調でなくても、時間が経つにつれて発展します。困難があっても途中で諦めないことが重要です。金運) 豊かではありませんが日常生活には支障ありません。恋愛) 気の合う人に出会えます。結婚を考えている場合は障害も出ますが、努力すれば成就します。健康) 健康で体力は充実しています。感染症に注意してください。"},
"☲☶":{"no":23,"name":"火山旅（かざんりょ）","text":"運勢) 旅人の旅は不安と孤独を伴います。それでも焦らず着実に目的地へ向かうことが大切です。積極的に動く前に実力を培い、時と場所に合わせて行動しましょう。事業) 新しいことを始めたり拡大したりするには適しない時期です。ただし外販や文化事業は有利です。相手の立場と利益を先に考えれば取引は順調に進みます。金運) 小銭は入りやすく大金が出やすい時期です。恋愛) 年齢差の大きい交際です。学問や共同事業を通じた出会いは円満な関係になれます。健康) 持病があれば早めに治療しましょう。感染症に注意してください。"},
"☲☷":{"no":24,"name":"火地晉（かちしん）","text":"運勢) 明君が賢臣に出会う格です。大地の上に太陽が昇り世界を照らすように、新しい活動をしていきます。基礎がしっかりしていれば成功できます。周囲の嫉妬や困難にも動じず対処すれば何も問題はありません。事業) 新しい計画を立て、事業を拡大していきます。大きな志を持ちましょう。競争は激しくても勤勉に努力すれば良い結果が得られます。金運) 最初は豊かでなくても徐々に収入が増えてきます。株式や投資で利益が生まれます。恋愛) 明るく楽しい恋愛ができます。良い縁と出会えるでしょう。健康) 感染症には十分注意してください。"},
"☳☰":{"no":25,"name":"雷天大壯（らいてんたいそう）","text":"運勢) 天上の雷が千里を揺るがしても降りてこないように、運勢が旺盛でも冷静さと自制心を保たなければなりません。強い意欲で事業を拡大しても、軽率な行動は避けましょう。事業) 新しい事業を始めたり拡大したりする時期です。運勢が強いので計画性と慎重さがあれば順調に進みます。取引では穏やかに対応すると良い結果が生まれます。金運) ゆとりがあり豊かです。今から貯蓄しておくと将来楽になります。恋愛) 感傷的でそわそわした恋愛をします。沈着で真剣な姿勢が必要です。健康) 全般的に健康ですが、胃腸疾患がある場合は悪化しないように注意してください。"},
"☳☱":{"no":26,"name":"雷澤歸妹（らいたくきまい）","text":"運勢) 陰陽が和合しようと努力する状況です。正道を守れば無事に平穏な日々を送れます。感情に流されて理性的な判断ができなくなると損失が伴います。焦らず十分に準備して適切な時機を待ちましょう。事業) 新しい事業を無理に試みると良くありません。今あるものを守ることに力を注いでください。手順を無視すると困難を招きます。金運) 小銭は入りやすく大金が出やすい時期です。出費管理に努めましょう。恋愛) 複雑で遊び的な交際は避けましょう。異性問題については慎重に。健康) 神経過敏に注意してください。"},
"☳☲":{"no":27,"name":"雷火豊（らいかほう）","text":"運勢) 暗闇を遠ざけ、明るさに向かって進む時期です。太陽が中天に輝けば世界が明るくなるように、運勢が強くて豊かな実りが期待できます。ただし月が満ちれば欠けるように、内部では力が徐々に弱まり始めます。長引いている案件があれば早めにケリをつけましょう。事業) 順調に進みます。ただし新規事業を始めるよりも、すでに栄えている事業を堅実に運営することが重要です。金運) 財運が旺盛です。ただし見栄や贅沢による出費を控えましょう。恋愛) 物質的で表面的な恋愛をしやすい時期です。相手の内面と誠実さを見極めましょう。健康) 変化が多い時期なので、日頃から十分な摂生と健康管理が必要です。"},
"☳☳":{"no":28,"name":"震為雷（しんいらい）","text":"運勢) 雷が四方を震動させるように、目標を定めて努力すれば順調に目的を達成できます。ただし雷は音だけで実体がないように、まず目標と計画を確実に立てましょう。自分を磨き反省することが大切です。事業) 二つの事業を同時に進めやすい時期です。計画が大きすぎて力が分散されると実益が得にくいので注意してください。相手との取引は目先の利益より長期的な視野を持って臨みましょう。金運) 財運はありますが一度には入りません。徐々に開けてくるでしょう。恋愛) 浮ついた恋愛をしやすい時期です。誠実さが欠如していると縁談までは進めません。健康) 肝臓系の疾患に注意してください。"},
"☳☴":{"no":29,"name":"雷風恒（らいふうこう）","text":"運勢) 日月が常に世界を照らすように、繰り返しの日常を維持することで生活の安定と喜びが得られます。平穏な日々を迎えることができるでしょう。忍耐を持って着実に努力を続けることが重要です。感情に流されず確固たる主観を持ちましょう。事業) 過度な拡大や新しい計画は好ましくありません。今まで通りの事業を着実に守り続けることが大切です。長期的な視野で交渉を進めると良いでしょう。金運) 財運が良く、金銭は豊かで制約がありません。恋愛) 無理のない穏やかな交際をします。婚姻に至るまでに多少の困難はありますが、成就すれば良好です。健康) 規則正しく節制した生活で病を防ぎましょう。腰痛に注意してください。"},
"☳☵":{"no":30,"name":"雷水解（らいすいかい）","text":"運勢) 冬に凍っていたものが新しい春を迎えて溶けるような状況です。良い協力者を得て新たな活動ができます。今まで詰まっていた困難な問題が解決されるでしょう。この時期は積極的に動くことで困難から脱け出せます。事業) 非常に忙しく活動します。有能な協力者を近くに置けば良い結果が得られます。長引いている交渉があれば、タイミングを的確に捉えることが重要です。金運) 小さなものを積み重ねて大きな財を成します。努力すれば多くの財物が得られます。恋愛) 感傷的で遊び的な恋愛をします。感情を抑制しないと損害を被ります。健康) 健康な時期なので軽い病は早く治ります。胃腸病に注意してください。"},
"☳☶":{"no":31,"name":"雷山小過（らいざんしょうか）","text":"運勢) 行き過ぎはかえって足りないより良くないものです。不正を貪らず謙虚に行動すれば平穏に過ごせます。分を守らなければ障害にぶつかります。事業) 小さなことは順調ですが、全体の団結が必要です。新しい事業は規模を縮小し、内部管理に注力しましょう。金運) 予想より収入が少なく出費が多い時期です。浪費を減らしましょう。周囲の甘言に注意してください。恋愛) 互いに疑いがなければ順調です。健康) 摂生に努めてください。"},
"☳☷":{"no":32,"name":"雷地豫（らいちよ）","text":"運勢) 雷が地中から出て震動し、草木が動く状況です。良い時期を迎え、自分の実力が認められるようになります。地位が上がり、新しい希望が見えてきます。事業) 急がず順序を踏んで進めば発展します。内部管理を充実させましょう。新しいことを始めても良い時期です。金運) 大金が入りますが出費も増えます。実質を得るためには無駄を省きましょう。恋愛) 社会的に自信があり、周囲に従う異性が多い時期です。真心を持って行動すれば理想の縁が見つかるでしょう。健康) 身体が健康なので軽い病でも早く回復します。食中毒に注意してください。"},
"☴☰":{"no":33,"name":"風天小畜（ふうてんしょうちく）","text":"運勢) 天の上で風が吹き、今にも雨が降りそうでなかなか降らない状況です。内部事情を十分に考慮し、焦らず時期を待ちながら着実に努力することが重要です。慎重に行動することが有利です。事業) 財運があり相当な利益が生じます。ただし新しいことを拡大するには厳しい時期なので本業に専念しましょう。金運) 小さな財物は容易に入るので日常生活には不自由しません。恋愛) 明るい態度を保ち、相手との雰囲気の一致に努めましょう。縁談の場合、家族の中に反対する人がいることがありますが、時間が経てば解決します。健康) 神経系の疾患が起きやすいです。些細なことでも早めに治療しましょう。"},
"☴☱":{"no":34,"name":"風澤中孚（ふうたくちゅうふ）","text":"運勢) 母鳥が卵を温めて雛を孵すような状況です。誠実に努力すれば万事が順調に進みます。多くの人と関わることや共同事業をするのが特に有利です。事業) 機会を掴んで物事を成し遂げる運勢です。能力以上の良い実りが得られます。取引では誠意を持って臨みましょう。金運) 収入は多いですが出費も多い時期です。周囲に分かち合えば福が返ってきます。恋愛) 気の合う相手と熱烈な交際をします。ただし理性的な判断を失わないように注意しましょう。健康) 血液循環障害に注意してください。"},
"☴☲":{"no":35,"name":"風火家人（ふうかかじん）","text":"運勢) 外で積極的に動く前に、些細なことも怠らず家内のことに専念し、家道を正しく保つべき時期です。親族や家庭内の問題に特に関心を持つ必要があります。人々に徳を施し、言動に注意しましょう。事業) 本業に専念することが最善です。上位者や先輩の意見に従えば利益があります。通常の取引は順調ですが、大きな取引や交渉では実質を得るために努力が必要です。金運) 財物は豊かです。将来への投資をしておくと良いでしょう。恋愛) 気の合う円満な交際ができます。ただし思わぬ競争相手に注意しましょう。健康) 体力維持に励みましょう。過労に注意してください。"},
"☴☳":{"no":36,"name":"風雷益（ふうらいえき）","text":"運勢) 小川が流れて海に至るような状況です。職場では昇進し、農業なら豊年を迎えます。目標を定めて好機が来たら積極的に行動に移しましょう。特に良い協力者の助けで能力以上の結果が得られます。事業) 積極的に活動すれば多くの利益が伴います。ただし内部管理を徹底しなければなりません。金運) 財運が旺盛です。思わぬ横財もあるでしょう。恋愛) 志の合う相手に出会えます。順調な交際ができるでしょう。健康) 肝臓系の疾患に注意してください。"},
"☴☴":{"no":37,"name":"巽為風（そんいふう）","text":"運勢) 草木が柔らかな風に従って揺れる状況です。風は柔順なので物にぶつかると回り込んで止まりません。周囲との調和を優先し、謙虚に行動しましょう。信頼できる上位者や仲間と交わることが大切です。事業) 今まで基盤を固めてきた事業なら大きな発展が期待できます。新規事業や拡大は優れた協力者や上位者の助けを借りて推進しましょう。金運) 目標に全力で取り組めば多くの収入が期待できます。恋愛) 感傷的で浮ついた恋愛をしやすい時期です。縁談が来ても決断しにくいです。上位者の助言を受けることで過ちを防げます。健康) 風邪に注意してください。"},
"☴☵":{"no":38,"name":"風水渙（ふうすいかん）","text":"運勢) 順風に帆を上げた格です。停滞を脱して新しいことを始める転換期で、水面に風が吹くように爽快な気持ちで大きなことを目指せます。事業) 新しい事業を進めれば努力以上の成果が得られます。赤字があれば挽回できます。過去の関係を整理して新しい交渉を始めましょう。金運) 収入と出費が頻繁になります。資金管理は計画的に行いましょう。恋愛) 単なる友人関係から徐々に発展して恋愛ができます。ただし異性問題に執着しすぎないように。健康) 持病も治療すれば回復しやすいです。主治医を変えることも良いでしょう。性的な疾患に注意してください。"},
"☴☶":{"no":39,"name":"風山漸（ふうざんぜん）","text":"運勢) 小さなものを積み重ねて大きなものを成す格です。雁が水辺から岩、木の上へと少しずつ移動するように、木が少しずつ成長するように、段階的な発展をしていきます。着実に努力していれば後に多くの人から羨まれる存在になります。事業) 着実に努力すれば将来の発展が期待できます。順序と手順にしたがって取引をすることが有利です。金運) 徐々に豊かになります。思わぬ利益が生まれることもあります。恋愛) 理想的な相手と祝福された恋愛ができます。結婚を考えている場合は周囲の支持のもと順調に成就します。健康) 消化器系の疾患に注意してください。"},
"☴☷":{"no":40,"name":"風地觀（ふうちかん）","text":"運勢) 日月が天地を広く照らす状況です。地上に風が吹いてくるように周囲を観察し、自分を振り返るべき時期です。包容力を持って他者と協力する姿勢が必要です。社会で人を指導する立場や教育者には特に吉の運勢です。事業) 新しい事業の拡大は慎重に進めましょう。財物への過度な欲は好ましくありません。金運) 適度な財物が生まれます。欲を捨てて努力すれば財物が付いてきます。恋愛) 理想的な交際ができます。ただし結婚を考えている場合は周囲の事情で時間がかかります。健康) 全般的に健康な時期です。食欲不振に注意してください。"},
"☵☰":{"no":41,"name":"水天需（すいてんじゅ）","text":"運勢) 雲が天に上がって雨になり再び降り注ぐのを待つような状況です。雨が地上に降りるまで時間が必要なように、時を待たなければなりません。焦らず心を広く持てば大きな成功が得られます。事業) 将来は有望ですが、まず周囲の環境と基盤を確認する必要があります。交渉や取引は焦らず適切な時機を待てばかえって順調になります。金運) 日常生活には支障ありません。恋愛) まず生活の安定を得ることが順調な交際につながります。時間が経てば良い伴侶に出会えるでしょう。健康) 全般的に健康ですが注意が必要な部分もあります。"},
"☵☱":{"no":42,"name":"水澤節（すいたくせつ）","text":"運勢) 四季がそれぞれの時を違えないように、目指すことを達成するには順理と節制が必要です。溢れず欠けない安定した態度が大切です。事業) 小さな事業は着実に努力すれば相当な利益が得られます。大きな事業は慎重に進めなければ失敗します。取引では過度な欲を持って臨まず、相手の利益を先に認めましょう。金運) 財物が豊かでも貯蓄は怠らないように。不必要な出費が多い時期です。恋愛) かなり深い関係で簡単には離れられないことが多い時期です。長続きする恋愛をしています。結婚に適した時期です。健康) 飲酒過多に注意してください。"},
"☵☲":{"no":43,"name":"水火旣濟（すいかきせい）","text":"運勢) 明君が賢臣に出会い、状況が思い通りになる安定感と満足感を得られる時期です。しかし月が満ちれば欠けるように、将来への備えも必要です。事業) 事業は大きな好況に恵まれます。ただし現状維持に注力し、過度な拡大は避けましょう。金運) 財運が旺盛です。収入をよく管理して次に備える知恵が必要です。恋愛) 理想的な相手に出会えます。互いの精神的な絆を育みましょう。健康) 全般的に健康な時期です。軽い病でもすぐに治療するのが良いでしょう。"},
"☵☳":{"no":44,"name":"水雷屯（すいらいちゅん）","text":"運勢) 凍りついた大地の上で新芽が春を待っている姿です。陰陽が和合して新しい生命を誕生させる過程のようです。まだ完全な時ではないので、他者の助けを借りながら実力を蓄えましょう。事業) 浮き沈みはありますが他者の助けを得れば良くなります。希望を持って着実に努力すれば良い実りがあります。金運) 不自由はない状態です。投資した資金が期限通りに回収できないことがあります。恋愛) 迷いのある状態です。互いの立場や環境が違って直ぐには結びつきにくいことがあります。急がず焦らず対処しましょう。健康) 神経系の疾患に注意してください。"},
"☵☴":{"no":45,"name":"水風井（すいふうせい）","text":"運勢) 井戸から水を汲み上げる姿で、困難があっても時間が経つにつれて希望が生まれます。新しいことを始めず、今まで通りのことを守るのが有利です。職分を守って着実に努力すれば福が自ずと生まれます。事業) 本業を守り、内部管理を充実させましょう。新しいことには危険が伴うので目標を明確にしておくことが大切です。金運) 出費が多い時期です。浪費を控えましょう。恋愛) 新鮮な刺激が必要です。精神的に親密な間柄であれば倦怠感は克服できます。健康) 過労に注意してください。"},
"☵☵":{"no":46,"name":"坎為水（かんいすい）","text":"運勢) 外は空虚でも内は充実した状況です。誠実な心と健全性を持てば困難が生じても平穏に過ごせます。宗教や学問、研究に打ち込めば実力を良い方向に発揮できます。他者と争わないようにしましょう。事業) 積極的に拡大するよりもまず内部管理に徹しましょう。書類関係は明確に処理し、保証人になることは控えましょう。金運) 浪費に気をつけましょう。収入より出費が多い時期です。恋愛) 深い愛情に落ちやすい時期です。異性問題に執着しすぎると良い運を損ねます。感情の抑制が必要です。健康) 体力を消耗しやすいです。摂生に励みましょう。"},
"☵☶":{"no":47,"name":"水山蹇（すいざんけん）","text":"運勢) 安全な道を選び、優れた協力者を得れば険しくても留まることで平安になります。無謀な勇気や冒険は禁物です。周囲をよく観察し慎重に行動しましょう。事業) 焦らないようにしましょう。安全で考え抜かれた道を選ぶことが大切です。投資には慎重にならなければ損害が出ます。金運) 小銭は入りやすく大金が出る恐れがあります。出費管理が必要です。恋愛) 複雑な状況です。誠実でない交際は早めに清算するのが良いでしょう。消極的な態度が有利です。健康) 消化器系の疾患に注意してください。"},
"☵☷":{"no":48,"name":"水地比（すいちひ）","text":"運勢) 地上に水があり、土と水が親しみ合う状況です。徳があり信頼できる人と交われば願いが叶います。競争が激しい時期なので良い機会を他者より先に推進し、協力者の助けを積極的に求めましょう。事業) 良い協力者を得れば事業を順調に発展させられます。金運) 所有している財物は多くないかもしれませんが、助けてくれる人が現れます。恋愛) 吉です。ただし周囲に異性が多いため心の決断がしにくいです。縁談がきても結婚までには少し時間がかかります。健康) 慢性的な疾患に注意してください。"},
"☶☰":{"no":49,"name":"山天大畜（さんてんたいちく）","text":"運勢) 天の気が山に降り注ぎ草木が盛んに育つ状況です。今まで培ってきた実力を基に未来への行動指針を定めて着手しましょう。外で働くより内から外へ出ることが有利で、着実に努力する分野や公職に就けば発展が保証されます。事業) 焦らず順序を踏んで基礎を固めれば大きな利益が得られます。相手の態度が消極的でも後退せず積極的に取引を推進しましょう。金運) 財運が旺盛で実力次第で大きな資金が入ります。恋愛) 誠実で真摯な恋愛をします。良い縁と出会う時期なので積極的に動くことが大切です。健康) 過労に注意してください。"},
"☶☱":{"no":50,"name":"山澤損（さんたくそん）","text":"運勢) 土を掘って水を求めるより、将来のより大きな実りを求めることが賢明です。最初は苦労や損失があっても相手を喜ばせ大きな志のために惜しみなく奉仕することで結果が得られます。事業) 新しい事業を始めると最初は困難があっても将来は有望です。焦らず着実に進めましょう。今は損のように見えても、着実に努力すれば良い結果が出ます。金運) 出費が多い時期なので金銭管理に注意が必要です。後に豊かになるでしょう。恋愛) 誠実な恋愛をします。良い縁と出会えるでしょう。健康) 体力強化に努めましょう。節制した生活が大切です。"},
"☶☲":{"no":51,"name":"山火賁（さんかひ）","text":"運勢) 夕焼けの残光が世界を赤く照らすような状況です。冷静な理性より感傷と想像に浸ってしまいがちです。外見を重視するようになりやすい時期ですが、分相応の生活をして実質を求めましょう。事業) 見た目重視の事業は危険を伴います。小規模な事業は順調に進みます。相手の利益も考慮することが重要です。金運) 小さな財物は容易に入ります。贈り物をもらう機会が増えます。恋愛) 相手に真心で接することが失敗を防ぎます。見た目にとらわれていると損をしやすいです。健康) 節制した生活をしなければ病が生じやすいです。性病に注意してください。"},
"☶☳":{"no":52,"name":"山雷頤（さんらいい）","text":"運勢) 龍が澄んだ水中に入るように、日常生活で誤りがあれば正すべき時期です。新しいことを計画したり職を得るのに適した時期です。分相応に誠実に取り組み、志の合う仲間を見つけて共に働けば良い結果が得られます。事業) 仲間の助けを得て段階的に進めれば多くの利益が得られます。取引での合意は容易に成立します。余計な言葉で損をしやすいので言動に注意しましょう。金運) 生活に不自由はありません。過度な期待は禁物です。恋愛) 精神的に一致する相手と交際できます。経済問題など周囲の問題をうまく解決する必要があります。健康) 健康を怠ると病が生じやすいです。消化不良に注意してください。"},

"☶☶":{"no":55,"name":"艮為山（ごんいさん）","text":"運勢) 今やっていることを守り、自分の分を弁えるべき時期です。山が一か所に留まるように不動心で節操を守り、良い時期が来るのを待ちましょう。軽率に動くより将来のために実力を蓄えることが上策です。時と場所に合わせて進退を分別しましょう。事業) 二つのことを同時に進めるより一つに集中することが有利です。力の分散を防ぎましょう。積極的に取引する前に相手をよく観察しましょう。金運) 現金は豊かではありません。恋愛) 気負いのない友人関係か精神的な出会いです。趣味や精神的な交流が基本です。健康) 摂生に努めてください。"},
"☶☷":{"no":56,"name":"山地剝（さんちはく）","text":"運勢) 高い山が風雨にさらされている状況です。今まで取り組んできたことを再点検しましょう。新しいことを始める場合は事前の十分な準備で失敗のないようにしましょう。冬が過ぎて春を待つように、心身を引き締めて良い時期が来るのを待ちましょう。事業) 拡大よりまず内部管理を充実させましょう。相手をよく把握してから取引に臨みましょう。金運) 周囲のことで不必要な出費が多い時期です。浪費は禁物です。恋愛) 周囲に異性が多くても真剣さのない縁ならば早めに清算する方が良いでしょう。健康) 持病がある場合は治療が必要です。体力消耗に注意してください。"},

"☷☱":{"no":58,"name":"地澤臨（ちたくりん）","text":"運勢) 魚と龍が広い海や川に出会ったような格です。春夏に陽気が旺盛になるように活躍が期待される時期です。新しいことを始めることも良いですが、慎重に行動しましょう。変化の時期は周囲の協力者と力を合わせ、決断力と機動力が必要です。事業) 新しい事業に着手すれば順調に進みます。ただし慎重さが必要です。取引と交渉では強硬策より穏和策が有利です。金運) 余裕があります。ただし贅沢に流れやすいので出費は慎重に。恋愛) 華やかで甘い恋愛ができます。良い縁と出会う時期なので成就するよう努力しましょう。健康) 健康なので些細な病でも早く回復します。軽い症状を病と勘違いしやすいです。"},

"☷☳":{"no":60,"name":"地雷復（ちらいふく）","text":"運勢) 冬が過ぎて暖かい春が再び訪れた格です。新しいことを始めることができる自信と能力が生まれます。有望な事業が見つかれば着実に努力する姿勢が重要です。ただしまだ焦って進めてはいけません。近いところから始めて徐々に広げていくことが大切です。事業) 徐々に活気を帯びてきます。ただし軽率に複数のことを始めると実益が少ないでしょう。金運) 日常生活には支障ありません。商業に携わる人は資金繰りが思い通りにならないことがあります。恋愛) 周囲に異性は多いですが友人レベルの交際に留まりやすいです。再婚や復縁を考えている場合には意義のある運勢です。健康) 持病があっても回復できるでしょう。胃腸系に注意してください。"},
"☷☴":{"no":61,"name":"地風升（ちふうしょう）","text":"運勢) 小さなものを積み重ねて大きなものを成す格です。能力が認められ、徐々に志を展開できるようになります。若木が芽吹いて大きな木に育つように段階的な発展があります。努力すれば必ず目標が達成できます。事業) 新しい計画や契約に着手するようになります。すぐに大きな利益を期待することはできませんが、運勢が旺盛なので積極的に動けば良い結果が得られます。少ない元手で大きな収益が得られるでしょう。金運) 努力に見合った対価が期待できます。収入は徐々に増加します。恋愛) 長い縁ならばさらに親密になります。良い縁です。健康) 消化器系の疾患に注意してください。"},
"☷☵":{"no":62,"name":"地水師（ちすいし）","text":"運勢) 地中に水がある状況です。地下水が地上に出て万物に供給されることで価値を発揮するように、多くの人を率いることになります。競争が激しくなったり混乱が生じたりしたときは適切な姿勢を取り、誠実に対応すれば福が伴います。事業) 本業を守れば利益があります。新しいことを始める際は内部の団結を先に図りましょう。取引は積極的に進めることが有利です。金運) 日常生活に不自由しない程度の財物が生まれます。個人的な事業より公的な事業に重点を置けば利益が多いです。恋愛) 現実的な生活が優先で多少の無理があります。健康) 慢性疾患から生じる病気に注意が必要です。健康のための時間を持つことが大切です。"},
