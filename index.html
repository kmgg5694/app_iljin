"Feng signifies abundance and rich fullness. Celestial Guidance) The way is to move away from darkness and advance toward the light. When the sun stands at its zenith, the world is bright and radiant. Likewise your fortune is strong and vigorous — a rich harvest of results may be expected. Yet just as the full moon begins to wane, even outward vigour conceals the gradual weakening of inner forces. If there is any matter that has been dragged on for a long time, bring it swiftly to a conclusion. The decisiveness and resourcefulness to handle affairs with speed and clarity are required. Enterprise) Progress is smooth. Yet rather than launching new ventures, it is more important to manage soundly the enterprise that has already flourished. Faithful internal management is essential. Moving quickly to reach decisions in dealings with others proves advantageous. Do not act rashly on the strength of a vigorous fortune. Wealth) The fortunes of wealth are vigorous. Yet expenditure on outward show and luxury must be restrained. Savings put aside now shall serve you well. Romance) There is a tendency toward material, superficial and pleasurable relationships. Do not be dazzled by the outward splendour of the other party — perceive the inner nature and true sincerity to guard against failure. For those planning marriage, resolve the practical and domestic matters first for smooth progress. Vitality) As this is a period of frequent change, regular attention to nourishment and health management is essential. Guard against epidemic illness and acute ailments."}, "☳☳": {"no": 28, "name": "Zhen — Thunder over Thunder (震為雷)", "text": "Zhen signifies thunder — the great rumble that shakes the four quarters. Celestial Guidance) As thunder reverberates and shakes everything in all directions, if you establish your aims firmly and exert yourself, your purpose shall be attained smoothly. Yet just as thunder makes a great noise but lacks real substance, first fix your goals and make your plans with certainty and clarity. Cultivate yourself and reflect inward. If difficulty arises, do not act rashly — seek the assistance of a superior or a trusted colleague. Enterprise) There is a tendency to pursue two ventures simultaneously. Yet if plans are too grandiose and energies become scattered, real benefit becomes difficult to obtain — take care. In dealings with others, bring a long-range perspective rather than focusing on immediate gain. Rivals tend to appear, making it necessary to proceed with your affairs with a degree of discretion. Wealth) There is fortune in wealth, though it does not arrive all at once. It shall unfold gradually. Romance) A lively and excitable relationship tends to develop. If there is a lack of earnest depth between the two parties, hopes of marriage may prove difficult to realise. Vitality) Take care of liver-related ailments."}, "☳☴": {"no": 29, "name": "Heng — Thunder over Wind (雷風恒)", "text": "Heng signifies constancy — unwavering steadiness through all seasons. Celestial Guidance) As the sun and moon perpetually illuminate the world with their light, maintaining the rhythm of ordinary life yields stability and joy. Days of peaceful ease shall arrive. A person of wisdom does not easily abandon their proper place, but follows the virtue of enduring constancy. Maintain patience and persevere steadily. The routine of life may bring a certain weariness, a desire for change, and a sense of frustration — yet hold fast to firm and settled convictions and do not allow emotion to sweep you away. Keep your mind upright and true — only so shall you find benefit. Honour your family and build the virtue of broad generosity. Enterprise) Excessive expansion or new plans are not favourable. Manage faithfully and steadily the enterprise you have built until now. This is a time when real substance is quietly accumulating beneath the surface — steady effort allows progress to be expected. Conducting negotiations from a long-range perspective is advantageous. Established affairs proceed smoothly. Wealth) The fortunes of wealth are good; funds are plentiful and you face no pressing constraints. Romance) A steady and harmonious relationship unfolds. A long and lasting bond may develop. Moving toward marriage involves slight difficulty, but once accomplished, the result is fine. Vitality) A regulated and disciplined life is what keeps illness away. Take care against back ailments."}, "☳☵": {"no": 30, "name": "Jie — Thunder over Water (雷水解)", "text": "Jie signifies release and resolution — the dissolution of what has been frozen and bound. Celestial Guidance) Like the ice that was locked fast through winter melting as the warm spring arrives, you shall find fine allies and engage in fresh and vigorous activity. Matters that have been blocked or difficult until now shall begin to resolve themselves. In this season, activity is the means of escaping hardship — set your goals clearly. If you become indolent, fine fortune shall be squandered. In your endeavours, the south-west direction is favourable; proceeding there, you shall encounter partners who help you achieve your aims. The number of those who gather around you increases. When there is no pressing reason to move or act, seek stillness and concentrate on improving your abilities — this is the wiser course. Even when the other party has committed a fault, deal with them with magnanimity and generosity. Enterprise) Activity is intense and busy. Drawing close to resourceful and capable allies shall yield fine results. Those employed in organisations may see a change of position or workplace. In negotiations that have been slow to progress, documents and timing must be handled with precision. Wealth) Small things accumulated lead to great abundance. Effort shall bring in great material reward. Romance) A sentimental and playful romance tends to unfold. Restraint of emotion is necessary to avoid being harmed. Above all, sincerity is essential. Vitality) This is a healthy period; minor ailments recover swiftly. Take care of gastrointestinal disorders."}, "☳☶": {"no": 31, "name": "Xiao Guo — Thunder over Mountain (雷山小過)", "text": "Xiao Guo signifies slight excess — going just a little too far beyond the proper measure. Celestial Guidance) Excess is worse than deficiency. Acting with humility and without coveting what is improperly yours allows for peace and ease. Those who do not observe their proper boundaries must hold themselves in check. Drawing close to petty people brings loss easily. Enterprise) Small matters proceed smoothly as desired, but unity of spirit among people is needed. Arrogance must be absolutely avoided. New ventures should be reduced in scale; concentrate your energies on internal management. Wealth) Income tends to be less than expected while expenditure is greater. Reduce extravagance and waste. Be wary of the honeyed words of those around you. Romance) Where there is mutual sincerity and absence of suspicion, the way shall be smooth. Vitality) Attend to nourishment and physical maintenance."}, "☳☷": {"no": 32, "name": "Yu — Thunder over Earth (雷地豫)", "text": "Yu signifies anticipation and preparation — joyful readiness for what is to come. Celestial Guidance) Thunder emerges from within the earth and shakes the world — causing all vegetation to stir and move. Likewise, having met a fine season, your real abilities shall receive their due recognition. Your position shall rise and new hope shall appear before you. Just as a leader who sets firm plans is followed willingly by those beneath without complaint, prepare thoroughly for what you wish to pursue and lay clear plans — the road ahead shall be wide and open. Setting aside arrogance and judging the surrounding circumstances with care before you move shall make your results even more solid. Amid the outward splendour, to find the real substance requires clear planning and the additional virtue of humility — and then without fail, joy shall follow. Enterprise) Proceeding in order without haste shall bring development. Attend faithfully to internal management. This is also a fine season to embark on new work. Negotiations shall proceed smoothly. Wealth) Large sums arrive, but expenditure also increases. To secure real gains, waste must be reduced. Romance) You hold social confidence and many women are drawn around you. If you remain watchful and keep a sincere heart, you shall find your ideal destined partner. Romance tends to be emotionally vivid and splendid; meetings are frequent and joyful. Yet if the atmosphere causes you to relax your guard and lose yourself in the mood, unexpected errors may follow. This is a fine time to consider marriage. Vitality) As the body is healthy, even minor ailments recover quickly. Take care against food poisoning."}, "☴☰": {"no": 33, "name": "Xiao Xu — Wind over Heaven (風天小畜)", "text": "Xiao Xu signifies small accumulation — gathering and building gradually. Celestial Guidance) The wind blows above the heavens as though rain is about to fall, yet the rain does not come easily. All things have their season of full flourishing — like the earth waiting to be deeply moistened, that season shall arrive. Consider your inner circumstances thoroughly; haste is not to your benefit. Wait for the right time and persevere steadily. Careful and considered action rather than recklessness is advantageous. Build your abilities, await the fine season, and what you seek shall be attained. Enterprise) The fortunes of wealth are present and no small measure of gain shall appear. Yet this is not the time to expand into new ventures — devote yourself faithfully to your present work. Negotiations and dealings tend to be delayed, and it often happens that you find yourself waiting for the other party's response. Wealth) Small sums flow in easily, so daily needs are not lacking. Savings are possible though expenditure is also considerable at this time. Romance) Maintain a bright and cheerful demeanour and strive to achieve a harmony of feeling with your partner. In the case of marriage negotiations, someone within the family may oppose the union, requiring some time for smooth progress. Yet in time the matter shall resolve itself smoothly. First strive to achieve a genuine spiritual unity between the two of you. Vitality) Nervous ailments tend to arise. Even minor illness should receive prompt treatment."}, "☴☱": {"no": 34, "name": "Zhong Fu — Wind over Lake (風澤中孚)", "text": "Zhong Fu signifies inner sincerity — truth and faith held at the very centre of the heart. Celestial Guidance) Like a mother bird brooding over her eggs until the young are hatched, sincere and devoted effort shall cause all things to proceed smoothly. Ventures involving many people or joint enterprise are particularly favourable. Students and those who work with documents shall receive admiration from many. Enterprise) This is a season in which you seize the moment and achieve what you set out to do. You shall attain results that exceed your abilities. Proceed with sincerity and genuine commitment in all dealings. Wealth) Income is considerable, though expenditure is also great at this time. Setting aside excessive attachment to wealth and generously sharing with those around you shall cause the blessings to return to you many fold. Romance) You shall enter into passionate fellowship with one whose heart is in accord with yours. Yet take care not to lose the power of rational judgement. For those planning marriage, the way shall proceed smoothly. Vitality) Take care of circulatory disorders."}, "☴☲": {"no": 35, "name": "Jia Ren — Wind over Fire (風火家人)", "text": "Jia Ren signifies the family — those who dwell together in the household. Celestial Guidance) As one enters clear waters to seek the pearl and ventures outward with purpose, do not neglect even small things — devote yourself faithfully to the affairs of the household and hold the way of the family upright and proper. Pay special attention to matters involving relatives and the home. As blossoms fall and fruit is set, a strong desire for new things or fresh endeavours may arise. Yet preserving your present path and finding contentment within your station is itself a form of joy. Extend virtue to others and guard your words and conduct carefully. Enterprise) It is best to remain devoted to your present work. Embarking on other ventures requires thorough planning. Following the counsel of superiors or senior companions brings benefit. Everyday dealings proceed smoothly. In large-scale transactions and negotiations, however, strenuous effort is needed to secure real gains. Partnership brings no loss. Wealth) Material resources are plentiful. Investing for the future now would be beneficial. Romance) A harmonious relationship with a good heart-to-heart accord unfolds. Yet beware of unexpected rivals. The fortunes of romance are greatly auspicious — a fine destined partner shall be encountered. Vitality) Attend to maintaining physical strength. Guard against fatigue."}, "☴☳": {"no": 36, "name": "Yi — Wind over Thunder (風雷益)", "text": "Yi signifies increase and benefit — advantage flowing and growing in all directions. Celestial Guidance) Like a stream flowing unceasingly to reach the sea at last, those in employment shall receive promotion and those who till the land shall welcome a year of abundant harvest. Once your goal is set and a fine opportunity arrives, move into action without hesitation. The assistance of a fine ally in particular shall bring results that exceed your own abilities. What is right, carry out without delay; what is wrong, correct with bold determination. Endeavours tied to the public good are especially auspicious. There is one matter you must not act upon rashly. Those who have accumulated virtue in good measure shall find that blessings overflow in abundance. Enterprise) Vigorous activity brings great gain. Yet faithful internal management is essential to avoid failure. Negotiations and dealings shall also proceed smoothly. Do not allow yourself to be touched by improper matters. Wealth) The fortunes of wealth are vigorous. Unexpected windfall is also a possibility. Romance) You shall meet one whose aspirations accord with yours. A harmonious and smooth relationship shall develop. Vitality) Take care of liver-related conditions."}, "☴☴": {"no": 37, "name": "Xun — Wind over Wind (巽為風)", "text": "Xun signifies the wind blowing gently — soft, yielding and persistent. Celestial Guidance) Like trees and plants swaying with the gentle wind, the wind is yielding in nature — when it meets an obstacle it moves around it and does not easily stop. Likewise, give first priority to harmony with those around you and conduct yourself with humility. Drawing close to trustworthy superiors or colleagues is favourable. Small matters shall proceed as you wish and form well, though the mind may become unsettled like the wind and indecision may arise. Be wary of the honeyed words of petty people and hold firm resolve within. Enterprise) If this is an enterprise whose foundations have been steadily built up until now, great development may be expected. New ventures or the expansion of existing ones should be driven forward with the assistance of a fine ally or superior. Proceed swiftly in dealings and negotiations. Know the other party well and be wary of their honeyed words. Profit shall flow to you from various directions, like the wind moving here and there. Wealth) Concentrating your energies fully on your objective allows for great income. There is benefit in honest and familiar work. Cultivate self-reliance and the capacity for independence. Romance) There is a tendency toward sentimental and excitable romance. Marriage proposals arrive though a firm decision is difficult to make at this time. The counsel of a superior is needed to avoid error. Vitality) Take care against colds."}, "☴☵": {"no": 38, "name": "Huan — Wind over Water (風水渙)", "text": "Huan signifies scattering and dispersal — things dissolve and open up freely. Celestial Guidance) Wind fills the sails and drives the boat forward. This is a turning point — emerging from stagnation and moving toward fresh new undertakings. As wind blows over water with a refreshing clarity, great ventures may be pursued with a light and open spirit. Your enterprise begins to take on new vitality and the burden of inner anxiety is lifted. Rather than small matters, plan toward what is great and new. Set your goals firmly and strive with a sound and earnest heart. This Sacred Hexagram also carries the meaning of things scattering — take note. Enterprise) Pursuing a new enterprise yields results that exceed your effort. Where there have been losses until now, recovery is possible. Drawing close to fine allies and superiors shall make the way even smoother. Previous relationships are cleared away and new negotiations commenced. First, the thorough gathering of information is vital. Wealth) Income and expenditure are both frequent. Manage funds in a planned and measured manner. Neglecting financial management may give rise to unwanted talk. Romance) What begins as simple friendship gradually develops and deepens into romantic love. Yet do not become excessively attached to matters of the heart — there is risk of squandering good fortune. Vitality) Even long-standing illness recovers with proper treatment. Changing your physician may prove beneficial. Take care against ailments of a sensitive nature."}, "☴☶": {"no": 39, "name": "Jian — Wind over Mountain (風山漸)", "text": "Jian signifies gradual advance — proceeding step by steady step. Celestial Guidance) Great things are built by the accumulation of small ones. Like a young goose moving from water to rock to tree-branch, like a tree growing little by little — gradual and steady progress shall be your way. Proceeding rashly and recklessly is not good. Persevering step by careful step, you shall eventually become the object of the admiration and longing of many. Hold your mind upright and true — only so shall benefit come to you. Enterprise) Steady perseverance gives cause to expect future development and growth. Following the proper order and procedure in dealings is advantageous. Wealth) Abundance shall gradually accumulate. Unexpected gain may also arise. Romance) You shall engage in a blessed romance with an ideal partner. For those planning marriage, the support of those around you shall allow the matter to proceed smoothly and happily. Vitality) Take care of ailments of the digestive system."}, "☴☷": {"no": 40, "name": "Guan — Wind over Earth (風地觀)", "text": "Guan signifies observation — watching and perceiving with careful and clear attention. Celestial Guidance) As the sun and moon illuminate all beneath the vast sky, just as the wind blowing across the earth calls us to observe our surroundings and reflect upon ourselves — particularly in matters of learning — viewing the world through an overly idealistic lens is not a sound posture. The disposition of embracing openness and cooperating with others is what is needed. Living humbly and accumulating virtue in ordinary life shall cause blessings to come of their own accord; yet there is also that which cannot simply be received passively. Those who lead others in society or those who are educators find this to be a particularly auspicious season. Enterprise) New expansion requires careful deliberation. First, clear and cool-headed judgement and powers of observation are essential. Excessive covetousness of wealth is not desirable. If your own judgement is unclear and you lose your bearings, loss shall follow. Wealth) A moderate degree of material good shall arrive in due course. Setting aside greed and striving earnestly causes wealth to follow naturally. Romance) An ideal relationship unfolds. Yet for those thinking of marriage, circumstances around you may cause it to take time. However, if the woman in question holds a stable occupation, matters shall proceed smoothly. A spirit of masculine resolve and initiative is what is needed. Vitality) Generally a healthy period. Take care of appetite and digestion."}, "☵☰": {"no": 41, "name": "Xu — Water over Heaven (水天需)", "text": "Xu signifies awaiting — the patient waiting upon the right and appointed time. Celestial Guidance) Like clouds ascending to the heavens, to become rain and descend again — the cycle requires time. Just as rain needs its proper time to fall to the earth, you must await your season. Do not allow anxiety to rule you; a magnanimous and generous spirit is what leads to great success. Watch for the appropriate opportunity and accumulate virtue in the meantime. Holding your mind upright and clear shall bring fine results before long. Wherever you go, success shall ultimately be yours. Enterprise) The future is promising, yet you must first examine your surroundings and your foundations carefully. In negotiations and dealings, rather than growing anxious, awaiting the right moment shall in fact make things proceed more smoothly. Rushing impatiently may give rise to dispute. Wealth) Daily life is without discomfort. Romance) First establishing stability in daily life leads to smooth and harmonious relations. Your partner may be going through a period of difficulty at present. Yet they are one whose future development and growth may be expected. On the other hand, there is considerable possibility that your partner's attention or intentions lie elsewhere — it is wise to explore several potential matches. With the passage of time, a fine companion shall be found. Vitality) Generally sound, though certain conditions may require careful attention."}, "☵☱": {"no": 42, "name": "Jie — Water over Lake (水澤節)", "text": "Jie signifies moderation and discipline — the proper measure that governs all things. Celestial Guidance) Just as each of the four seasons arrives without ever betraying its appointed time, the accomplishment of what you seek requires the natural order and the spirit of discipline. An attitude of neither excess nor deficiency — stable and measured — is the ideal. When discipline becomes too severe, progress is impeded; hold to your principles as your guide and handle all things in accordance with natural order. Blessings shall follow in your wake. Enterprise) Small ventures, pursued faithfully and steadily, shall bring considerable gain. Large ventures, however, must be pushed forward with caution to avoid failure. In dealings and negotiations, do not approach them with excessive desire. First acknowledge the interests and intentions of the other party — only then shall things proceed smoothly. Wealth) Even when material wealth is plentiful, savings must be maintained. Unnecessary expenditure tends to be considerable at this time. Romance) The relationship has developed to a considerable depth, making parting difficult. A lasting and enduring love unfolds. This is a fine time to consider marriage. Vitality) Take care of the effects of excessive drinking."}, "☵☲": {"no": 43, "name": "Ji Ji — Water over Fire (水火旣濟)", "text": "Ji Ji signifies that which is already accomplished — all things have already been brought to completion. Celestial Guidance) A wise sovereign meets a virtuous minister; circumstances unfold as hoped, and a deep sense of stability and satisfaction pervades all things. Yet just as the full moon begins to wane, the wisdom to prepare for what is yet to come is also necessary. After achieving what you have set out to do, bring matters to a thorough conclusion and attend faithfully to internal management. Direct your energies increasingly toward preserving the present state of affairs. Enterprise) The enterprise enjoys extraordinary prosperity. Yet concentrate your energies on maintaining the present state and avoid excessive expansion. Partnership is also auspicious, though divergence of opinion tends to arise easily — appropriate concession and accommodation are necessary. Wealth) The fortunes of wealth are vigorous. Manage income carefully and prepare wisely for the future. Romance) An ideal partner appears. Deepen the spiritual intimacy between you. Vitality) Generally a healthy period. Even minor illness should be treated promptly at its first appearance."}, "☵☳": {"no": 44, "name": "Zhun — Water over Thunder (水雷屯)", "text": "Zhun signifies the process of growth — a living thing struggling to emerge and establish itself. Celestial Guidance) Like a new sprout waiting beneath the frozen earth for the warmth of spring, this is an image of yin and yang harmonising to bring forth new life. The time is not yet fully ripe — receive the assistance of others while steadily building your real abilities. Do not move forward blindly; wait for the moment when your aspirations may truly be deployed. Even amid slight difficulties, holding to hope and persevering steadily shall bring your desires to fulfilment. When others ask for your help, offer it freely — what you give in this way shall return to you as blessing. Acting alone makes it difficult to achieve results; therefore seek fine allies in cooperation. Enterprise) There are ups and downs, but the assistance of others brings improvement. Hold to hope and persevere steadily — fine results shall follow. In order for negotiations and dealings to proceed as desired and without friction, do not rush but advance with careful deliberation. Wealth) Not lacking. However, funds invested may not be recoverable at the proper time. Romance) A state of hesitation and indecision prevails. The different circumstances or environments of the two parties may make an immediate union difficult. In order to meet a fine partner, do not be hasty. Rather than advancing eagerly, meet circumstances with a relaxed and composed manner. Vitality) Take care of nervous conditions."}, "☵☴": {"no": 45, "name": "Jing — Water over Wind (水風井)", "text": "Jing signifies the well — an unfailing source of nourishment drawn up from deep within the earth. Celestial Guidance) The image of drawing water from the well: though there may be difficulties at the start, hope grows steadily with the passing of time. Rather than pursuing new ventures, it is advantageous to guard and maintain what you have been doing until now. Keeping faithfully to your proper station and striving with steady earnestness shall cause blessings to arise naturally. Maintain cooperative bonds with those around you and dispense virtue with a broad and open spirit. Enterprise) Guard your present work faithfully and attend carefully to internal management. New ventures carry risk — fix your objectives clearly in advance to avoid loss. Wealth) Expenditure is considerable at this time. Reduce extravagance and waste. Romance) Fresh stimulation is needed. If the spiritual bond between the two of you is deep and genuine, the weariness of familiarity may be overcome. Vitality) Guard against fatigue."}, "☵☵": {"no": 46, "name": "Kan — Water over Water (坎為水)", "text": "Kan signifies water flowing ever onward — the perpetual movement through layers of depth and difficulty. Celestial Guidance) The outer form appears empty, yet the inner reality is solid and full. With a sincere heart and sound reliability, even if difficulties arise they shall pass through smoothly. At times the mind may lose its equilibrium and become scattered — yet through devotion to religion, scholarship or research, your inner capacities may be developed and cultivated in a positive direction. Do not engage in quarrels with others — the fear of unwanted gossip is real. Extend virtue broadly and live with sincerity and diligence. Acting in harmony with the proper season, you shall advance and accomplish your aims. Enterprise) Rather than expanding your activities aggressively, first attend faithfully to internal management. Document-related matters must be handled with absolute clarity. Do not stand surety for others. When entering into negotiations, first assess the strengths and weaknesses of the other party to avoid loss — unexpectedly smooth progress may also occur. Wealth) Beware of extravagance and waste. Expenditure tends to exceed income at this time. Romance) There is a tendency to fall deeply into passionate attachment. Excessive fixation on matters of the heart risks squandering even fine fortune. Restraint of emotion is necessary. Vitality) Vitality tends to be dissipated easily. Attend to nourishment and physical care."}, "☵☶": {"no": 47, "name": "Jian — Water over Mountain (水山蹇)", "text": "Jian signifies caution — avoiding reckless action and seeking safety and security. Celestial Guidance) Choose the safe course and secure fine allies — facing even what is difficult and hazardous with composed patience, remaining where you are brings peace and security. Reckless courage and adventure are not to be pursued. Observe your surroundings and act with careful circumspection. In your endeavours, the south-west direction is favourable while the north-east is not. When you encounter a person of great virtue and influence, assistance shall be forthcoming — hold your mind upright and true. Enterprise) Do not be hasty. Choose the path that is safe and considered. Careful deliberation in all investments is essential to avoid loss. Reflect upon yourself and accumulate virtue. Wealth) Small sums come in while there is risk that large sums flow out. Careful management of expenditure is necessary. Romance) The situation is complex. Relationships lacking in genuine earnestness are best cleared away promptly. A reserved posture proves advantageous. Guard carefully against entanglements with the opposite sex. Vitality) Take care of digestive ailments."}, "☵☷": {"no": 48, "name": "Bi — Water over Earth (水地比)", "text": "Bi signifies closeness and affinity — mutual belonging and warm fellowship between kindred souls. Celestial Guidance) This Sacred Hexagram shows water lying upon the earth — soil and water standing in close and intimate relation to each other. Likewise, drawing close to those of genuine virtue and reliability allows your aspirations to be realised. Deepen your fellowship with fine people in a manner befitting your own standing. As competition is intense at this time, you must pursue fine opportunities ahead of others and seek the assistance of allies with active determination. Sincere effort allows hope for a bright tomorrow. Extend broad virtue to those around you and strive earnestly for harmony. Enterprise) Securing fine allies allows your enterprise to advance smoothly. With vigorous fortune, great income shall be realised. In negotiations and dealings, act with self-confidence and move before your rivals. Wealth) The wealth in your possession may not be great, but people who offer assistance appear. Romance) Auspicious. Yet because many of the opposite sex surround you, it is difficult to arrive at a clear decision of the heart. On the other hand, guard against entanglements with the opposite sex. Association with just anyone indiscriminately is by no means a good thing. Even if marriage proposals come and go, arriving at marriage itself may take a little time. Hold a sincere heart. Vitality) Take care of chronic ailments."}, "☶☰": {"no": 49, "name": "Da Xu — Mountain over Heaven (山天大畜)", "text": "Da Xu signifies great accumulation and storage — gathering abundantly and building reserves. Celestial Guidance) Heaven's energy descends into the mountain and lush vegetation grows in abundance. Drawing on the abilities you have cultivated steadily until now and the wisdom of experience, determine your course of future action and set about it with resolution. Even if difficulties arise, with perseverance and effort alone the road ahead shall be clear and open. Working from within rather than venturing outward is advantageous; those engaged in a steady and devoted field of endeavour or those in public service find their advancement assured. As a tiger roars within the mountains and all the beasts are startled in awe. Enterprise) Without haste, laying your foundations step by careful step shall yield great gain. Careful management of material wealth shall cause the enterprise to flourish. Even if the other party's attitude is lukewarm, do not withdraw — push forward actively in dealings. Yet do not become excessively forceful. Wealth) The fortunes of wealth are vigorous; depending on your abilities, large sums may flow in. In the process of accumulating material resources, effort is what matters most. Romance) A sincere and genuine love unfolds. Yet practical and domestic matters may arise to consider. This is a time to meet a fine destined partner — it is advantageous to step forward actively. Vitality) Guard against fatigue."}, "☶☱": {"no": 50, "name": "Sun — Mountain over Lake (山澤損)", "text": "Sun signifies sacrifice and loss that leads to the accumulation of virtue — the wisdom of seeking what is greater by relinquishing what is lesser. Good fortune follows after early hardship. Celestial Guidance) Rather than seeking immediate small gain, it is the wiser course to dig deep and seek the greater harvest that lies ahead. Though initial labour and loss are present, by bringing joy to others in this way and giving freely and generously without reservation in pursuit of great aspirations, results shall in the end be realised. Enterprise) Launching a new enterprise may bring early difficulty, yet the future is promising. Proceed without haste in a careful and steady manner. Though the immediate appearance is one of loss, steady perseverance shall bring fine results — this is the principle of early hardship yielding to later flourishing. Yet impure and improper matters must not be touched. Wealth) Expenditure is heavy at this time — careful attention to financial management is essential. Abundance shall come in the future. Romance) A sincere and genuine love unfolds. A fine bond of destiny shall be encountered. Vitality) Attend to building physical strength and conditioning. A disciplined and regulated life is essential."}, "☶☲": {"no": 51, "name": "Ben — Mountain over Fire (山火賁)", "text": "Ben signifies adornment and embellishment — giving beautiful form and outward splendour. Celestial Guidance) As the evening glow of the setting sun paints the world in crimson, the mind becomes given over to sentiment and imagination rather than cool rational thought. Likewise there is a tendency to become preoccupied with outer appearances. Live in accordance with your proper station and seek real substance. Allow plans to unfold gradually — this is the better course. Though outwardly splendid, inner difficulties may accompany this; the future must be planned and shaped with care. Learning and scholarship are also favoured. Enterprise) Ventures with a heavy emphasis on outward show carry risk. Small-scale enterprise shall proceed quite well. Consider the benefit of the other party especially — only so is there good fortune. Everyday transactions proceed smoothly, but formal contracts must be properly concluded. Be wary of the honeyed words of the other party. Wealth) Small sums flow in easily. Occasions to receive gifts tend to multiply. Reduce extravagance and waste. Romance) True sincerity toward the other is what prevents failure. Preoccupation with outward appearance leads easily to loss. The other party must be observed with calm and penetrating eyes. Vitality) Without a disciplined and regulated life, illness tends to arise. Take particular care against ailments of a sensitive nature."}, "☶☳": {"no": 52, "name": "Yi — Mountain over Thunder (山雷頤)", "text": "Yi signifies the jaw — nourishment and the proper provision for growth. Celestial Guidance) As the dragon descends into clear water, if there has been anything amiss in daily life, now is the time to correct it. Though the outward surface may appear peaceful through this process, just as restraint in eating and drinking is the very foundation of physical nourishment, this is a fitting time to plan new work or take up a new occupation. Pursue your work sincerely and in accordance with your proper station. To secure real gains, find colleagues of like mind and work together — fine results shall be obtained. Accumulating virtue in ordinary life and living with honesty and sincerity shall cause blessings to follow naturally. Enterprise) Receiving the assistance of colleagues and advancing step by step yields great gain. Yet excessive desire must not be indulged. Agreements in negotiations and dealings with others come easily. The substance of the other party must be judged with clarity to avoid loss. Careless words tend to cause loss — guard your speech. Wealth) Daily needs are not wanting. Yet excessive expectations are best not entertained. Romance) You shall associate with one whose spirit is in accord with yours. Practical and domestic circumstances must be resolved carefully. Vitality) Negligence of health leads easily to illness. Take care of digestive ailments."}, "☶☴": {"no": 53, "name": "Gu — Mountain over Wind (山風蠱)", "text": "Gu signifies stagnation calling for renewal — the wind blowing from beneath the mountain. Celestial Guidance) The spirit of improving what has gone wrong is essential. Pursuing only comfort and ease in daily life leads to the decay of body and mind — what is distorted and corrupted must be grasped firmly and set right. Through this process there may at times be mental and spiritual anguish, yet having overcome it, things shall flourish more greatly than before. Do not draw petty people close to you — in the end there is no benefit in it. Enterprise) You must adapt well to the shifts and changes in surrounding circumstances. Do not rush aggressively into new ventures or expansion; first put your internal affairs in thorough order and then respond accordingly — this proves the more advantageous course. Wealth) Daily life is not uncomfortable. Yet since expenditure tends to exceed income at this time, extravagance or excessive consumption shall bring difficulty. Romance) Frivolous and playful relations are not appropriate. Complex or unnatural associations tend to arise. If this is a newly forming relationship, the sincerity of the other party should be examined carefully. Vitality) If a long-standing ailment persists, prompt treatment is best."}, "☶☵": {"no": 54, "name": "Meng — Mountain over Water (山水蒙)", "text": "Meng signifies youth and inexperience — the uncultivated state of one who has not yet found the way. Celestial Guidance) A spring wells up from beneath the mountain with difficulty and obstruction before it. Establishing a clear vision is not easy, and rash action must be strictly avoided. Just as a disciple must seek instruction and enlightenment from a teacher, listening with careful and receptive attention is what is needed. Moreover, combining your strength with that of fine allies shall cause your aims to be accomplished smoothly. The potential for development is boundless — look toward the future and accumulate virtue with the steadiness and weight of a mountain. Even water that emerges from a mountain gorge reaches the broad sea in time through patient effort. Acting in harmony with the appointed season brings the highest good fortune. Enterprise) Heed the counsel of superiors and senior companions when formulating your plans. In negotiations and dealings, it is also wise to entrust matters to someone of proven competence. Even if firm results are not obtained at first, matters shall gradually improve. Wealth) Expenditure on uncertain or unclear purposes tends to be considerable — careful internal management and close attention to outgoings are necessary. Romance) Even when the other party is eager and forward, you yourself tend to be unable to reach a clear decision and may act in ways that seem ambiguous. Wait a little and the right season for an ideal union shall arrive. Vitality) The cause of symptoms tends to be unclear. Take care of respiratory ailments."}, "☶☶": {"no": 55, "name": "Gen — Mountain over Mountain (艮為山)", "text": "Gen signifies stillness and abiding — remaining firm and unmoved in one's proper place. Celestial Guidance) The time calls for guarding what you have been doing and keeping faithfully within your proper station. Just as the mountain abides steadfast in one place, hold an immovable heart and unwavering integrity, and wait for the fine season to arrive. Rather than moving rashly, building your real abilities in preparation for the future is the wiser course. Discern clearly when to advance and when to withdraw, in accordance with the time and the place. When the moment calls for stillness, be still; when the moment calls for action, act. In fields where progress is being made, great achievement is possible. Enterprise) Rather than pursuing two ventures simultaneously, concentrating your energies on one is more advantageous. The scattering of strength must be prevented. Before entering actively into dealings, observe the other party from a watchful distance. The will to act is present, but if your workload is already considerable, it is wiser to build up your strength first and then begin anew. Forcing things is not good. Apply resourcefulness and adaptability with appropriate judgment. Wealth) Ready funds are not plentiful. Romance) A relationship of uncomplicated friendship or spiritual meeting of minds. Shared interests and spiritual connection are the foundation. Vitality) Attend to nourishment and physical care."}, "☶☷": {"no": 56, "name": "Bo — Mountain over Earth (山地剝)", "text": "Bo signifies stripping away — the mountain crumbling, and the need to step clear of the falling debris before it strikes. Celestial Guidance) The image of a high mountain battered by wind and rain. Review carefully the work you have been pursuing until now. If you are contemplating a new venture, thorough preparation in advance is essential to avoid error. Just as one waits through winter for the return of spring, in order for things to turn in your favour, gather your scattered spirit and body and wait for the fine season to come — this is the way of things. Rash pursuit of any venture must be avoided. In certain matters, keeping your distance is the wisest course. Even if burdened with obligations that exceed your capacity, forming alliances and receiving the assistance of superiors and colleagues shall allow your aims to proceed smoothly. Enterprise) Before expansion, devote yourself first to faithful internal management. Neglect of management may lead to unexpected loss. First understand the other party thoroughly and conduct sufficient investigation before entering into any transaction — only so is loss avoided. Wealth) Unnecessary expenditure caused by the affairs of those around you tends to be considerable at this time. Extravagance and waste must be avoided. Romance) Even when many of the opposite sex are around you, if the connection lacks genuine earnestness, it is better to clear it away promptly. Guard carefully against entanglements. If marriage through an intermediary is contemplated, first examine closely the sincerity of the matchmaker. Vitality) If a long-standing ailment exists, treatment is necessary. Beware of depletion of physical vitality."}, "☷☰": {"no": 57, "name": "Tai — Earth over Heaven (地天泰)", "text": "Tai signifies peace and great ease — the highest harmony of all conditions. Celestial Guidance) The small departs and the great arrives — all things are brought to harmonious completion. Fortune is greatly auspicious and all you set your heart upon shall be accomplished smoothly. As those around you are united in spirit and purpose, whatever you undertake proceeds as though with the wind behind the sails, advancing without obstacle or difficulty. Outwardly yielding and inwardly steadfast — there is the image of complete contentment. Holding great ambitions and striving with sincere devotion makes things even more auspicious. Yet when all goes well, arrogance and indolence tend to follow — this must be vigilantly guarded against. Those who cultivate the virtue of the noble person shall prosper; those of petty character shall decline. Enterprise) This is a season in which the harvest of results far exceeds the effort invested. Small investment yields large return. Active and bold pursuit causes negotiations and dealings to be accomplished with ease. Greater attention to internal management is needed. Wealth) Great income may be expected. Unexpected windfall is possible and the flow of funds is smooth and free. Romance) A fine partner may be introduced to you. You shall come to know a virtuous woman who leans upon the man while still guiding the atmosphere of the relationship with grace. For women, the man in question is broad-hearted and ideal. This is a fitting time to consider marriage. Vitality) The body is healthy, though illness may occasionally arise from a life lacking in discipline and moderation. Take care of headaches."}, "☷☱": {"no": 58, "name": "Lin — Earth over Lake (地澤臨)", "text": "Lin signifies presiding and governing — meeting each situation with resourceful and nimble response. Celestial Guidance) Like fish and the dragon meeting the wide open sea and river — just as yang energy grows and flourishes in spring and summer, this is a time of great expected activity and achievement. Yet precisely because fortune is strong, there is also a tendency to race too far ahead. Beginning new work is also fine, yet in all action one must proceed with thoughtful care. Prepare and take precaution for the future as well. Times of change demand cooperation with the allies around you, and the capacity for decisive and nimble judgement is essential. Yet even with such fortune, allowing oneself to fall into arrogance must be guarded against. Enterprise) Beginning a new enterprise proceeds smoothly. Yet deliberate caution is necessary. In dealings and negotiations with others, a moderate and measured approach proves more advantageous than a hardline stance. Keep pace with the changes around you. Wealth) There is a surplus. Yet extravagance tends to be a temptation — expenditure must be made with careful consideration. Romance) A bright and sweet romance unfolds. Yet in matters of marriage, the other party may hesitate on account of family circumstances. This is a time to meet a fine partner — strive with effort to bring the matter to fruition. Heeding the counsel of a senior or superior may also be needed. Vitality) As health is good, even minor illness recovers easily. Be careful not to mistake mild symptoms for serious illness. Take care of the respiratory system."}, "☷☲": {"no": 59, "name": "Ming Yi — Earth over Fire (地火明夷)", "text": "Ming Yi signifies the wounding of the light — turning away from brightness and facing into the darkness. Celestial Guidance) The portent that a great sage is about to come forth into the world is said to appear in this form — the sacred auspicious creature that treads upon nothing impure and partakes of nothing that is not right. This is the image of waiting for the sage. The wisest course is to cultivate your inner abilities quietly and with calm composure in preparation for the future. In particular, those engaged in steady cultivation of ability — such as academic research or preparation for examinations — shall reap fine rewards. If one grows complacent in reliance on one's own capacities and falls into idle living, there shall in the end be no benefit. Even if difficulties arise in your work, hold to the righteous path until circumstances return to their proper state. Keep the brightness of light within your heart while outwardly conducting yourself with yielding gentleness. Bestow virtue freely and guard against the jealousy and gossip of others. Beware of harmful temptations and deception. Hold your mind upright and true — only so is there benefit. Enterprise) Devotion to your present work is the better course. New ventures and the expansion of enterprise tend to be attended by difficulty — thorough planning and preparation are necessary. Exercise caution in dealings. Wealth) Funds are not plentiful. Even when wealth is considerable, displaying it before others brings unexpected loss. Romance) A private and secret association, hidden from the eyes of others, tends to develop. There is much that is kept concealed. One-sided attachment is also a possibility. Vitality) Attend to building physical strength and nourishment. Take care of digestive ailments."}, "☷☳": {"no": 60, "name": "Fu — Earth over Thunder (地雷復)", "text": "Fu signifies return — the coming back of what has departed. Celestial Guidance) Like the warmth of spring returning after the long winter has passed — in the cycle of the seasons, this corresponds to the winter solstice, when the days begin to lengthen and yang energy first stirs again. The self-confidence and capacity to begin new things shall arise within you. If a promising venture is discovered, a posture of patient and steady effort shall be crucial. Yet at this stage, proceeding with excessive haste is not right — the fortune is not yet at full strength. Therefore, lay your plans step by careful step, beginning with what is close at hand and gradually extending outward toward what is more distant. Like digging into the earth to bring forth gold, the time when you may act freely and with full power is approaching. In particular, those who have been wandering far from their homeland shall return in honour and glory; those who have been striving for their aspirations shall at last see them realised and receive the just reward of their efforts. Enterprise) Life and vigour gradually return. Yet if you rashly scatter your energies across many ventures, there shall be little benefit. In transactions, take care with contracts. Wealth) Daily needs are not lacking. Yet those engaged in commerce may find the flow of funds not entirely smooth. Romance) Many of the opposite sex tend to gather around you, though the relationship tends to remain at the level of simple friendship. For those seeking remarriage or reunion, this Sacred Hexagram carries an auspicious meaning. For a first marriage, careful and deliberate consideration is needed. Vitality) Even long-standing illness shall in time recover. Take care of gastrointestinal conditions."}, "☷☴": {"no": 61, "name": "Sheng — Earth over Wind (地風升)", "text": "Sheng signifies ascent — the steady rising upward. Celestial Guidance) Great things are built by the accumulation of small ones. Your abilities shall receive their due recognition and you shall gradually be given the opportunity to deploy your aspirations fully. Like a young sapling that grows from a seed into a great tree, you are walking the path of gradual growth. Yet this is not a single leap to great heights — advancement must be built stage by stage. Strive earnestly and without fail you shall achieve your goal. Drawing close to fine allies and respected superiors is advantageous. The advancement of virtue and position always requires the assistance of a person of great influence and standing. At first your own strength is not yet sufficient, so rash action must be avoided. Enterprise) New plans and new contracts take shape. Great gains cannot be expected immediately, yet with vigorous fortune, active movement yields fine results. High returns shall be realised even on modest capital. However, speculative ventures are not favourable. Wealth) You may expect a return proportional to the effort you have invested. Income shall increase gradually. Romance) If the bond is already long-established, the intimacy shall deepen and grow. A fine destined connection. Vitality) Take care of digestive ailments."}, "☷☵": {"no": 62, "name": "Shi — Earth over Water (地水師)", "text": "Shi signifies the great host — disciplined and purposeful collective movement. Celestial Guidance) This Sacred Hexagram is like the image of water held within the earth. Groundwater realises its true value only when it emerges to the surface and is given to all living things. Therefore, in the days ahead you shall come to lead and direct a great many people. As great numbers gather and competition intensifies and confusion arises, the proper posture to adopt must be discerned — meeting all things with sincerity shall cause blessings to follow. Attend faithfully to internal management and strive with sincere devotion. A fine ally or wise counsellor whose assistance may be sought is greatly needed. Enterprise) Guarding your present work faithfully brings benefit. When launching new ventures, first pursue the unity of those within before turning outward. Active pursuit of negotiations and dealings with others proves advantageous. Wealth) Material resources sufficient for comfortable daily living shall be present. Placing emphasis on public and collective endeavour rather than private interests shall bring greater gain. Romance) Practical daily life takes priority and there is a degree of strain. First stabilising the circumstances of daily life is necessary for marriage to proceed smoothly. For men, entanglement is not favourable. Vitality) Ailments arising from chronic conditions require that time be set aside for health and rest."}, "☷☶": {"no": 63, "name": "Qian — Earth over Mountain (地山謙)", "text": "Qian signifies humility — lowering oneself and conducting oneself with gracious modesty in all things. Celestial Guidance) Guard your conduct with care and deal with all those around you with genuine humility. Living in accordance with proper principles shall cause blessings to come naturally. Excess is worse than deficiency — what you have in surplus should be shared with those who lack. Do not give way to greed; the posture of generosity toward those around you is what matters most. The way of humble yielding penetrates to every corner of life without exception. The moon veiled in cloud shall reveal its light of its own accord when the time comes. When the moon is full, the virtue of humility is what sustains and preserves what has been attained. Enterprise) Consolidate your foundations and attend faithfully to internal management. Do not rush in negotiations and dealings. Following the proper order and procedure increases the likelihood of successful conclusion. Wealth) Not overflowing, yet daily life is without discomfort. Living with a spirit of ease and contentment, abundance shall soon follow. Romance) Men shall find many women around them. Relations lacking in genuine sincerity are best avoided altogether. Excessive desire risks bringing financial loss. For those planning marriage, if there is a strong spiritual unity with the partner, it shall be accomplished — though it may take time. Cultivate the strong and resolute spirit that befits a man. Vitality) Take care of chronic ailments."}, "☷☷": {"no": 64, "name": "Kun — Earth over Earth (坤為地)", "text": "Kun embodies the boundless and infinite earth — the limitless expanse that receives all things. Celestial Guidance) The great earth possesses the virtue of bearing and nurturing all things without limitation or condition. Like a gentle and yielding mare walking upon the earth, following rather than leading is what brings the greater good fortune. Just as the earth embraces and nourishes all living things, bestow virtue upon others with an open and generous spirit. Observing your proper measure and holding your mind upright and true shall allow all things to be accomplished smoothly. Proceeding to the south-west enables fine allies to be found. Enterprise) Fine allies and partners may be encountered. Yet this is not a time to pursue new ventures with aggressive determination — excessive haste or undue indecision shall both lead to loss. First consider the benefit of the other party, and things shall proceed smoothly. Romance) A clear decision of the heart is not easily reached. Allowing things to drag on too long may cause the relationship to dissolve inconclusively. For those planning marriage, careful and deliberate consideration is needed. Vitality) Guard against fatigue."}};
  }
  return _ZAMI_EN_DATA[sym];
}

िया दें। धन) वास्तविक सार प्राप्त करने का समय है। दैनिक आवश्यकताएं पूर्ण हैं — धन के प्रति अत्यधिक आसक्ति से बचें। सम्मान की खोज शीघ्र फल देती है। प्रेम) समान स्वभाव वाले से मिलन होगा। विद्वान और परिष्कृत व्यक्ति उत्तम जोड़ हैं। विवाह स्वाभाविक रूप से होगा। दंपती के बीच स्नेह गहरा होगा। स्वास्थ्य) स्वस्थ हैं; रोग आए तो प्राकृतिक रूप से ठीक होगा। अत्यधिक उपचार की आवश्यकता नहीं।"}, "☰☴": {"no": 5, "name": "गोउ — स्वर्ग के ऊपर वायु (天風姤)", "text": "गोउ का अर्थ है मिलन — शक्तियों का संयोग। दिव्य मार्गदर्शन) सूर्य और चंद्रमा अंधकार से गुज़रकर पुनः प्रकाशित होते हैं। अपने लक्ष्य स्पष्ट करें और उनके अनुसार जीएं; दृढ़ संकल्प के बिना अनुकूल क्षण चूक जाएंगे और हानि होगी। इस काल में धन संचय संभव है — अप्रत्याशित लाभ भी हो सकता है, किंतु छल से हानि भी। शीतल और स्पष्ट विवेक से कार्य करें। इस दिव्य षट्कोण में समय सर्वोपरि है। उद्यम) नए क्षेत्रों में शक्ति बिखेरने की अपेक्षा वर्तमान कार्य में समर्पित रहें। धैर्यपूर्वक आगे बढ़ने से अप्रत्याशित अवसर मिलेगा। छल और मूल्यवान वस्तुओं की हानि से सावधान रहें। धन) छोटी रकम आती है, बड़ी जाती है। अपनी सीमा में जीएं। प्रेम) संबंध स्वार्थपरक और क्षणिक होते हैं। स्त्रियां इतनी लोकप्रिय हो सकती हैं कि सच्चा प्रेम पाना कठिन हो। मित्रतापूर्ण व्यवहार के पीछे छिपे इरादे पहचानें। स्वास्थ्य) थकान से सावधान रहें।"}, "☰☵": {"no": 6, "name": "सोंग — स्वर्ग के ऊपर जल (天水訟)", "text": "सोंग का अर्थ है उच्च सत्ता के समक्ष अपना पक्ष रखना। दिव्य मार्गदर्शन) दूसरों के विचारों का सम्मान और अनुसरण करना होगा। स्वयं को सही मानते हुए भी संयम रखें। परिस्थितियों के साथ तालमेल बिठाने की मुद्रा आवश्यक है। विनम्र और मृदु स्वभाव से आशीर्वाद स्वतः आएगा। वाणी और कर्म में सावधानी रखें; अन्यथा मतभेद या धन विवाद संभव है। उद्यम) अपनी सीमा से बड़े उपक्रम न करें। साझेदारी अशुभ है। दस्तावेज़ों को बड़ी सतर्कता से संभालें। वार्ता में निश्चित निष्कर्ष पर पहुंचें। एकाकी न रहें — किसी विश्वसनीय तीसरे पक्ष का सहयोग लें। प्रेम) परिस्थितियां और दृष्टिकोण अक्सर अलग रहते हैं। उज्ज्वल और प्रसन्न मुद्रा बनाए रखें। पहले समझने की कोशिश करें — छोटे मतभेद सुलझ जाएंगे। स्वास्थ्य) पाचन का ध्यान रखें।"}, "☰☶": {"no": 7, "name": "दुन — स्वर्ग के ऊपर पर्वत (天山遯)", "text": "दुन का अर्थ है पीछे हटना — कठिनाई से सुरक्षित स्थान पर आश्रय लेना। दिव्य मार्गदर्शन) भाग्य और दुर्भाग्य परस्पर विपरीत हैं: प्रारंभिक कठिनाई के बाद शांति आती है। मजबूरन आगे बढ़ने की बजाय यथास्थिति बनाए रखना अधिक लाभकारी है। योजनाओं में आरंभ और अंत दोनों देखकर चलें। जटिल कार्यों से कभी-कभी विराम लेकर शांत आनंद खोजें। क्षुद्र प्रभावों को दूर रखें। कोई भी कार्य करने से पहले पूर्व प्रयास आवश्यक है। उद्यम) वास्तविक लाभ के लिए महान योजनाओं से पहले छोटे कार्यों को ईमानदारी से करें। वार्ता में स्वयं आगे न बढ़ें। निवेश में सावधानी रखें। धन) व्यय आय से अधिक है — सावधानीपूर्वक प्रबंधन करें। किसी के लिए ज़मानत देना खतरनाक है। न उधार लें न दें। प्रेम) सामाजिक दायित्वों से भी व्यय होता है। पहले अपनी स्थिति सुदृढ़ करें। स्वास्थ्य) नियमित शारीरिक देखभाल आवश्यक है। दीर्घकालिक रोगों से सावधान रहें।"}, "☰☷": {"no": 8, "name": "पी — स्वर्ग के ऊपर पृथ्वी (天地否)", "text": "पी का अर्थ है अवरोध — नींव के अभाव में कार्य रुक जाता है और प्रवाह नहीं होता। दिव्य मार्गदर्शन) प्रारंभिक कठिनाई हो तो भी धीरे-धीरे मार्ग खुलेगा। कठिनाई सहने से अप्रत्याशित महान फल मिलता है। विलासिता त्यागें और मितव्ययी सद्गुण से आंतरिक शक्ति बनाएं। उदार और सावधान आचरण से शुभ आशीर्वाद मिलेगा। सम्मान और धन की अत्यधिक चाहत न रखें; ऊपर और नीचे के बीच संवाद सुगम रखना सबसे महत्वपूर्ण है। उद्यम) आक्रामक रूप से आगे बढ़ने की बजाय शांत गति से चलें। आंतरिक प्रबंधन पर अधिक ध्यान दें। विरोधी पक्ष मजबूत स्थिति में है — दीर्घकालिक संबंध में कोई कठिनाई नहीं। धन) सामान्यतः अपर्याप्त। दस्तावेज़ और वित्त सावधानी से संभालें। प्रेम) दूसरे पक्ष की सच्चाई पहचानकर कार्य करें। पुराने संबंध ठीक हैं; नए में सामंजस्य के लिए प्रयास आवश्यक है। विवाह की योजना रखने वालों को समय के साथ सफलता मिलेगी। स्वास्थ्य) शारीरिक शक्ति निर्माण महत्वपूर्ण है। भूख न लगने पर सावधान रहें।"}, "☱☰": {"no": 9, "name": "गुआई — झील के ऊपर स्वर्ग (澤天夬)", "text": "गुआई का अर्थ है दृढ़ निश्चय और निर्णायक कर्म। दिव्य मार्गदर्शन) आपका भाग्य उगते सूर्य की भांति उज्ज्वल है। नौकरीपेशा लोग पदोन्नति पाएंगे; विद्यार्थी प्रगति करेंगे। किंतु विनम्रता छोड़ने पर असफलता आ सकती है। अति सदैव कमी से बुरी होती है — संतुलन बनाए रखें। वरिष्ठों के प्रति आदर और अधीनस्थों के प्रति उदारता रखें। उद्यम) स्पष्ट योजना बनाकर उचित अवसर की प्रतीक्षा करें। अंधाधुंध आगे बढ़ने से हानि होगी। व्यापार में शीघ्रता न करें — दूसरे पक्ष के अनुसार प्रतिक्रिया दें। दूसरों के लिए ज़मानत न दें। धन) प्रचुर संपदा मिलेगी — अत्यधिक लोभ से बचें। आसपास के लोगों का हित सोचें और उचित दान करें। प्रेम) स्थिति जटिल है। प्रिय से संघर्ष हो तो शीघ्र सुलझाएं। पहले दूसरे को परखें। स्वास्थ्य) रोग आए तो तुरंत उपचार करें। श्वसन रोगों से सावधान रहें।"}, "☱☱": {"no": 10, "name": "दुई — झील के ऊपर झील (兌為澤)", "text": "दुई का अर्थ है आनंद और प्रसन्नता। दिव्य मार्गदर्शन) वसंत की कोमल वर्षा में वनस्पतियां पुनर्जीवित होती हैं — दैनिक जीवन में अनेक आशापूर्ण और सुखद घटनाएं होंगी। किंतु इस दिव्य षट्कोण में आनंद के साथ-साथ आंतरिक अपूर्णता का भाव भी है। सभी बड़े कार्यों का स्पष्ट समापन करें और विवादों से बचें। संगठन के आंतरिक संघर्षों या गुटबाजी में न पड़ें। उद्यम) वर्तमान कार्य में समर्पण से उत्तम फल मिलेगा। सार और ठोसता बनाएं। बिक्री और प्रचार-प्रसार के कार्य सफल हैं। दूसरे के साथ व्यवहार में संतुलित दृष्टिकोण लाभकारी है। विश्वास और सद्भाव से विजय पाएं। धन) आरामदायक जीवन के लिए पर्याप्त — यद्यपि बाहरी समृद्धि आंतरिक वास्तविकता से अधिक दिखती है। धीरे-धीरे सुधार होगा। प्रेम) बाहरी रूप पर केंद्रित क्षणिक और मनोरंजक संबंध की प्रवृत्ति है। विवाह योजना में दूसरे की सच्चाई परखें। हृदय के विषयों में अत्यधिक आसक्ति न रखें। स्वास्थ्य) मुख के रोगों का ध्यान रखें।"}, "☱☲": {"no": 11, "name": "गे — झील के ऊपर अग्नि (澤火革)", "text": "गे का अर्थ है सुधार — जो पुराना है उसे नवीन करना और रूपांतरित करना। दिव्य मार्गदर्शन) पुरातन को त्यागकर नवीन को अपनाने का समय आया है। आसपास के लोग बदल रहे हैं और कार्य में नए क्षेत्र खुल रहे हैं। जो नेतृत्व में हैं और सुधार का समय आया जानते हैं, वे निर्णायक रूप से परिवर्तन लाएं। विवाह या परिवार विस्तार भी संभव है। कुल मिलाकर परिवर्तन के लिए उत्तम काल है — सही मार्ग खोजना आवश्यक है। उद्यम) नया उपक्रम आकार ले रहा है। घर का नवीनीकरण या स्थानांतरण संभव है। लेनदेन में अच्छा अवसर भी है — किंतु अत्यधिक शीघ्रता न करें। धन) धन भाग्य प्रबल है — निवेश और परिश्रम के अनुसार बड़ा लाभ संभव है। प्रेम) विवाह का सुअवसर चूके लोगों को योग्य साथी मिलेगा। सच्चाई के साथ संबंध रखें। स्वास्थ्य) पुराना रोग हो तो शीघ्र उपचार करें। थकान से सावधान रहें।"}, "☱☳": {"no": 12, "name": "सुई — झील के ऊपर वज्र (澤雷隨)", "text": "सुई का अर्थ है अनुसरण करना — प्रवाह के अनुसार अनुकूलित होकर चलना। दिव्य मार्गदर्शन) ग्रीष्म में वज्र भले ही प्रचंड हो, यह वह काल है जब परिवेश के अनुसार ढलकर कार्य करना है। दूसरों की सलाह मानना सबसे बुद्धिमान मार्ग है। सावधानीपूर्वक अपनी क्षमता निखारने से अवसर स्वतः आएंगे। तेज़ी से परिस्थितियों के अनुकूल बनें। जो सक्रिय रहे हैं वे अब दूसरों की सुनें और आत्मचिंतन करें। सज्जन ऋतु के अनुसार चलता है। कभी सीमित क्षमता वाले के साथ काम करना पड़ सकता है — उदार हृदय रखें और हस्तक्षेप न करें। उद्यम) प्रचलित प्रवृत्तियों के अनुसार चलने से उत्तम फल मिलता है। परिवेश का अवलोकन न करना हानिकारक है। अनुभवी पक्षों से वार्ता होगी। धैर्य और दृढ़ता से कार्य पूर्ण होता है। धन) धन प्रवाह सुगम और आय बढ़ती है; व्यय भी बढ़ता है। प्रेम) साथी प्रायः बड़ी आयु के होते हैं। त्रिकोण संबंध से सावधान रहें। विवाह की योजना सुगम रहेगी — विवाह पश्चात् आत्मिक एकता के लिए प्रयास करें। स्वास्थ्य) छोटी बीमारियों को भी नज़रअंदाज़ न करें। ऋतु परिवर्तन के समय सावधान रहें।"}, "☱☴": {"no": 13, "name": "दा गुओ — झील के ऊपर वायु (澤風大過)", "text": "दा गुओ का अर्थ है अति — जो उचित है उससे बहुत अधिक जाना। दिव्य मार्गदर्शन) अति सदा अभाव से बुरी होती है। सही मार्ग पर रहें और मध्यम मार्ग अपनाएं — केवल तभी शुभ फल मिलेगा। आप पर अनेक उत्तरदायित्व हो सकते हैं। फिर भी सभी को एक साथ सुलझाने का प्रयास न करें। छोटी बातें स्थगित रखें और मन की शांति बनाए रखें। दूसरों का सहयोग लें; जहांसमझौता की आवश्यकता हो, वहाँ नम्रता सेसमझौता करें। उद्यम) अपनी क्षमता से बड़े उपक्रम न करें। पहले मजबूत नींव रखें और आंतरिक प्रबंधन में लगें। संतुलित दृष्टिकोण से कोई परिचित अप्रत्याशित सहायता देगा। व्यक्तिगत मामले स्थगित करें किंतु महत्वपूर्ण कार्य साहसपूर्वक करें। धन) आय और व्यय में संतुलन रखें। प्रेम) संबंध जटिल और सूक्ष्म होता है। बड़े आयु अंतर वाले से संबंध की संभावना अधिक है। सबसे पहले दोनों के स्वभाव में सामंजस्य लाएं। स्वास्थ्य) अत्यधिक परिश्रम न करें। पाचन समस्या और शक्ति क्षरण से सावधान रहें। पुराने रोगों का शीघ्र उपचार करें।"}, "☱☵": {"no": 14, "name": "कुन (澤水困) — झील के ऊपर जल", "text": "कुन का अर्थ है बंधन — बाहरी परिस्थितियों से अवरुद्ध और बाधित होना। दिव्य मार्गदर्शन) अपनी सीमा जानें और ऋतु की प्रतीक्षा करें। धर्मनिष्ठ विश्वास और दृढ़ कर्म से ईमानदारी से प्रयास करें। स्पष्ट उद्देश्य के साथ जीने से दुर्भाग्य शुभ में बदलता है। कठिनाई आए तो शांत मन से धैर्य रखें। इस प्रकार अपनी कमियां जानें, वास्तविक क्षमता बनाएं, और उन्नति का नया अवसर मिलेगा। उत्तम वरिष्ठों और योग्य साथियों के निकट रहें। उद्यम) दूसरों की चापलूसी से सावधान रहें। वर्तमान कार्य में दृढ़ रहें और क्षमता निखारें। वार्ता में शीघ्रता न करें; कुछ हद तकसमझौता करना उचित है। कार्य का स्पष्ट समापन करें। धन) व्यय आय से अधिक है। विलासिता और अपव्यय कम करें। दूसरों के छल में न आएं। प्रेम) अशुद्ध संबंध शीघ्र समाप्त करना बुद्धिमानी है। बड़े आयु अंतर वाले से विशेष सावधानी। दूसरे की सच्चाई सटीक रूप से परखें। एकतरफा प्रेम के जाल में न पड़ें। स्वास्थ्य) शारीरिक देखभाल करें। अत्यधिक परिश्रम से बचें।"}, "☱☶": {"no": 15, "name": "शियान — झील के ऊपर पर्वत (澤山咸)", "text": "शियान का अर्थ है पारस्परिक अनुनाद — ईमानदार प्रयास के प्रति स्वर्ग और पृथ्वी का अनुभूत प्रतिसाद। दिव्य मार्गदर्शन) जैसे सूखी भूमि पर जीवनदायी वर्षा पड़ती है, ईमानदार और समर्पित प्रयास देवताओं को भी द्रवित करेगा। जो सही है उसे अपनाएं और सत्यनिष्ठा से कर्म करें — अप्रत्याशित सुंदर फल मिलेगा। आसपास के लोगों के साथ गहरी आत्मिक मित्रता बनाए रखें और अधीनस्थों की आकांक्षाओं को उदारता से अपनाएं। दूसरों की सहायता से अप्रत्याशित उत्सव आएंगे। उद्यम) इस समय अनेक सहायक मिलते हैं। उत्तम विचार वाले से मिलन होगा। लक्ष्य निर्धारित होने पर शीघ्रता से आगे बढ़ें — संकोच से अवसर छूट जाता है। वार्ता अपेक्षा से जल्दी और अच्छी होगी। धन) आरामदायक जीवन के लिए पर्याप्त। परिश्रम और कुशलता से बड़ी राशि की भी उम्मीद रखी जा सकती है। प्रेम) आदर्श साथी से मिलन होगा और उत्साहपूर्ण प्रेम होगा। इस समय बना विवाह सुखी और सामंजस्यपूर्ण गृहस्थी देगा। स्वास्थ्य) शारीरिक स्वास्थ्य अच्छा है। सर्दी-जुकाम से सावधान रहें।"}, "☱☷": {"no": 16, "name": "कुई (澤地萃) — झील के ऊपर पृथ्वी", "text": "कुई का अर्थ है एकत्रण और समृद्धि — संग्रह से प्रचुरता उत्पन्न होना। दिव्य मार्गदर्शन) जैसे अजगर खुले समुद्र से मिलकर शक्ति से ऊपर उठता है, आपका उद्यम फलेगा-फूलेगा। अनेक लोग आपके साथ आएंगे। किंतु दूसरी ओर प्रतिस्पर्धा तीव्र होती है और विवाद सरल होते हैं — अनेकों के साथ मिलकर कार्य करने से महान उपलब्धियां मिलती हैं। जो भी करें, महान विवेक और सद्गुण वाले का परामर्श लें। उद्यम) भाग्य प्रबल है — आप आसानी से लक्ष्य पाएंगे। लेनदेन में केवल आर्थिक लाभ की चाहत न रखें — दूसरे का हित भी सोचें। धन) भौतिक समृद्धि होगी। अपनी क्षमता बढ़ाने पर ध्यान दें। प्रेम) आदर्श प्रेम होता है। किंतु अनेक दिशाओं में ध्यान बिखेरने से कोई भी लक्ष्य ठीक से नहीं मिलता। स्वास्थ्य) श्वसन रोगों से सावधान रहें।"}, "☲☰": {"no": 17, "name": "दा यू — अग्नि के ऊपर स्वर्ग (火天大有)", "text": "दा यू का अर्थ है महान संपदा — सभी वस्तुओं में प्रचुर बहुलता। दिव्य मार्गदर्शन) आपका भाग्य मध्याकाश में दहकते सूर्य की भांति चमकता है — शरद ऋतु की भरपूर फसल जैसा। संपत्ति प्रचुर है और आत्मा स्थिर; समस्त संसार में शांति है। किंतु जैसे सूर्य सदा मध्याकाश में नहीं रहता, जो प्राप्त हुआ उसे संजोने का प्रयास करें। परिवेश के परिवर्तनों की अनदेखी न करें और युग की प्रवृत्तियों के साथ चलें। उद्यम) उद्यम का भाग्य असाधारण रूप से प्रबल है — महान लाभ होगा। जो बनाया है उसे सुदृढ़ बनाए रखना सर्वोत्तम है। लेनदेन और वार्ता में शीघ्रता लाभकारी है। समूह में कार्य करना एकाकी से अधिक श्रेयस्कर है। धन) इस काल में संपत्ति प्रचुर और धन प्रवाह सुगम है। परिवार और मित्रों के लिए कभी-कभी व्यय हो सकता है। प्रेम) स्त्रियों की स्थिति प्रबल है। बुद्धिमान, स्वाभिमानी और आत्मविश्वासी स्वभाव — तीक्ष्ण और आकर्षक होती हैं। स्त्रियों के लिए आगे बढ़ने का उत्तम समय है। स्वास्थ्य) भूख और पाचन का ध्यान रखें।"}, "☲☱": {"no": 18, "name": "क्वेई (火澤睽) — अग्नि के ऊपर झील", "text": "कुई का अर्थ है विरोध और विचलन — अलगाव के बीच संघर्ष। दिव्य मा
